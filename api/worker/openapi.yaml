          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComparisonAccessRefused'}
          headers: *id001
        '500':
          description: 'Ours, not the caller''s: the key names a tier the service does not carry (tier_not_configured),
            or the deployment has no tier table (access_not_configured).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComparisonAccessRefused'}
          headers: *id001
        '503':
          description: The snapshot is not published, a retained snapshot cannot be read, or a live key
