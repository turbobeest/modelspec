    PolicyCheckRequest:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy:
          description: 'The constraints to check. State at least one of licence, origin, residency, commercial_use:
            an empty policy is a 400, never a clean pass.'
          type: object
          additionalProperties: false
          properties:
            name: {description: 'Optional label, echoed back.', type: string, nullable: true}
            licence:
              description: Matched against the card's license_type. A card naming no licence is undetermined,
                never allowed.
              type: object
              additionalProperties: false
              properties:
                allowed:
                  type: array
                  nullable: true
                  items: {type: string, minLength: 1}
                prohibited:
                  type: array
                  nullable: true
                  items: {type: string, minLength: 1}
            origin:
              description: Country codes, as the card records origin_country. A blank country is undetermined,
                never allowed.
              type: object
              additionalProperties: false
              properties:
                permitted_countries:
                  type: array
                  nullable: true
                  items: {type: string, minLength: 1}
                prohibited_countries:
                  type: array
                  nullable: true
                  items: {type: string, minLength: 1}
            residency:
              description: 'Regions spelled as the platform publishes them. Matched literally: no country
                is mapped onto a cloud region.'
              type: object
              additionalProperties: false
              required: [required_regions]
              properties:
                required_regions:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
                match:
                  type: string
                  enum: [any, all]
                  default: any
            commercial_use:
              description: '`required: false` is a 400; omit the block instead. A conditional grant fails
                unless accept_restricted is true, and carries its condition text either way.'
              type: object
              additionalProperties: false
              properties:
                required:
                  type: boolean
                  nullable: true
                  enum: [true, null]
                  default: true
                accept_restricted: {type: boolean, nullable: true, default: false}
        require_no_undetermined: {description: true turns any undetermined row into a 422 undetermined_present
            instead of a 200., type: boolean, nullable: true, default: false}
        models:
          description: Model ids to check; omit for the catalogue. Unknown is a 400.
          type: array
          nullable: true
          items: {type: string, minLength: 1}
          maxItems: 500
        platforms:
          description: Platform ids to check on; omit for every listed one.
          type: array
          nullable: true
          items:
            type: string
            enum: [ai21_labs, aws_bedrock, azure_ai_foundry, baidu_ernie, bytedance_doubao, cerebras,
              chatgpt, claude_ai, cohere, copilot_microsoft, cursor, deepinfra, deepseek, fireworks_ai,
              gemini_app, github_copilot, google_vertex_ai, gpt4all, grok_xai, groq, huggingface, ibm_watsonx,
              jan_ai, kaggle_models, lm_studio, meta_ai, minimax, mistral_plateforme, mlx_community, modelscope,
              moonshot_kimi, nvidia_nim, ollama, open_webui, openrouter, perplexity, poe, qwen_alibaba,
              raycast, replicate, sambanova, samsung_gauss, snowflake_cortex, stability_ai, tencent_hunyuan,
              tii_falcon, together_ai, upstage_solar, zero_one_ai, zhipu_glm]
        verdicts:
          description: Filters the rows returned. summary still counts every row.
          type: array
          nullable: true
          items:
            type: string
            enum: [pass, fail, undetermined]
        limit: {description: Pages result only; summary is never paged., type: integer, minimum: 0, maximum: 500,
          default: 50}
        offset: {type: integer, minimum: 0, default: 0}
    PolicyCheckResponse:
      type: object
      properties:
        build:
          type: object
          properties:
            built_at: {type: string}
            commit: {type: string}
            eligibility_as_of: {type: string}
            export_schema_version: {type: string}
          required: [built_at, commit, eligibility_as_of, export_schema_version]
        determinations:
          description: Which tier answered. undetermined_for_lack_of_entitlement is the whole free/paid
            difference, as a count, on every response.
          type: object
          properties:
            answered_from: {type: string}
            entitlement:
              description: 'public_export (free: the public export only) or determinations (paid). Granted
                by the tier of a presented key: see x-modelspec-access.'
              type: string
              enum: [public_export, determinations]
            included: {type: boolean}
            store:
              type: object
              properties:
                commercial_use_records: {type: integer}
                generated_on: {type: string, nullable: true}
                loaded: {type: boolean}
                residency_platforms: {type: integer}
              required: [commercial_use_records, generated_on, loaded, residency_platforms]
            undetermined_for_lack_of_entitlement: {type: integer}
            why: {type: string, nullable: true}
          required: [answered_from, entitlement, included, store, undetermined_for_lack_of_entitlement,
            why]
        endpoint: {type: string}
        export_origin: {type: string}
        page:
          type: object
          properties:
            limit: {type: integer}
            matching_rows: {type: integer}
            offset: {type: integer}
            returned: {type: integer}
            truncated: {type: boolean}
            verdicts_shown:
              type: array
              items:
                type: string
                enum: [pass, fail, undetermined]
          required: [limit, matching_rows, offset, returned, truncated, verdicts_shown]
        policy:
          description: The policy as parsed, which is the policy that was checked.
          type: object
          properties:
            constraints:
              type: object
              properties:
                commercial_use:
                  type: object
                  properties:
                    accept_restricted: {type: boolean}
                    required: {type: boolean}
                  required: [accept_restricted, required]
                licence:
                  type: object
                  properties:
                    allowed:
                      type: array
                      items: {type: string}
                    prohibited:
                      type: array
                      items: {type: string}
                  required: [allowed, prohibited]
                origin:
                  type: object
                  properties:
                    permitted_countries:
                      type: array
                      items: {type: string}
                    prohibited_countries:
                      type: array
                      items: {type: string}
                  required: [permitted_countries, prohibited_countries]
                residency:
                  type: object
                  required: [match, required_regions]
                  properties:
                    match: {type: string}
                    required_regions:
                      type: array
                      items: {type: string}
            name: {type: string, nullable: true}
            require_no_undetermined: {type: boolean}
          required: [constraints, name, require_no_undetermined]
        provenance:
          description: Every read date this answer rests on.
          type: object
          properties:
            determination_read_dates:
              type: object
              properties:
                commercial_use:
                  type: array
                  items: {type: string}
                residency:
                  type: array
                  items: {type: string}
            determinations_generated_on: {type: string, nullable: true}
          required: [determination_read_dates, determinations_generated_on]
        result:
          description: 'One row per (model, platform) pair. Branch on verdict: each row carries exactly
            one of passed, failed, undetermined.'
          type: array
          items: {$ref: '#/components/schemas/PolicyRow'}
        schema_version: {type: string}
        service_commit: {type: string}
        summary:
          description: Always every row the request selects, whatever limit, offset and verdicts say.
          type: object
          properties:
            by_constraint:
              type: object
              properties:
                commercial_use:
                  type: object
                  properties:
                    satisfied: {type: integer}
                    undetermined: {type: integer}
                    violated: {type: integer}
                  required: [satisfied, undetermined, violated]
                licence:
                  type: object
                  properties:
                    satisfied: {type: integer}
                    undetermined: {type: integer}
                    violated: {type: integer}
                  required: [satisfied, undetermined, violated]
                origin:
                  type: object
                  properties:
                    satisfied: {type: integer}
                    undetermined: {type: integer}
                    violated: {type: integer}
                  required: [satisfied, undetermined, violated]
                residency:
                  type: object
                  required: [satisfied, undetermined, violated]
                  properties:
                    satisfied: {type: integer}
                    undetermined: {type: integer}
                    violated: {type: integer}
            models_checked: {type: integer}
            models_undetermined_somewhere: {type: integer}
            models_with_a_passing_platform: {description: 'Counted over models, not rows: passes somewhere,
                not everywhere.', type: integer}
            rows: {type: integer}
            verdicts:
              type: object
              properties:
                fail: {type: integer}
                pass: {type: integer}
                undetermined: {type: integer}
              required: [fail, pass, undetermined]
          required: [by_constraint, models_checked, models_undetermined_somewhere, models_with_a_passing_platform,
            rows, verdicts]
      required: [build, determinations, endpoint, export_origin, page, policy, provenance, result, schema_version,
        service_commit, summary]
    PolicyRow:
      oneOf:
      - {$ref: '#/components/schemas/PassRow'}
      - {$ref: '#/components/schemas/FailRow'}
      - {$ref: '#/components/schemas/UndeterminedRow'}
      discriminator:
        propertyName: verdict
        mapping: {pass: '#/components/schemas/PassRow', fail: '#/components/schemas/FailRow', undetermined: '#/components/schemas/UndeterminedRow'}
    PassRow:
      type: object
      properties:
        checks:
          type: array
          items: {$ref: '#/components/schemas/PolicyCheck'}
        display_name: {type: string}
        model_id: {type: string}
        passed:
          type: object
          properties:
            conditions:
              description: The condition text of every conditional grant. A pass with conditions is not
                a bare yes.
              type: array
              items:
                type: object
                required: [constraint, source, text]
                properties:
                  constraint: {type: string}
                  source:
                    type: object
                    required: [kind, quote, read_on, url]
                    properties:
                      kind: {type: string}
                      quote: {type: string}
                      read_on: {type: string}
                      url: {type: string}
                  text: {type: string}
            constraints:
              type: array
              items: {type: string}
          required: [conditions, constraints]
        platform: {type: string}
        provider: {type: string}
        verdict:
          type: string
          enum: [pass]
      required: [checks, display_name, model_id, passed, platform, provider, verdict]
      not:
        anyOf:
        - required: [failed]
        - required: [undetermined]
    FailRow:
      type: object
      properties:
        checks:
          type: array
          items: {$ref: '#/components/schemas/PolicyCheck'}
        display_name: {type: string}
        failed:
          type: object
          properties:
            also_undetermined:
              description: Constraints still unknown on this row. They stay unknown if you relax the one
                that eliminated it.
              type: array
              items: {type: string}
            also_violated:
              type: array
              items: {type: string}
            constraint:
              type: string
              enum: [licence, origin, commercial_use, residency]
            eliminated_by: {$ref: '#/components/schemas/ViolatedCheck'}
          required: [also_undetermined, also_violated, constraint, eliminated_by]
        model_id: {type: string}
        platform: {type: string}
        provider: {type: string}
        verdict:
          type: string
          enum: [fail]
      required: [checks, display_name, failed, model_id, platform, provider, verdict]
      not:
        anyOf:
        - required: [passed]
        - required: [undetermined]
    UndeterminedRow:
      type: object
      properties:
        checks:
          type: array
          items: {$ref: '#/components/schemas/PolicyCheck'}
        display_name: {type: string}
        model_id: {type: string}
        platform: {type: string, nullable: true}
        provider: {type: string}
        undetermined:
          type: object
          properties:
            checks:
              type: array
              items: {$ref: '#/components/schemas/UndeterminedCheck'}
            constraints:
              type: array
              items: {type: string}
          required: [checks, constraints]
        verdict:
          type: string
          enum: [undetermined]
      required: [checks, display_name, model_id, platform, provider, undetermined, verdict]
      not:
        anyOf:
        - required: [passed]
        - required: [failed]
    PolicyCheck:
      oneOf:
      - {$ref: '#/components/schemas/SatisfiedCheck'}
      - {$ref: '#/components/schemas/ViolatedCheck'}
      - {$ref: '#/components/schemas/UndeterminedCheck'}
      discriminator:
        propertyName: state
        mapping: {satisfied: '#/components/schemas/SatisfiedCheck', violated: '#/components/schemas/ViolatedCheck',
          undetermined: '#/components/schemas/UndeterminedCheck'}
    SatisfiedCheck:
      type: object
      properties:
        constraint:
          type: string
          enum: [licence, origin, commercial_use, residency]
        requirement: {$ref: '#/components/schemas/Shared4ff9f6a29ddb'}
        satisfied:
          type: object
          properties:
            answered_from: {type: string}
            commercial_use: {type: string}
            conditional: {type: boolean}
            conditions: {type: string, nullable: true}
            determined_on: {type: string, nullable: true}
            license_type: {type: string}
            license_url: {type: string}
            matched:
              type: array
              items: {type: string}
            matching: {type: string}
            org_type: {type: string, nullable: true}
            origin_country: {type: string}
            platform: {type: string}
            published_regions:
              type: array
              items: {type: string}
            read_on: {type: string}
            source:
              type: object
              properties:
                kind: {type: string}
                quote: {type: string, nullable: true}
                read_on: {type: string}
                url: {type: string}
              required: [kind, quote, read_on, url]
        state:
          type: string
          enum: [satisfied]
      required: [constraint, requirement, satisfied, state]
      not:
        anyOf:
        - required: [violated]
        - required: [undetermined]
    ViolatedCheck:
      type: object
      properties:
        constraint:
          type: string
          enum: [licence, origin, commercial_use, residency]
        requirement: {$ref: '#/components/schemas/Shared4ff9f6a29ddb'}
        state:
          type: string
          enum: [violated]
        violated:
          type: object
          properties:
            answered_from: {type: string}
            because: {type: string}
            checked:
              type: array
              items: {type: string}
            commercial_use: {type: string}
            conditions: {type: string}
            determined_on: {type: string, nullable: true}
            documents:
              description: The documents a no-commitment finding was read from, each with the date it
                carries. Never an empty withheld answer.
              type: array
              items:
                type: object
                required: [read_on, url]
                properties:
                  read_on: {type: string}
                  url: {type: string}
            finding: {description: no_commitment when the paid answer is that the provider's documents
                name no region. Distinct from a determined empty list., type: string}
            license_type: {type: string}
            license_url: {type: string}
            matching: {type: string}
            missing:
              type: array
              items: {type: string}
            org_type: {nullable: true}
            origin_country: {type: string}
            platform: {type: string}
            published_regions:
              type: array
              items: {}
            read_on: {type: string}
            reason: {type: string}
            source:
              type: object
              nullable: true
              properties:
                kind: {type: string}
                quote: {type: string, nullable: true}
                read_on: {type: string}
                url: {type: string}
          required: [because]
      required: [constraint, requirement, state, violated]
      not:
        anyOf:
        - required: [satisfied]
        - required: [undetermined]
    UndeterminedCheck:
      type: object
      properties:
        constraint:
          type: string
          enum: [licence, origin, commercial_use, residency]
        requirement: {$ref: '#/components/schemas/Shared4ff9f6a29ddb'}
        state:
          type: string
          enum: [undetermined]
        undetermined:
          type: object
          properties:
            available_in_tier:
              description: paid when a paid entitlement would settle this; null when nothing can.
              type: string
              nullable: true
              enum: [paid, null]
            checked:
              type: array
              items: {type: string}
            determined_on: {type: string}
            field: {type: string}
            license_type: {nullable: true}
            license_url: {nullable: true}
            meaning: {type: string}
            platform: {type: string, nullable: true}
            public_state: {type: string}
            reason: {type: string}
            resolve: {type: string}
            source:
              type: object
              properties:
                kind: {type: string}
                quote: {nullable: true}
                read_on: {nullable: true}
                url: {nullable: true}
              required: [kind, quote, read_on, url]
            store_scope: {type: string}
            why:
              description: Why nobody knows. Each value leads somewhere different.
              type: string
              enum: [no_platform, not_determined, not_on_card, tier, unbounded, uncited]
          required: [available_in_tier, meaning, why]
      required: [constraint, requirement, state, undetermined]
      not:
        anyOf:
        - required: [satisfied]
        - required: [violated]
    PolicyRequestRefused:
      type: object
      properties:
        build:
          type: object
          properties:
            built_at: {type: string, nullable: true}
            commit: {type: string, nullable: true}
            eligibility_as_of: {type: string, nullable: true}
            export_schema_version: {type: string, nullable: true}
          required: [built_at, commit, eligibility_as_of, export_schema_version]
        endpoint: {type: string}
        error:
          type: object
          properties:
            accepted:
              type: array
              items: {type: string}
            code:
              type: string
              enum: [invalid_request, unknown_model, unknown_platform]
            fields:
              type: array
              items: {type: string}
            message: {type: string}
          required: [code, message]
        export_origin: {type: string}
        result:
          type: array
          items: {}
          maxItems: 0
        schema_version: {type: string}
        service_commit: {type: string}
      required: [build, endpoint, error, export_origin, result, schema_version, service_commit]
    UndeterminedPresent:
      type: object
      properties:
        build:
          type: object
          properties:
            built_at: {type: string}
            commit: {type: string}
            eligibility_as_of: {type: string}
            export_schema_version: {type: string}
          required: [built_at, commit, eligibility_as_of, export_schema_version]
        determinations:
          type: object
          properties:
            answered_from: {type: string}
            entitlement: {type: string}
            included: {type: boolean}
            store:
              type: object
              properties:
                commercial_use_records: {type: integer}
                generated_on: {nullable: true}
                loaded: {type: boolean}
                residency_platforms: {type: integer}
              required: [commercial_use_records, generated_on, loaded, residency_platforms]
            undetermined_for_lack_of_entitlement: {type: integer}
            why: {type: string}
          required: [answered_from, entitlement, included, store, undetermined_for_lack_of_entitlement,
            why]
        endpoint: {type: string}
        error:
          type: object
          properties:
            code:
              type: string
              enum: [undetermined_present]
            examples:
              description: Up to ten of the undetermined rows.
              type: array
              items: {$ref: '#/components/schemas/UndeterminedRow'}
            message: {type: string}
            remedy: {type: string}
            undetermined_by_constraint:
              type: object
              properties:
                commercial_use: {type: integer}
                residency: {type: integer}
            undetermined_rows: {type: integer}
          required: [code, examples, message, remedy, undetermined_by_constraint, undetermined_rows]
        export_origin: {type: string}
        policy:
          type: object
          properties:
            constraints:
              type: object
              properties:
                commercial_use:
                  type: object
                  required: [accept_restricted, required]
                  properties:
                    accept_restricted: {type: boolean}
                    required: {type: boolean}
                residency:
                  type: object
                  required: [match, required_regions]
                  properties:
                    match: {type: string}
                    required_regions:
                      type: array
                      items: {type: string}
            name: {nullable: true}
            require_no_undetermined: {type: boolean}
          required: [constraints, name, require_no_undetermined]
        provenance:
          type: object
          properties:
            determination_read_dates:
              type: object
              properties:
                commercial_use:
                  type: array
                  items: {type: string}
          required: [determination_read_dates]
        result:
          type: array
          items: {}
          maxItems: 0
        schema_version: {type: string}
        service_commit: {type: string}
        summary:
          type: object
          properties:
            by_constraint:
              type: object
              properties:
                commercial_use:
                  type: object
                  required: [satisfied, undetermined, violated]
                  properties:
                    satisfied: {type: integer}
                    undetermined: {type: integer}
                    violated: {type: integer}
                residency:
                  type: object
                  required: [satisfied, undetermined, violated]
                  properties:
                    satisfied: {type: integer}
                    undetermined: {type: integer}
                    violated: {type: integer}
            models_checked: {type: integer}
            models_undetermined_somewhere: {type: integer}
            models_with_a_passing_platform: {type: integer}
            rows: {type: integer}
            verdicts:
              type: object
              properties:
                fail: {type: integer}
                pass: {type: integer}
                undetermined: {type: integer}
              required: [fail, pass, undetermined]
          required: [by_constraint, models_checked, models_undetermined_somewhere, models_with_a_passing_platform,
            rows, verdicts]
      required: [build, determinations, endpoint, error, export_origin, policy, provenance, result, schema_version,
        service_commit, summary]
    DeterminationsUnavailable:
      type: object
      required: [build, endpoint, error, export_origin, result, schema_version, service_commit]
      properties:
        build:
          type: object
          required: [built_at, commit, eligibility_as_of, export_schema_version]
          properties:
            built_at: {type: string}
            commit: {type: string}
            eligibility_as_of: {type: string}
            export_schema_version: {type: string}
        endpoint: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [determinations_unavailable]
            message: {type: string}
        export_origin: {type: string}
        result:
          type: array
          items: {}
          maxItems: 0
        schema_version: {type: string}
        service_commit: {type: string}
    PaymentRequired:
      type: object
      required: [schema_version, error, result]
      properties:
        schema_version: {type: string}
        service_commit: {type: string}
        error:
          type: object
          required: [accepts, code, how_to_pay, message, payTo, price, resource, x402Version]
          properties:
            accepts:
              type: array
              items:
                type: object
                properties:
                  amount: {type: string}
                  asset: {type: string}
                  description: {type: string}
                  extra:
                    type: object
                    properties:
                      credits: {type: integer}
                      name: {type: string}
                      version: {type: string}
                    required: [credits, name, version]
                  maxAmountRequired: {type: string}
                  maxTimeoutSeconds: {type: integer}
                  mimeType: {type: string}
                  network: {type: string}
                  payTo: {type: string}
                  resource: {type: string}
                  scheme: {type: string}
                required: [amount, asset, description, extra, maxAmountRequired, maxTimeoutSeconds, mimeType,
                  network, payTo, resource, scheme]
            code: {type: string}
            how_to_pay: {type: string}
            message: {type: string}
            packs:
              type: array
              items:
                type: object
                properties:
                  credits: {type: integer}
                  name: {type: string}
                  payTo: {type: string}
                  price:
                    type: object
                    properties:
                      amount: {type: string}
                      asset: {type: string}
                      atomic: {type: integer}
                      currency: {type: string}
                      network: {type: string}
                      usd: {type: integer}
                    required: [amount, asset, atomic, currency, network, usd]
                required: [credits, name, payTo, price]
            payTo: {type: string}
            price:
              type: object
              required: [amount, asset, atomic, credits, currency, network, placeholder, placeholder_note,
                usd]
              properties:
                amount: {type: string}
                asset: {type: string}
                atomic: {type: integer}
                credits: {type: integer}
                currency: {type: string}
                network: {type: string}
                placeholder: {type: boolean}
                placeholder_note: {type: string}
                usd: {type: number}
            resource: {type: string}
            x402Version: {type: integer}
        result:
          type: array
          items: {}
          maxItems: 0
    CreditsBalance:
      type: object
      required: [available, endpoint, grants, holder, monthly, packs, reserved, result, schema_version,
        service_commit, total, unit, x402_enabled]
      properties:
        available: {type: integer}
        endpoint: {type: string}
        grants:
          type: array
          items: {}
        holder: {type: string}
        monthly: {type: integer}
        packs: {type: integer}
        reserved: {type: integer}
        result:
          type: array
          items: {}
        schema_version: {type: string}
        service_commit: {type: string}
        total: {type: integer}
        unit: {type: string}
        x402_enabled: {type: boolean}
    TransportError:
      type: object
      required: [schema_version, error, result]
      properties:
        schema_version: {type: string}
        service_commit: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [export_unavailable, human_burst_limit, human_challenge_required, human_day_limit,
                human_gate_unavailable, human_intent_limit, human_origin_required, human_sweep_limit,
                method_not_allowed, not_found, origin_not_allowed, visit_token_expired, visit_token_invalid]
            message: {type: string}
            accepted:
              type: array
              items: {type: string}
        result:
          type: array
          items: {}
          maxItems: 0
    ReleaseSignal:
      title: ModelSpec release signal v1
      type: object
      additionalProperties: false
      required: [model_name, provider, first_seen_url, timestamp, confidence, signal_id]
      properties:
        model_name: {type: string, minLength: 1, maxLength: 300, pattern: '^\S(?:[\s\S]*\S)?$'}
        provider: {type: string, minLength: 1, maxLength: 300, pattern: '^\S(?:[\s\S]*\S)?$'}
        first_seen_url: {type: string, maxLength: 300, format: uri, pattern: '^https://(www\.)?(x\.com|twitter\.com)/'}
        timestamp: {type: string, maxLength: 300, format: date-time}
        confidence: {type: number, minimum: 0, maximum: 1}
        signal_id: {type: string, minLength: 1, maxLength: 128, pattern: '^(?!watch:)[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    ReleaseDiscovery:
      title: ModelSpec release discovery v1
      description: 'A primary-source watcher discovery (MODEL-216). The same six fields as release-signal
        v1; the signal ID starts with watch: and first_seen_url is the lab or provider page that listed
        the model. A discovery is a trigger, never evidence.'
      type: object
      additionalProperties: false
      required: [model_name, provider, first_seen_url, timestamp, confidence, signal_id]
      properties:
        model_name: {type: string, minLength: 1, maxLength: 300, pattern: '^\S(?:[\s\S]*\S)?$'}
        provider: {type: string, minLength: 1, maxLength: 300, pattern: '^\S(?:[\s\S]*\S)?$'}
        first_seen_url:
          type: string
          maxLength: 300
          format: uri
          pattern: ^https://
          not: {pattern: '^https://([^/]*\.)?(x\.com|twitter\.com|t\.co)(/|$)'}
        timestamp: {type: string, maxLength: 300, format: date-time}
        confidence: {type: number, minimum: 0, maximum: 1}
        signal_id: {type: string, minLength: 1, maxLength: 128, pattern: '^watch:[A-Za-z0-9._:-]{1,122}$'}
    SignalAcknowledgement:
      type: object
      additionalProperties: false
      required: [signal_id, result]
      properties:
        signal_id: {type: string, minLength: 1, maxLength: 128, pattern: '^(?!watch:)[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        result: {type: string, nullable: true}
        pr_url: {type: string, nullable: true, format: uri}
        recheck_due: {type: string, format: date}
        recheck_day:
          type: integer
          enum: [1, 7, 30]
    SignalMutation:
      type: object
      required: [schema_version, service_commit, endpoint, status, signal_id]
      properties:
        schema_version:
          type: string
          enum: ['1']
        service_commit: {type: string}
        endpoint: {type: string}
        status:
          type: string
          enum: [accepted, duplicate, acknowledged]
        signal_id: {type: string, minLength: 1, maxLength: 128, pattern: '^(?!watch:)[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        recheck_days:
          type: array
          items:
            type: integer
            enum: [1, 7, 30]
    SignalsPending:
      type: object
      required: [schema_version, service_commit, endpoint, signals, rechecks]
      properties:
        schema_version:
          type: string
          enum: ['2']
        service_commit: {type: string}
        endpoint:
          type: string
          enum: [signals.pending]
        signals:
          type: array
          items:
            oneOf:
            - {$ref: '#/components/schemas/ReleaseSignal'}
            - {$ref: '#/components/schemas/ReleaseDiscovery'}
        rechecks:
          type: array
          items: {type: object}
    SignalError:
      type: object
      required: [schema_version, service_commit, endpoint, error]
      properties:
        schema_version:
          type: string
          enum: ['1']
        service_commit: {type: string}
        endpoint: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    FeedbackRequest:
      title: ModelSpec feedback
      description: 'POST this to https://api.modelspec.dev/v1/feedback. No key. One rating from a fixed
        set, optionally tied to the decision_id of a ModelSpec answer. Never include a prompt, a key,
        or anything that identifies a person. Reference: https://github.com/turbobeest/modelspec/blob/main/docs/feedback-api.md'
      type: object
      additionalProperties: false
      required: [rating, client]
      properties:
        rating:
          enum: [reliable, unreliable, trustworthy, untrustworthy, confusing]
          description: What you thought of the answer or the page.
          type: string
        client:
          enum: [agent, cli, mcp, page]
          description: 'What is sending it: an agent, the CLI, the MCP server, or the website.'
          type: string
        decision_id: {type: string, pattern: '^dec_[0-9A-Za-z]{8,64}$', description: The decision_id of
            the answer this is about., nullable: true}
        note: {type: string, maxLength: 1000, description: 'Optional. What was wrong or right, in your
            words.', nullable: true}
        trying_to_decide: {type: string, maxLength: 300, description: Optional. What you were trying to
            decide., nullable: true}
        page: {type: string, pattern: '^/[A-Za-z0-9._~/-]{0,199}$', description: 'Optional. The site path,
            such as /decide/.', nullable: true}
        template: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: Optional. The decision
            template in use., nullable: true}
    FeedbackWithdrawal:
      type: object
      additionalProperties: false
      required: [receipt]
      properties:
        receipt: {type: string, pattern: '^fbr_(\d{8})_([0-9a-f]{32})$'}
    FeedbackResult:
      type: object
      required: [schema_version, service_commit, endpoint, status, recorded]
      properties:
        schema_version:
          type: string
          enum: ['1.0']
        service_commit: {type: string}
        endpoint:
          type: string
          enum: [feedback]
        status:
          type: string
          enum: [recorded, not_recorded, deleted]
        recorded: {type: boolean}
        receipt: {type: string, nullable: true, pattern: '^fbr_(\d{8})_([0-9a-f]{32})$'}
        retention_days: {type: integer, nullable: true}
        redacted:
          type: array
          items:
            type: string
            enum: [card, email, id_number, ip, phone, secret, url_query]
        message: {type: string}
        privacy: {type: string, format: uri}
    FeedbackError:
      type: object
      required: [schema_version, service_commit, endpoint, error]
      properties:
        schema_version:
          type: string
          enum: ['1.0']
        service_commit: {type: string}
        endpoint:
          type: string
          enum: [feedback]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [feedback_store_unavailable, invalid_request, origin_not_allowed, payload_too_large,
                rate_limited, receipt_not_found]
