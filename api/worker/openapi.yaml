  /v1/billing/checkout:
    post:
      operationId: billingCheckout
      summary: Create a Stripe-hosted Checkout Session for a plan or pack.
      description: 'Redirect the browser to `url`. `price_id` is required; omitted is 400 naming the valid
        ids, never a guessed purchase. A live key in `Authorization: Bearer` binds the payment to that
        key (fingerprint only, never the key): a pack ADDs credits, a plan attaches. Unknown or revoked
        key: 401, never anonymous. No key: claim mints one. BILLING_ENABLED off: 503 billing_not_enabled,
        before any call to Stripe. The flag gates this endpoint alone.


        Form variant (MODEL-105): the buy buttons on https://modelspec.dev/pricing post `application/x-www-form-urlencoded`
        with one `price_id` field. A form post is answered 303 See Other with `Location:` the Stripe Checkout
        URL, so the browser goes straight to Stripe. It is always anonymous Checkout (any Authorization
        header is ignored; claim mints a new key); buying onto an existing key is the JSON call with the
        key presented. An unknown or placeholder `price_id` is refused, never redirected, and every refusal
        is the JSON call''s own. A body that parses as JSON is the JSON call whatever its content type,
        so `curl -d ''{...}''` is unchanged.'
      security:
      - {}
      - bearer: []
      - apiKey: []
      x-modelspec-probe: skip
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                price_id: {type: string}
            example: {price_id: price_1UHRwmBPydVRHUBjqhKcx8xV}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [price_id]
              properties:
                price_id: {type: string}
            example: {price_id: price_1UHRwmBPydVRHUBjqhKcx8xV}
      responses:
        '200':
          description: Hosted Checkout URL. Open it in a browser.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shared20a18378a7ba'}
          headers: *id001
        '303':
          description: 'Form post only: See Other to the Stripe-hosted Checkout page. The body is the
            200 envelope.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shared20a18378a7ba'}
          headers:
            Location:
              description: The Stripe Checkout URL (the body's `url`).
              schema: {type: string, format: uri}
            Link: *id005
            x-modelspec-guide-version: *id006
        '400':
          description: Unknown field, or price_id omitted. The 400 names the valid Price ids.
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, error, result, schema_version, service_commit]
                properties:
                  endpoint: {type: string}
                  error:
                    type: object
                    required: [code, message, valid_price_ids]
                    properties:
                      code: {type: string}
                      message: {type: string}
                      valid_price_ids:
                        type: array
                        items: {type: string}
                  result:
                    type: array
                    items: {}
                  schema_version: {type: string}
                  service_commit: {type: string}
          headers: *id001
        '401':
          description: A presented API key that is unknown or revoked. Never treated as anonymous.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sharede25eeefc86ea'}
          headers: *id001
        '500':
          description: 'price_not_mapped: the price_id is not in the tier table, or (form post) is a placeholder.
            Refused, never redirected.'
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, error, result, schema_version, service_commit]
                properties:
                  endpoint: {type: string}
                  error:
                    type: object
                    required: [code, message, price_id]
                    properties:
                      code: {type: string}
                      message: {type: string}
                      price_id: {type: string}
                  result:
                    type: array
                    items: {}
                  schema_version: {type: string}
                  service_commit: {type: string}
          headers: *id001
        '503':
          description: 'BILLING_ENABLED is off: no new purchase can start.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sharede25eeefc86ea'}
          headers: *id001
        '404':
          description: No endpoint at that path.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportError'}
          headers: *id001
        '405':
          description: /v1/billing/checkout takes POST.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportError'}
          headers: *id001
