  /v1/visit-token:
    post:
      operationId: verifyVisit
      summary: Exchange managed Turnstile verification for a visitor-and-origin-bound page credential.
      description: Exists only with VISIT_GATE_ENABLED, which is on in production; otherwise this path
        answers 404 like any unknown route. Siteverify must confirm success, the origin hostname and action
        decide. Uses the daily visitor HMAC id and VISIT_TOKEN_HMAC_KEY to sign a 30-minute sliding credential,
        renewed at most four hours from this exchange. No cookie. The free decide page uses this human
        browser credential for decide and bundled vocabulary under access enforcement; presenting an API
        key takes precedence. Machine callers need an API key.
      security: []
      x-modelspec-probe: skip
      parameters:
