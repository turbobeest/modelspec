          anyOf:
          - {type: boolean}
          - {type: integer}
          - {type: number}
          - {format: date, type: string}
          - {type: string}
          - items:
              anyOf:
              - {type: boolean}
              - {type: integer}
              - {type: number}
              - {format: date, type: string}
              - {type: string}
            type: array
          - {type: 'null'}
          default: null
          title: Value
        unit:
          anyOf:
          - {type: string}
          - {type: 'null'}
          default: null
          title: Unit
        record_id:
          anyOf:
          - {type: string}
          - {type: 'null'}
          default: null
          title: Record Id
        records:
          items: {type: string}
