                type: number
              benchmark_score:
                type: number
              benchmark_upper_bound:
                type: number
              capability_score:
                type: number
              context_score:
                type: number
              context_window:
                type: integer
              cost_input:
                description: USD per million input tokens, or null when unpublished.
                type: number
              cost_score:
                type: number
              display_name:
                type: string
              evidence_basis:
                description: Provenance of the benchmark inputs — none, unverified-legacy, mixed, partial-verified
