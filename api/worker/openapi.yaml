          type: array
        task_tokens:
          anyOf:
          - {$ref: '#/components/schemas/DecisionTaskTokens'}
          - {type: 'null'}
          default: null
        where:
          items:
            anyOf:
            - {type: string}
            - {$ref: '#/components/schemas/DecisionCompare'}
            - {$ref: '#/components/schemas/DecisionWindow'}
            - {$ref: '#/components/schemas/DecisionInSet'}
            - {$ref: '#/components/schemas/DecisionKnown'}
            - {$ref: '#/components/schemas/DecisionAnyOf'}
            - {$ref: '#/components/schemas/DecisionAllOf'}
            - {$ref: '#/components/schemas/DecisionNotOf'}
          title: Where
          type: array
        optimize: {$ref: '#/components/schemas/DecisionObjective'}
        unknowns: {const: default, default: default, title: Unknowns, type: string}
        explain:
          default: summary
          enum: [none, summary, full]
          title: Explain
          type: string
        limit: {default: 20, maximum: 500, minimum: 1, title: Limit, type: integer}
        save_as:
