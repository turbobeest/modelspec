  /v1/policy-check:
    post:
      operationId: policyCheck
      summary: Check a policy per model and per platform.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyCheckRequest'}
            example:
              policy:
                origin:
                  permitted_countries: [US]
                commercial_use: {required: true}
              limit: 3
      responses:
        '200':
          description: Verdicts, possibly including undetermined rows. `summary` counts every row; `result`
            is one page of them.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyCheckResponse'}
          headers: *id001
        '400':
          description: 'Refused: a malformed body, an empty policy, or an unknown model or platform. Never
            answered as a clean pass. Or sandbox_not_available: a test_ key, which answers /v1/rank only.'
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/PolicyRequestRefused'}
                - {$ref: '#/components/schemas/AccessRefused'}
          headers: *id001
        '404': *id002
        '405':
          description: /v1/policy-check takes POST.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportError'}
          headers: *id001
        '413':
          description: The body is over 262144 bytes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportError'}
          headers: *id001
        '422':
          description: '`require_no_undetermined` was true and some rows are undetermined. A documented
            hard failure, never a 200 to audit.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UndeterminedPresent'}
          headers: *id001
        '502':
          description: The published policy export could not be read. Retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportError'}
          headers: *id001
        '402':
          description: Payment required (MODEL-75, when X402_ENABLED). Same 402 as /v1/rank.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentRequired'}
          headers: *id001
        '401':
          description: No key while keys are enforced (missing_api_key), or a key that is not ours (invalid_api_key).
            `error.how_to_get_a_key` says where to get one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRefused'}
          headers: *id001
        '403':
          description: 'key_revoked: a key we know and will not serve. Retrying will not help.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRefused'}
          headers: *id001
        '429':
          description: 'rate_limited: the key''s daily or per-minute window is spent. States the limit,
            the window and `resets_at`; `Retry-After` is set.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRefused'}
          headers: *id001
        '500':
          description: 'Ours, not the caller''s: the key names a tier the service does not carry (tier_not_configured),
            or the deployment has no tier table (access_not_configured).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessRefused'}
          headers: *id001
        '503':
          description: 'determinations_unavailable: entitled to the determinations by a paid-tier key,
            and the store could not be read. Never downgraded to the public-export answer. Or access_store_not_configured:
            a live key was presented and there is no key store to check it against.'
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/DeterminationsUnavailable'}
                - {$ref: '#/components/schemas/AccessRefused'}
          headers: *id001
      description: 'Which models, on which platforms, does my policy allow? Checks a policy document (licence,
        origin, data handling) per model and per platform. Returns pass, fail or undetermined for each
        row; undetermined is not a pass. Needs an API key (Authorization: Bearer). Costs 5 credits a call;
        a credit costs $0.0017–$0.004 depending on the plan or pack (https://modelspec.dev/pricing/).
        It doesn''t choose a model: use decide to choose among the ones that pass.'
  /v1/feedback:
    post:
      operationId: feedback
      summary: Say whether a ModelSpec answer was reliable.
      description: 'Was a ModelSpec answer reliable? Rate it after you act on it, with the decision_id.
        Free, no key. Not for questions or support.


        Send one rating after you act on an answer, with the decision_id when it is about a decision.
        Never include a prompt, a key or anything that identifies a person: free text is scrubbed, and
        `redacted` says what was replaced. Storage ships off: a 200 is `not_recorded` and nothing is kept;
        a 202 is `recorded`. Request schema: https://modelspec.dev/api/feedback/v1.schema.json. Reference:
        docs/feedback-api.md.'
      security:
      - {}
      x-modelspec-probe: skip
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackRequest'}
            example: {rating: unreliable, client: agent, decision_id: dec_3f9a1c2b7d4e, note: The top
                pick has no pricing for my region.}
      responses:
        '200':
          description: 'Valid, and storage is off: nothing was kept.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackResult'}
          headers: *id001
        '202':
          description: Recorded. Keep `receipt` to delete it later.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackResult'}
          headers: *id001
        '400': &id009
          description: '`invalid_request`: Fix the body against the published schema and send it again.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackError'}
          headers: *id001
        '403': &id010
          description: '`origin_not_allowed`: Send it from modelspec.dev, or from a client with no Origin
            header.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackError'}
          headers: *id001
        '413': &id011
          description: '`payload_too_large`: Keep the body under 4096 bytes; shorten the note.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackError'}
          headers: *id001
        '429': &id012
          description: '`rate_limited`: Wait retry_after seconds, then send it once.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackError'}
          headers: *id001
        '503':
          description: '`feedback_store_unavailable`: Storage is on but not configured; retry later.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackError'}
          headers: *id001
        '405': &id013
          description: Use POST to send and DELETE to withdraw.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportError'}
          headers: *id001
    delete:
      operationId: feedbackWithdraw
      summary: Delete one piece of feedback by the receipt it was given.
      security:
      - {}
      x-modelspec-probe: skip
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackWithdrawal'}
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackResult'}
          headers: *id001
        '400': *id009
        '403': *id010
        '404':
          description: '`receipt_not_found`: Nothing is stored under that receipt; it was deleted or never
            kept.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackError'}
          headers: *id001
        '413': *id011
        '429': *id012
        '405': *id013
