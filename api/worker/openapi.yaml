info:
  title: ModelSpec API
  version: '1.0'
  summary: Decides which AI models fit a job from your requirements, sourced evidence and real cost, and
    checks them against a compliance policy.
  description: 'Start with the compact agent guide https://modelspec.dev/agents.md (version 1-d0803ca892923617).
    Call decide early with a template-based Spec; refine from reading and recovery hints.


    Use when choosing, switching, or checking a model before a task or deploy. POST /v1/decide takes your
    requirements and returns the models that fit, with reasons, cost per task and ties; when nothing fits,
    it says what to relax. POST /v1/rank is deprecated: the retired fixed-benchmark ranking, kept for
    existing callers and never a fallback for decide. POST /v1/policy-check returns, per model and per
    platform, pass, fail or undetermined against a licence, origin, residency and commercial-use policy,
    citing the document behind each verdict. After you act on an answer, POST /v1/feedback with a rating
    (reliable, unreliable, trustworthy, untrustworthy, confusing) and its decision_id; no key.


    One call, and no state on your side. Each answer is computed per request from the current public export;
    `build.commit` on every response names the catalogue it was computed from. A request carries a profile
    or a policy — never a prompt.


    Machine data access needs an API key (see x-modelspec-access). GET /v1/health and POST /v1/feedback
    stay keyless. The free decide page uses the human browser visit gate, with a Turnstile-verified visit
    token for decide and vocabulary when VISIT_GATE_ENABLED is on. Any key starting `test_` is the sandbox:
    unlimited, synthetic rows from the real scorer, /v1/rank only.


    Without a paid entitlement, policy-check uses public-export evidence. Every check it cannot settle
    is `undetermined` with `why: tier`, and `determinations.undetermined_for_lack_of_entitlement` counts
    them. It is never a pass.


    Any common HTTP client `User-Agent` works, including Python''s default (`Python-urllib/*`). A `403`
    with the non-JSON body `error code: 1010` is a refusal at the Cloudflare edge, not from this service.
    Report it.


