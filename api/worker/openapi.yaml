components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <key>. Takes precedence.'
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'X-API-Key: <key>. Never in the query string.'
  schemas:
    AccessRefused:
      type: object
      required:
      - schema_version
      - error
      - result
      properties:
        schema_version:
          type: string
        service_commit:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - access_not_configured
              - access_store_not_configured
              - invalid_api_key
              - key_revoked
              - missing_api_key
              - rate_limited
              - sandbox_not_available
              - tier_not_configured
            docs:
              type: string
            how_to_get_a_key:
              type: string
            limit:
              type: integer
            message:
              type: string
            remaining:
              type: integer
            resets_at:
              type: string
            retry_after_seconds:
              type: integer
            sandbox:
              type: string
            scope:
              type: string
            tier:
              type: string
            upgrade:
              type: string
            used:
              type: integer
            window:
              type: string
            window_seconds:
              type: integer
            windows:
              type: array
              items:
                type: object
                properties:
                  limit:
                    type: integer
                  remaining:
                    type: integer
                  resets_at:
                    type: string
                  retry_after_seconds:
                    type: integer
                  scope:
                    type: string
                  used:
                    type: integer
                  window:
                    type: string
                  window_seconds:
                    type: integer
                required:
                - limit
                - remaining
                - resets_at
                - retry_after_seconds
                - scope
                - used
                - window
                - window_seconds
          required:
          - code
          - message
        result:
          type: array
          items: {}
          maxItems: 0
    CreditsRefused:
      type: object
      required:
      - schema_version
      - error
      - result
      properties:
        schema_version:
          type: string
        service_commit:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - credits_store_not_configured
              - missing_holder
            docs:
              type: string
            how_to_get_a_key:
              type: string
            limit:
              type: integer
            message:
              type: string
            remaining:
              type: integer
            resets_at:
              type: string
            retry_after_seconds:
              type: integer
            sandbox:
              type: string
            scope:
              type: string
            tier:
              type: string
            upgrade:
              type: string
            used:
              type: integer
            window:
              type: string
            window_seconds:
              type: integer
            windows:
              type: array
              items:
                type: object
                properties:
                  limit:
                    type: integer
                  remaining:
                    type: integer
                  resets_at:
                    type: string
                  retry_after_seconds:
                    type: integer
                  scope:
                    type: string
                  used:
                    type: integer
                  window:
                    type: string
                  window_seconds:
                    type: integer
                required:
                - limit
                - remaining
                - resets_at
                - retry_after_seconds
                - scope
                - used
                - window
                - window_seconds
          required:
          - code
          - message
        result:
          type: array
          items: {}
          maxItems: 0
    RankRequest:
      type: object
      additionalProperties: false
      required:
      - use_case
      properties:
        use_case:
          description: Which profile scores the candidates. Required.
          type: string
          enum:
          - accounting
          - agentic
          - biotech
          - chat
          - code_review
          - coding
          - coding_cpp
          - coding_go
          - coding_java
          - coding_javascript
          - coding_python
          - coding_rust
          - coding_typescript
          - content_moderation
          - customer_support
          - cybersecurity
          - data_science
          - devops
          - education
          - education_humanities
          - education_stem
          - embedding
          - financial
          - financial_analysis
          - financial_compliance
          - general
          - image_generation
          - legal
          - legal_contract_review
          - math_competition
          - medical
          - medical_clinical
          - medical_radiology
          - multilingual
          - rag
          - reasoning
          - research_assistant
          - roleplay
          - safety
          - science
          - science_astronomy
          - science_biology
          - science_chemistry
          - science_physics
          - speech_to_text
          - summarization
          - text_to_speech
          - translation
          - vision
          - writing_creative
          - writing_technical
        environment:
          type: object
          additionalProperties: false
          properties:
            hardware:
              description: A device id from https://modelspec.dev/api/rank/hardware.json. Keeps only models
                whose weights fit that device. An id not in that file is a 400, never 'nothing fits'.
              type: string
              nullable: true
            hosting:
              description: Where the model runs.
              type: string
              nullable: true
              enum:
              - local
              - managed_api
              - self_hosted
              - null
              x-meaning:
                local: on the caller's own machine; requires downloadable weights
                managed_api: a provider or gateway API; no weights requirement
                self_hosted: on infrastructure the caller runs; requires downloadable weights
            runtime:
              description: The serving stack. A local runtime implies downloadable weights; every other
                value is recorded and reported in applied.unbound, because the export carries no runtime-level
                evidence to filter on.
              type: string
              nullable: true
              enum:
              - ai21_labs
              - anthropic
              - aws_bedrock
              - azure_ai_foundry
              - cerebras
              - chatgpt
              - claude_ai
              - cohere
              - deepinfra
              - deepseek
              - fireworks_ai
              - gemini_app
              - google
              - google_vertex_ai
              - gpt4all
              - grok_xai
              - groq
              - ibm_watsonx
              - jan_ai
              - lm_studio
              - meta_ai
              - mistral
              - mistral_plateforme
              - mlx_community
              - nvidia_nim
              - ollama
              - open_webui
              - openai
              - openrouter
              - replicate
              - sambanova
              - snowflake_cortex
              - together_ai
              - xai
              - null
              x-implies-open-weights:
              - gpt4all
              - jan_ai
              - lm_studio
              - mlx_community
              - ollama
              - open_webui
        constraints:
          type: object
          additionalProperties: false
          properties:
            open_weights:
              description: Keep only models whose weights can be downloaded.
              type: boolean
              nullable: true
            max_cost_per_million_input_tokens:
              description: USD ceiling on input cost. Applied before scoring. A model with no published
                price is dropped by this filter rather than assumed cheap.
              type: number
              minimum: 0
              nullable: true
            price_sensitivity:
              description: 0–1. How much cost weighs against quality. Every shipped profile weights cost
                at 0, so this is the only way to make price matter.
              type: number
              minimum: 0
              maximum: 1
              default: 0.0
            include_rehosts:
              description: Include models that are rehosts of another provider's weights.
              type: boolean
              default: false
        limit:
          description: Caps the ranked shortlist only, not the pool.
          type: integer
          minimum: 0
          maximum: 100
          default: 10
    RankResponse:
      type: object
      properties:
        applied:
          description: What actually bound. Read applied.unbound before trusting a filter.
          type: object
          properties:
            cost_weight:
              type: number
              nullable: true
            hardware_id:
              type: string
              nullable: true
            include_rehosts:
              type: boolean
            max_cost_per_million_input_tokens:
              type: number
              nullable: true
            open_weights_only:
              type: boolean
            open_weights_required_by:
              type: string
              nullable: true
            unbound:
              description: Fields that were accepted, recorded, and filtered nothing, each with the reason.
                An empty list means every field you sent bound.
              type: array
              items:
                type: object
                required:
                - field
                - value
                - why
                properties:
                  field:
                    type: string
                  value:
                    type: string
                  why:
                    type: string
          required:
          - cost_weight
          - hardware_id
          - include_rehosts
          - max_cost_per_million_input_tokens
          - open_weights_only
          - open_weights_required_by
          - unbound
        authoring_guide:
          description: 'The recommended model''s authoring guide, copied from the public card. Always
            present. Free: it is public catalogue data, not a paid enrichment.'
          type: object
          properties:
            guide:
              description: The card's guide, including source URL and accessed date on every claim. Null
                when absent. Never generated at request time.
              type: object
              nullable: true
              properties:
                applies_to:
                  type: object
                  properties:
                    model_id:
                      type: string
                    version:
                      type: string
                  required:
                  - model_id
                  - version
                as_of:
                  type: string
                sections:
                  type: object
                  properties:
                    failure_modes:
                      type: array
                      items: {}
                    formatting:
                      type: array
                      items: {}
                    prompt_shape:
                      type: array
                      items:
                        type: object
                        properties:
                          sources:
                            type: array
                            items:
                              type: object
                              properties:
                                accessed:
                                  type: string
                                kind:
                                  type: string
                                title:
                                  type: string
                                url:
                                  type: string
                              required:
                              - accessed
                              - kind
                              - title
                              - url
                          text:
                            type: string
                        required:
                        - sources
                        - text
                    reasoning_and_tools:
                      type: array
                      items: {}
                    retry_advice:
                      type: array
                      items: {}
                    system_message:
                      type: array
                      items: {}
                  required:
                  - failure_modes
                  - formatting
                  - prompt_shape
                  - reasoning_and_tools
                  - retry_advice
                  - system_message
                status:
                  type: string
            model_id:
              description: The recommended model this block is about. Null when the shortlist is empty.
              type: string
              nullable: true
            state:
              description: current, stale, or absent. A stale guide is served as stale, never rewritten
                to current. Absent is a state, not an empty string.
              type: string
              enum:
              - absent
              - current
              - stale
            why:
              description: 'Why the guide is absent: no_guide (the card has none) or no_recommendation
                (nothing was ranked). Null when a guide is served.'
              type: string
              nullable: true
          required:
          - guide
          - model_id
          - state
          - why
        build:
          description: The published export this answer was computed from.
          type: object
          properties:
            built_at:
              type: string
            commit:
              type: string
            eligibility_as_of:
              type: string
            export_schema_version:
              type: string
          required:
          - built_at
          - commit
          - eligibility_as_of
          - export_schema_version
        candidates_considered:
          type: integer
        endpoint:
          type: string
        export_origin:
          type: string
        policy:
          description: The evidence floors this answer was ordered under.
          type: object
          properties:
