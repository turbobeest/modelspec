          - {pattern: '^[a-z0-9][a-z0-9-]{0,63}$', type: string}
          - {type: 'null'}
          default: null
          title: Save As
        estate:
          anyOf:
          - {$ref: '#/components/schemas/DecisionEstate'}
          - {type: 'null'}
          default: null
        access:
          anyOf:
          - {$ref: '#/components/schemas/DecisionAccess'}
          - enum: [chat_app, coding_tool, own_software, own_hardware]
            type: string
          - {type: 'null'}
          default: null
      required: [spec_version, optimize]
      title: Spec
      type: object
    DecisionTaskTokens:
      additionalProperties: false
      description: How many tokens one task takes. ``offering.cost_per_task`` is priced from it.
      properties:
        input: {minimum: 0, title: Input, type: integer}
        output: {minimum: 0, title: Output, type: integer}
      required: [input, output]
      title: TaskTokens
      type: object
    DecisionTaskTokensHint:
      additionalProperties: false
      description: 'A per-task cost cap that fails only at the default task size. Added in 2.14.


        The spec gave no ``task_tokens``, so ``offering.cost_per_task`` was priced

        at ``default``, and removing ``condition`` alone gives a feasible answer.

        ``admits_at`` is the largest task, at ``default``''s input-to-output ratio,

        at which a model meets the cap. Set ``task_tokens`` to the real task''s

        size rather than copying ``admits_at`` (MODEL-316).'
      properties:
        condition: {title: Condition, type: string}
        default: {$ref: '#/components/schemas/DecisionTaskTokens'}
        admits_at: {$ref: '#/components/schemas/DecisionTaskTokens'}
        message: {title: Message, type: string}
      required: [condition, default, admits_at, message]
      title: TaskTokensHint
      type: object
    DecisionTieBreakers:
      additionalProperties: false
      properties:
        cheapest:
          anyOf:
