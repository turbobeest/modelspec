              score_kind:
                type: string
              score_lower_bound:
                type: number
              score_upper_bound:
                type: number
              scores_as_of:
                type: string
              type_bonus:
                type: number
              unranked_reason:
                nullable: true
              verified_benchmark_coverage:
                type: number
              verified_contributions:
