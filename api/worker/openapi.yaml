          properties:
            limit:
              type: integer
            matching_rows:
              type: integer
            offset:
              type: integer
            returned:
              type: integer
            truncated:
              type: boolean
            verdicts_shown:
              type: array
              items:
                type: string
                enum:
                - pass
                - fail
                - undetermined
          required:
          - limit
          - matching_rows
          - offset
          - returned
          - truncated
          - verdicts_shown
        policy:
          description: The policy as parsed, which is the policy that was checked.
          type: object
          properties:
            constraints:
              type: object
              properties:
                commercial_use:
                  type: object
                  properties:
                    accept_restricted:
                      type: boolean
                    required:
                      type: boolean
                  required:
                  - accept_restricted
                  - required
                licence:
                  type: object
                  properties:
                    allowed:
                      type: array
                      items:
                        type: string
                    prohibited:
                      type: array
                      items:
                        type: string
                  required:
                  - allowed
                  - prohibited
                origin:
                  type: object
                  properties:
                    permitted_countries:
                      type: array
                      items:
                        type: string
                    prohibited_countries:
                      type: array
                      items:
                        type: string
                  required:
                  - permitted_countries
                  - prohibited_countries
                residency:
                  type: object
                  required:
                  - match
                  - required_regions
                  properties:
                    match:
                      type: string
                    required_regions:
                      type: array
                      items:
                        type: string
            name:
              type: string
              nullable: true
            require_no_undetermined:
              type: boolean
          required:
          - constraints
          - name
          - require_no_undetermined
        provenance:
          description: Every read date this answer rests on.
          type: object
          properties:
            determination_read_dates:
              type: object
              properties:
                commercial_use:
                  type: array
                  items:
                    type: string
                residency:
                  type: array
                  items:
                    type: string
            determinations_generated_on:
              type: string
              nullable: true
          required:
          - determination_read_dates
          - determinations_generated_on
        result:
          description: 'One row per (model, platform) pair. Branch on verdict: each row carries exactly
            one of passed, failed, undetermined.'
          type: array
          items:
            $ref: '#/components/schemas/PolicyRow'
        schema_version:
          type: string
        service_commit:
          type: string
        summary:
          description: Always every row the request selects, whatever limit, offset and verdicts say.
          type: object
          properties:
            by_constraint:
              type: object
              properties:
                commercial_use:
                  type: object
                  properties:
                    satisfied:
                      type: integer
                    undetermined:
                      type: integer
                    violated:
                      type: integer
                  required:
                  - satisfied
                  - undetermined
                  - violated
                licence:
                  type: object
                  properties:
                    satisfied:
                      type: integer
                    undetermined:
                      type: integer
                    violated:
                      type: integer
                  required:
                  - satisfied
                  - undetermined
                  - violated
                origin:
                  type: object
                  properties:
                    satisfied:
                      type: integer
                    undetermined:
                      type: integer
                    violated:
                      type: integer
                  required:
                  - satisfied
                  - undetermined
                  - violated
                residency:
                  type: object
                  required:
                  - satisfied
                  - undetermined
                  - violated
                  properties:
                    satisfied:
                      type: integer
                    undetermined:
                      type: integer
                    violated:
                      type: integer
            models_checked:
              type: integer
            models_undetermined_somewhere:
              type: integer
            models_with_a_passing_platform:
              description: 'Counted over models, not rows: passes somewhere, not everywhere.'
              type: integer
            rows:
              type: integer
            verdicts:
              type: object
              properties:
                fail:
                  type: integer
                pass:
                  type: integer
                undetermined:
                  type: integer
              required:
              - fail
              - pass
              - undetermined
          required:
          - by_constraint
          - models_checked
          - models_undetermined_somewhere
          - models_with_a_passing_platform
          - rows
          - verdicts
      required:
      - build
      - determinations
      - endpoint
      - export_origin
      - page
      - policy
      - provenance
      - result
      - schema_version
      - service_commit
      - summary
