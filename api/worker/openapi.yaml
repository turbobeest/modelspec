          title: Formula
        source_ids:
          items: {type: string}
          title: Source Ids
          type: array
      required: [facet]
      title: ShownFact
      type: object
    DecisionSingleGate:
      additionalProperties: false
      description: 'One stated hard condition whose removal alone admits models. Added in 2.15.


        ``condition`` is rendered the same way as ``relax``. ``admits`` counts the

        distinct models that pass every other condition and the same reach.'
      properties:
        condition: {title: Condition, type: string}
        admits: {minimum: 1, title: Admits, type: integer}
      required: [condition, admits]
      title: SingleGate
      type: object
    DecisionSoft:
      additionalProperties: false
      description: 'A soft condition: violating it costs ``penalty`` of the objective instead of eliminating.'
      properties:
        penalty: {exclusiveMinimum: 0, maximum: 1, title: Penalty, type: number}
      required: [penalty]
      title: Soft
      type: object
    DecisionSpec:
      additionalProperties: false
      description: A request for a decision.
      properties:
        spec_version: {const: 1, title: Spec Version, type: integer}
        snapshot:
          anyOf:
          - {const: latest}
          - {pattern: '^snap_[A-Za-z0-9:._-]+$', type: string}
          default: latest
          title: Snapshot
        profile:
          anyOf:
          - oneOf:
            - {pattern: '^profile:[a-z0-9][a-z0-9-]*$', type: string}
            - {$ref: '#/components/schemas/DecisionInventoryProfile'}
          - {type: 'null'}
          default: null
          title: Profile
        task:
          anyOf:
          - {type: string}
          - {type: 'null'}
          default: null
          title: Task
        task_type:
          anyOf:
          - enum: [new_feature, bug_fix, refactor, test_writing, docs, migration, performance, security_fix,
              review, analysis, data_transform, config_infra]
            type: string
          - {type: 'null'}
          default: null
          title: Task Type
        capabilities:
          anyOf:
          - patternProperties:
              ^[a-z][a-z0-9_-]*(\.[a-z0-9_-]+)*$:
