info:
  title: ModelSpec API
  version: '1.0'
  summary: Ranks AI models you can actually run, given your hardware, providers, use case and policy rules,
    and checks them against a compliance policy.
  description: 'Use when choosing, switching, or checking a model before a task or deploy. POST /v1/rank
    returns ranked models with scores, cost and reasons; on failure, it returns which constraint eliminated
    every option. POST /v1/policy-check returns, per model and per platform, pass, fail or undetermined
    against a licence, origin, residency and commercial-use policy, citing the document behind each verdict.


    One call, and no state on your side. Each answer is computed per request from the current public export;
    `build.commit` on every response names the catalogue it was computed from. A request carries a profile
    or a policy — never a prompt.


    A key is optional today (see x-modelspec-access): without one you get the free tier, unmetered; a
    key you present is checked, and a bad one is refused rather than ignored. Any key starting `test_`
    is the sandbox: unlimited, synthetic rows from the real scorer, /v1/rank only.


    Without a paid-tier key, policy-check answers from the public export (the free tier). Every check
    it cannot settle is `undetermined` with `why: tier`, and `determinations.undetermined_for_lack_of_entitlement`
    counts them. It is never a pass.


    Send a real `User-Agent`. The host is behind Cloudflare, and the standard-library default (`Python-urllib/*`)
    is refused at the edge with a 403 and a non-JSON body that never reaches this service.


    Reference: docs/api.md and docs/api-policy-check.md. Generated from the implementation by api/worker/openapi.py.'
