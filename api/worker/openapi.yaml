          type: array
        warnings:
          items: {pattern: '^[a-z0-9_]+$', type: string}
          title: Warnings
          type: array
        plans:
          items: {$ref: '#/components/schemas/DecisionPlanRoute'}
          title: Plans
          type: array
      required: [rank, offering]
      title: Result
      type: object
    DecisionSeparatedAnswer:
      additionalProperties: false
      properties:
        kind: {const: separated, title: Kind, type: string}
