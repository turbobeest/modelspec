        value: {title: Value, type: number}
        unit:
          anyOf:
          - {type: string}
          - {type: 'null'}
          default: null
          title: Unit
        admits: {minimum: 1, title: Admits, type: integer}
      required: [condition, relaxed, facet, value, admits]
      title: Relaxation
      type: object
