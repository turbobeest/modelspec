# The MODEL-212 pilot lineup: ten premier offerings, each called directly on
# its own provider's API. Never a router. `api_model` is the provider's model
# identifier; `python -m scripts.speed preflight` checks each one against the
# provider's free model list before any paid request. `params` pins the effort
# the method measures at (the lowest the offering accepts; see the method doc).
# Request shapes follow each provider's docs (checked 2026-09-29):
#   Anthropic  Opus 5.5 thinking adaptive + output_config.effort low; Sonnet 5.5
#              thinking between_tools (both per the API's own 400s); Claude 4.7+ rejects type "enabled" and any
#              temperature but 1.0. https://docs.claude.com/en/api/messages
#   OpenAI     reasoning_effort "none"; gpt-6-sol and gpt-5.6-sol reject "minimal".
#              https://developers.openai.com/api/docs/guides/reasoning
#   DeepSeek   thinking {type: disabled}; thinking is on by default.
#              https://api-docs.deepseek.com/guides/thinking_mode
#   Gemini 3   thinkingLevel; Gemini 3 thinking cannot be turned off, and the
#              lowest level is "low". https://ai.google.dev/gemini-api/docs/thinking
#   xAI        reasoning cannot be disabled; low/medium/high only, default high.
#              https://docs.x.ai/docs/guides/reasoning
# `output_bound_extra` is output the provider may bill beyond `max_tokens`.
# `reasoning_off: true` claims the pinned effort does no reasoning; an offering
# whose streams report reasoning tokens anyway is held, never published.

plan: pilot
repetitions_per_slot: 5
warmups_per_slot: 1
offerings:
  - offering: anthropic/anthropic/claude-opus-5-5/global/standard
    api: anthropic
    api_model: claude-opus-5-5
    effort: adaptive thinking, effort low (thinking cannot be disabled)
    params: {thinking: {type: adaptive}, output_config: {effort: low}}
  - offering: anthropic/anthropic/claude-sonnet-5-5/global/standard
    api: anthropic
    api_model: claude-sonnet-5-5
    effort: thinking off (between_tools)
    reasoning_off: true
    params: {thinking: {type: between_tools}}
  - offering: openai/openai/gpt-6-sol/global/standard
    api: openai
    api_model: gpt-6-sol
    effort: reasoning_effort none
    reasoning_off: true
    params: {reasoning_effort: none}
  - offering: openai/openai/gpt-5-6-sol/global/standard
    api: openai
    api_model: gpt-5.6-sol
    effort: reasoning_effort none
    reasoning_off: true
    params: {reasoning_effort: none}
  - offering: google-gemini-api/google/gemini-3-8-flash/global/standard
    api: gemini
    api_model: gemini-3.8-flash
    effort: thinking level low (the lowest)
    params: {thinkingConfig: {thinkingLevel: low}}
  - offering: google-gemini-api/google/gemini-3-1-pro-preview/global/standard
    api: gemini
    api_model: gemini-3.1-pro-preview
    effort: thinking level low (the lowest)
    # Smoke only: the key's quota tier returns 429 RESOURCE_EXHAUSTED (Jamie's to lift).
    smoke_only: true
    params: {thinkingConfig: {thinkingLevel: low}}
    output_bound_extra: 128
  - offering: xai/xai/grok-4-7/global/standard
    api: xai
    api_model: grok-4.7
    effort: provider default (reasoning cannot be disabled)
    # Smoke only: cache_hit holds its results, and its reasoning is the one
    # cost max_tokens does not bound.
    smoke_only: true
  - offering: deepseek/deepseek/deepseek-v4-pro/global/standard
    api: deepseek
    api_model: deepseek-v4-pro
    effort: thinking disabled
    reasoning_off: true
    params: {thinking: {type: disabled}}
  - offering: deepseek/deepseek/deepseek-flash/global/standard
    api: deepseek
    api_model: deepseek-flash
    effort: thinking disabled
    reasoning_off: true
    params: {thinking: {type: disabled}}
  - offering: zai/zhipu/glm-5-3/global/standard
    api: zai
    api_model: glm-5.3
    effort: reasoning_effort low (thinking cannot be disabled)
    params: {reasoning_effort: low}
