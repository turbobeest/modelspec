# The MODEL-212 pilot lineup: ten premier offerings, each called directly on
# its own provider's API. Never a router. `api_model` is the provider's model
# identifier; `python -m scripts.speed preflight` checks each one against the
# provider's free model list before any paid request. `params` pins the effort
# the method measures at (the lowest the offering accepts; see the method doc).
# `output_bound_extra` is output the provider may bill beyond `max_tokens`.
# `reasoning_off: true` claims the pinned effort does no reasoning; an offering
# whose streams report reasoning tokens anyway is held, never published.

plan: pilot
repetitions_per_slot: 5
warmups_per_slot: 1
offerings:
  - offering: anthropic/anthropic/claude-opus-5-5/global/standard
    api: anthropic
    api_model: claude-opus-5-5
    effort: thinking off
    reasoning_off: true
  - offering: anthropic/anthropic/claude-sonnet-5-5/global/standard
    api: anthropic
    api_model: claude-sonnet-5-5
    effort: thinking off
    reasoning_off: true
  - offering: openai/openai/gpt-6-sol/global/standard
    api: openai
    api_model: gpt-6-sol
    effort: reasoning_effort minimal
    params: {reasoning_effort: minimal}
  - offering: openai/openai/gpt-5-6-sol/global/standard
    api: openai
    api_model: gpt-5.6-sol
    effort: reasoning_effort minimal
    params: {reasoning_effort: minimal}
  - offering: google-gemini-api/google/gemini-3-8-flash/global/standard
    api: gemini
    api_model: gemini-3.8-flash
    effort: thinking budget 0
    reasoning_off: true
    params: {thinkingConfig: {thinkingBudget: 0}}
  - offering: google-gemini-api/google/gemini-3-1-pro-preview/global/standard
    api: gemini
    api_model: gemini-3.1-pro-preview
    effort: thinking budget 128 (the minimum)
    params: {thinkingConfig: {thinkingBudget: 128}}
    output_bound_extra: 128
  - offering: xai/xai/grok-4-7/global/standard
    api: xai
    api_model: grok-4.7
    effort: provider default
  - offering: deepseek/deepseek/deepseek-v4-pro/global/standard
    api: deepseek
    api_model: deepseek-v4-pro
    effort: non-thinking mode
    reasoning_off: true
  - offering: deepseek/deepseek/deepseek-flash/global/standard
    api: deepseek
    api_model: deepseek-flash
    effort: non-thinking mode
    reasoning_off: true
  - offering: zai/zhipu/glm-5-3/global/standard
    api: zai
    api_model: glm-5.3
    effort: thinking disabled
    reasoning_off: true
    params: {thinking: {type: disabled}}
