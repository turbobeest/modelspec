# Coverage targets (MODEL-215). The prose is docs/method/coverage-slo.md;
# tests/test_coverage_slo.py holds the two to the same ids and numbers.
#
# A target is `in_force: false` until the thing it measures exists. The report
# still measures it, and never counts it as met.

schema_version: 1

# The daily report's published home: a Pages branch of the modelspec project,
# deployed by .github/workflows/coverage-slo.yml. Never linked from the site.
report_url: https://coverage.modelspec-7np.pages.dev/

# Who a breach older than `escalate_after_hours` notifies, by GitHub mention.
notify: ["@turbobeest"]
escalate_after_hours: 24
issue_label: coverage-slo

targets:
  - id: new-model-cards
    title: A new model from a tracked lab has a card within 24 hours
    in_force: true
    grace_days: 1
    window_days: 30

  - id: lab-release-feeds
    title: Every lab with a lineup model has a release feed
    in_force: true

  - id: lineup-domain-evidence
    title: Every lineup model has verified evidence in each domain it claims
    in_force: true

  - id: live-reading-age
    title: Every live board reading on a lineup model was re-read within 30 days
    in_force: true
    max_age_days: 30

  - id: thin-evidence
    title: Every lineup model has admitted evidence on at least two benchmarks
    in_force: true
    # MIN_BENCHMARK_COUNT in api/ranking/engine.py; the test holds them equal.
    min_benchmarks: 2

  # MODEL-239. Admission drops any evidence row with no measured_by and counts
  # it as `unclassified`; a row dropped that way is a card to fix, not a value
  # to guess.
  - id: unclassified-evidence
    title: No evidence row is kept out for want of a measured_by
    in_force: true

  - id: lineup-facts-verified
    title: Every fact stated on a lineup model or offering is verified
    in_force: true

  - id: offering-price-age
    title: Lineup offering prices were re-read within 7 days
    in_force: true
    max_age_days: 7

  - id: plan-age
    title: Subscription plans were re-read within 7 days
    in_force: true
    max_age_days: 7

  - id: premier-speed-age
    title: Premier offerings have speed readings within 14 days
    # Comes into force when the MODEL-230 pilot and baseline have run.
    in_force: false
    max_age_days: 14

  - id: workflow-health
    title: Every scheduled workflow's latest run on main succeeded, on time
    in_force: true

  # MODEL-232. A refresh resets reading ages only when its PR merges. Three
  # days: a verified refresh auto-merges the day it opens, a blocked one gets a
  # working weekday before the alert, and the alert (plus the 24-hour
  # escalation) lands before the next weekly run replaces the PR.
  - id: refresh-pr-merged
    title: Every scheduled refresh PR merges within 3 days of opening
    in_force: true
    max_open_days: 3
    branches: [data/weekly-leaderboard-refresh]

# Premier-list domain names (premier/slice-1.yaml) to registry/domains.yaml
# ids. Evidence in any listed registry domain satisfies the premier domain.
domain_map:
  software-engineering: [software_engineering]
  reasoning-and-maths: [maths, reasoning, engineering_stem]
  chat-or-preference: [chat_preference]
  retrieval-and-embedding: [retrieval]
  vision: [vision_documents]

# MODEL-421. `workflow-health` watches every workflow with a `schedule:`
# trigger in these repositories. The list and each cadence come from the cron
# lines in the workflow files, never from a list kept here. A scheduled
# workflow is red when its newest completed run on main failed, was cancelled
# or timed out, or when it has not run for `stale_factor` times its cadence.
workflow_health:
  stale_factor: 1.5
  repos:
    - repo: turbobeest/modelspec
      dir: .
      public: true
    # No checkout: its workflow files and runs are read through the API with
    # this token, which needs Contents: read and Actions: read there. Private:
    # this public report shows only how many of its workflows are red.
    # modelspec-data's own workflow-health.yml runs
    # `python -m scripts.slo workflows --private-detail --issue` and keeps the
    # names and run URLs in an issue there.
    - repo: turbobeest/modelspec-data
      token_env: MODELSPEC_DATA_TOKEN
      public: false
  # Push-triggered workflows with no cron to derive a cadence from. Only a red
  # newest run counts for these.
  unscheduled:
    - repo: turbobeest/modelspec
      file: deploy-sites.yml
