# Explicit models.dev identities the catalogue already holds.
#
# scripts/seed_models_dev.py --new-only treats "no file at this provider/slug
# path" as a new model. models.dev also lists other labs' models under a
# serving or aggregator provider, so that path check re-proposes cards we
# already merged (PR #43 re-added GLM-5.2 under Mistral and Qwen).
#
# Each row is a reviewable identity, not a name match. A display-name-only
# collision must still be proposed — dropping a real new model is worse than
# a duplicate a person can reject.
#
# models_dev:  <provider>/<id> as published by https://models.dev/api.json
# seeder:      optional identity after PROVIDER_MAP + slugify (what NEW prints)
# canonical:   catalogue model_id whose card file must exist, or the row is ignored
# skips:       exact models.dev rows that are not stable model identities;
#              each needs a reason and does not depend on a canonical card

identities:
  - models_dev: mistral/zai-glm-5-2
    canonical: zhipu/glm-5-2
    note: >
      Z.ai GLM-5.2 listed under Mistral. Merged onto zhipu/glm-5-2 on 2026-09-10
      (qwen/glm-5-2 → zhipu/glm-5-2 in 3e78aad; misfiled copies dropped in 75830e2).
      Hugging Face repo on the canonical card is zai-org/GLM-5.2.
  - models_dev: alibaba/glm-5.2
    seeder: qwen/glm-5-2
    canonical: zhipu/glm-5-2
    note: >
      Same GLM-5.2 listed under Alibaba. The seeder maps alibaba → qwen and
      slugifies glm-5.2 → glm-5-2, which is how daily research opened
      models/qwen/glm-5-2.md in PR #43.
  - models_dev: mistral/zai-glm-5-3
    canonical: zhipu/glm-5-3
    note: >
      Z.ai GLM-5.3 listed under Mistral as mistral/zai-glm-5-3. The page
      slug would be models/mistral/zai-glm-5-3.md; PR #106 (2026-09-20)
      wrote models/zhipu/zai-glm-5-3.md, creator zhipu, with the Mistral
      listing kept as availability. Dropped as the same model as
      zhipu/glm-5-3. Hugging Face repo on the canonical card is
      zai-org/GLM-5.3.
  - models_dev: mistral/deepseek-v4-1-flash-1017
    canonical: deepseek/deepseek-flash
    note: >
      Dated Mistral serving ID for DeepSeek V4.1 Flash. Dropped in REV-data99;
      availability.mistral_plateforme.model_id at data commit 68f3a774.
  - models_dev: mistral/mistral-large-4-0-8
    canonical: mistral/mistral-large-4
    note: >
      Same Mistral Large 4 release, with no evidence of a distinct model in
      REV-data99. ID from version and sources.models_dev_url at 68f3a774.
  - models_dev: moonshotai/kimi-k3.1-pro-highspeed
    canonical: moonshot/kimi-k3-1-pro
    note: >
      Serving speed tier of Kimi K3.1 Pro, dropped in REV-data99. ID from
      version and sources.models_dev_url at 68f3a774, including the dot.
      The canonical card is on data#99; this mapping takes effect when it exists.
  - models_dev: mistral/zai-glm-5-3-flash
    canonical: zhipu/glm-5-3-flash
    note: >
      Mistral serving name for GLM-5.3 Flash. Dropped in REV-data99;
      availability.mistral_plateforme.model_id at data commit 68f3a774.

skips:
  - models_dev: google/gemini-pro-latest
    reason: rolling alias with no fixed model identity
    note: >
      Dropped in REV-data99. ID from version and sources.models_dev_url at
      68f3a774. A moving alias cannot be mapped to a fixed canonical card.
