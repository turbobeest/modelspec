# Primary sources the release watcher reads (MODEL-216). See docs/release-watch.md.
#
# Rules every entry obeys, and tests/test_release_watch.py enforces:
# - A source is a trigger, never evidence. Nothing read here reaches a card.
# - Artificial Analysis and Zapier are never sources (decision/excluded.py).
# - X is Grok Bot's channel; it is never a watched source.
# - Plain HTTPS GET with the user agent below, no key, no account, no Firecrawl.
#   robots.txt is read before every source on every run.
# - `provider` (or each value of `providers`) resolves to exactly one catalogue
#   lab, so the pipeline's identity step can place what the watcher files.
# - Order matters: when two sources list one model, the first one files it.
#   The labs' own pages come first.
#
# Page sources are read as text and matched against `pattern`. A match must
# contain a digit unless `require_digit` is false, so doc slugs like
# `claude-code` never count. `exclude` drops the slugs that still get through.
# Noise present when the baseline was taken is in the baseline; `exclude` is
# for noise that arrives later.
user_agent: ModelSpec-Release-Watch/1.0 (+https://modelspec.dev)
# OpenRouter and Hugging Face rows carry a creation time. Only rows created in
# this window can be new, so a listing window that shifts cannot resurrect old
# models as discoveries.
recent_days: 30
# Repackagings of a model, not a release of one.
variant_exclude: '(gguf|awq|gptq|(^|[-_.])(fp8|fp4|nvfp4|mxfp4|int4|int8|w4a16|w8a8|w4a4|bnb|mlx|exl2|onnx|4bit|8bit)([-_.]|$)|lora|adapter|eagle3?$)'
page_exclude: '(system-card|\.(png|jpe?g|svg|webp|gif|pdf|js|css|html?|md)$|docs|guide|overview|readme|pricing|changelog|release-notes|localhost|staging)'

sources:
# ── the labs' own model pages ────────────────────────────────────────────────
- id: anthropic-models
  kind: page
  url: https://platform.claude.com/docs/en/models/overview
  provider: anthropic
  pattern: 'claude-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  # `-v1` is the Bedrock spelling of an ID the page also lists bare.
  exclude: '(-v\d+$|^claude-(api|code|in|on|platform|prompting)-)'
  confidence: 0.9
- id: google-gemini-models
  kind: page
  url: https://ai.google.dev/gemini-api/docs/models
  provider: google
  pattern: '(?:gemini|gemma|imagen|veo|lyria)-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  exclude: '(-models$|-api$)'
  confidence: 0.9
- id: openai-models
  kind: page
  url: https://developers.openai.com/api/docs/models
  provider: openai
  pattern: '(?:gpt|o[1-9]|sora|whisper|dall-e|codex|text-embedding|omni-moderation|tts|computer-use)-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  exclude: '(ambassadors|community|sdk|plugin|header|locali[sz]ation|app-server|for-oss)'
  confidence: 0.9
- id: mistral-models
  kind: page
  url: https://docs.mistral.ai/models
  provider: mistral
  pattern: '(?:mistral|magistral|codestral|devstral|ministral|pixtral|voxtral|mixtral|open-mistral|open-mixtral)-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  exclude: '(interpreter|-js$|-python$)'
  confidence: 0.9
- id: xai-models
  kind: page
  url: https://docs.x.ai/developers/models
  provider: xai
  pattern: 'grok-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  confidence: 0.9
- id: deepseek-models
  kind: page
  url: https://api-docs.deepseek.com/quick_start/pricing
  provider: deepseek
  pattern: 'deepseek-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  exclude: '(harness|github|social|agent|integration)'
  confidence: 0.9
- id: cohere-models
  kind: page
  url: https://docs.cohere.com/docs/models
  provider: cohere
  pattern: '(?:command|embed|rerank|aya|c4ai)-[a-z0-9][a-z0-9.-]*[a-z0-9]'
  exclude: '(technical-report|-hf$)'
  confidence: 0.9

