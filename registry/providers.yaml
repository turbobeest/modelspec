# The provider registry (MODEL-133; design §4.1).
#
# A provider is an organisation that serves models for use through an API or a
# cloud. It replaces the fixed platform fields on `Availability` in
# `schema/card.py`; `v1_availability_field` names the field each entry takes
# over, so the offerings migration (MODEL-134) can be checked, not guessed.
# App-only platforms (consumer chat apps, IDEs, aggregating chat apps) are not
# providers of offerings and are kept out (design §4.1, "Consumer chat apps are
# out of scope for now").
#
# Adding a provider is an entry here. Loader: decision/registry.py.
#
# Entry fields
#   id                     kebab-case, unique; used in offering paths
#                          (offerings/<provider>/<lab>/<model>.yaml)
#   name, url              as the provider names itself; its home page
#   kind                   lab_api | cloud | inference | aggregator
#   v1_availability_field  optional: the `Availability` field this replaces
#   jurisdiction           `unknown`, or a sourced fact:
#       value      ISO 3166-1 alpha-2 country of the legal entity that contracts
#                  with a customer in the United States under the provider's
#                  standard terms (terms that name regional entities are read
#                  for a United States customer)
#       entity     that entity, as the terms name it
#       shown_by   address | incorporation | governing_law: what in the terms
#                  establishes the country
#       basis      service_terms | website_terms: website terms govern the site,
#                  not necessarily the paid service, and are marked as such
#       source     the URL read;  read  the date it was read (YYYY-MM-DD)
#       note       optional
#   attestations           provider-level attestations, each `unknown` or
#                          {value, source, read}. Provider-level only: whether an
#                          attestation covers an offering is the offering's
#                          `offering.attestation.*` fact. Documented, never
#                          certified.
#
# Every attestation is `unknown` at seeding. The trust pages that list them
# need a rendered browser, and a null beats a guess; they are collected and
# verified by the two-key process, not by this seed.

