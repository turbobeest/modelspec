# Decision templates (MODEL-178, tiered in MODEL-204). These are partial
# decision specs: `where` contains Musts, while `weights` contains Prefers. The
# loader validates every condition, objective, class, domain, category, tier
# and canvas axis against the decision registries.
#
# Each template sits in one category (a row of the page's template grid) and
# one tier (a column). A tier is the same use case traded off differently:
# capability, cost, speed, context and privacy. The page draws the grid from
# `categories` and `tiers`, never from its own list.
#
# Template fields added in MODEL-204 (contract 2.8, additive)
#   category  a category id from `categories`
#   tier      a tier id from `tiers`
#   tradeoff  the one line the grid cell shows: what this tier gives up
#   canvas    the trade-off canvas axes the page sets when the template is
#             applied: `facet:<numeric facet id>` or `capability:<domain id>`

schema_version: 1

categories:
  - id: coding
    name: Coding
    kind: use
  - id: writing
    name: Writing
    kind: use
  - id: maths-reasoning
    name: Maths and reasoning
    kind: use
  - id: documents
    name: Long documents
    kind: use
  - id: retrieval
    name: Retrieval and embeddings
    kind: use
  - id: assistant
    name: General assistant
    kind: use
  - id: high-volume
    name: High volume
    kind: constraint
  - id: regulated
    name: Regulated data (HIPAA)
    kind: constraint
  - id: regional
    name: EU-only data
    kind: constraint

tiers:
  - id: best
    name: Best available
  - id: balanced
    name: Balanced
  - id: budget
    name: Budget
  - id: fastest
    name: Fastest
  - id: private
    name: Private / self-hosted

templates:
  # ── Coding ──────────────────────────────────────────────────────────────
  - id: coding-best
    category: coding
    tier: best
    name: Coding, best available
    tradeoff: Strongest coding evidence, cost no object.
    purpose: Find the active coding model with the strongest software-engineering evidence, whatever it costs.
    where:
      - condition: model.class = text-generator
        reason: Coding work needs a model that generates text and code.
      - condition: model.lifecycle = active
        reason: An active model is still supported by its lab or provider.
    weights:
      software_engineering:
        weight: 1.0
        reason: Rank only by the software-engineering capability estimate.
    needs:
      classes: [text-generator]
      domains: [software_engineering]
    canvas: {x: "facet:offering.cost_per_task", y: "capability:software_engineering"}
    teaches: With no cost term, the ranking is capability alone; the canvas still shows what each candidate costs.

  - id: coding-balanced
    category: coding
    tier: balanced
    name: Coding, balanced
    tradeoff: Coding strength first, cost as a real second term.
    purpose: Find an active coding model with room for a repository that balances coding strength against task cost.
    where:
      - condition: model.class = text-generator
        reason: Coding work needs a model that generates text and code.
      - condition: model.lifecycle = active
        reason: An active model is still supported by its lab or provider.
      - condition: model.context_window >= 200000
        reason: A large repository needs room for code, tests, and instructions.
    weights:
      software_engineering:
        weight: 0.7
        reason: Prefer stronger evidence on real software-engineering tasks.
      -offering.cost_per_task:
        weight: 0.3
        reason: Among strong coders, prefer the cheaper task.
    needs:
      classes: [text-generator]
      domains: [software_engineering]
    canvas: {x: "facet:offering.cost_per_task", y: "capability:software_engineering"}
    teaches: A 70/30 blend keeps capability in charge while letting a large price gap decide close calls.

  - id: budget-coding
    category: coding
    tier: budget
    name: Coding agent on a budget
    tradeoff: At most $0.05 a task; coding still ranked.
    purpose: Find an active coding model with enough context while keeping one task at or under $0.05.
    where:
      - condition: model.class = text-generator
        reason: Coding work needs a model that generates text and code.
      - condition: model.lifecycle = active
        reason: An active model is still supported by its lab or provider.
      - condition: model.context_window >= 200000
        reason: A large repository needs room for code, tests, and instructions.
      - condition: offering.cost_per_task <= 0.05
        reason: The offering must stay within the per-task budget.
    weights:
      software_engineering:
        weight: 0.6
        reason: Prefer stronger evidence on real software-engineering tasks.
      -offering.cost_per_task:
        weight: 0.4
        reason: Among qualifying offerings, prefer the cheaper task.
    needs:
      classes: [text-generator]
      domains: [software_engineering]
    canvas: {x: "facet:offering.cost_per_task", y: "capability:software_engineering"}
    teaches: Use Must for non-negotiable context and budget limits, then Prefer to trade coding strength against cost.

  - id: coding-fastest
    category: coding
    tier: fastest
    name: Coding, fastest
    tradeoff: Output speed first; coding strength second.
    purpose: Find an active coding model whose offering streams output fastest, with coding strength as the second term.
    where:
      - condition: model.class = text-generator
        reason: Coding work needs a model that generates text and code.
      - condition: model.lifecycle = active
        reason: An active model is still supported by its lab or provider.
    weights:
      offering.speed.throughput:
        weight: 0.6
        reason: Prefer the offering that produces output tokens fastest.
      software_engineering:
        weight: 0.4
        reason: Keep coding strength so a fast but weak model does not win on speed alone.
    needs:
      classes: [text-generator]
      domains: [software_engineering]
    canvas: {x: "facet:offering.speed.throughput", y: "capability:software_engineering"}
    teaches: Speed is a Prefer, not a gate. An offering without a measured speed may qualify but is not ranked, so this tier answers only once speeds are published.

  - id: coding-private
    category: coding
    tier: private
    name: Coding, self-hosted
    tradeoff: Open weights you run yourself; commercial licence.
    purpose: Find a commercially usable open-weights coding model that you can run on your own hardware.
    where:
      - condition: model.class = text-generator
        reason: Coding work needs a model that generates text and code.
      - condition: model.weights_openness = open_weights
        reason: Self-hosting requires downloadable weights; add a model.fits_hardware Must for the device you own.
      - condition: licence.commercial_use in {permitted, permitted_with_conditions}
        reason: The licence must allow commercial use, including use with stated conditions.
    weights:
      software_engineering:
        weight: 1.0
        reason: Rank only by the software-engineering capability estimate among self-hostable models.
    needs:
      classes: [text-generator]
      domains: [software_engineering]
    canvas: {x: "facet:model.parameters_total", y: "capability:software_engineering"}
    teaches: Privacy is a Must on the weights and the licence; the canvas shows the model size you would have to host.

