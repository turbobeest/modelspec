[project]
name = "modelspec-dev"
version = "0.1.0"
description = "A sourced model decision engine with an offline command-line interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "falkordb>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "click>=8.0",
    "cryptography>=43,<46",
]

[project.urls]
Homepage = "https://modelspec.dev"
Repository = "https://github.com/turbobeest/modelspec"
Documentation = "https://github.com/turbobeest/modelspec/tree/main/docs"

[project.optional-dependencies]
dev = [
    "jsonschema[format]>=4.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist==3.8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
researcher = [
    "beautifulsoup4>=4.12",
    "celery>=5.4",
    "anthropic>=0.39",
]

[project.scripts]
modelspec = "cli.modelspec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "cli",
    "decision",
    "schema",
    "api/__init__.py",
    "api/class_fit.py",
    "api/classes.py",
    "api/ranking",
    "pipeline/__init__.py",
    "pipeline/class_export.py",
    "pipeline/hardware.py",
    "pipeline/hosts.py",
    "pipeline/load.py",
    "pipeline/ranking.py",
]

[tool.hatch.build.targets.wheel.force-include]
registry = "registry"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
