[project]
name = "modelspec-dev"
version = "0.3.0"
description = "A thin keyed client for the hosted ModelSpec decision API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "click>=8.0",
    "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://modelspec.dev"
Repository = "https://github.com/turbobeest/modelspec"
Documentation = "https://github.com/turbobeest/modelspec/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pydantic>=2.0",
    "falkordb>=1.0",
    "rich>=13.0",
    "cryptography>=43,<46",
    "jsonschema[format]>=4.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist==3.8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
researcher = [
    "beautifulsoup4>=4.12",
    "celery>=5.4",
    "anthropic>=0.39",
]

[project.scripts]
modelspec = "cli.modelspec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "cli/__init__.py",
    "cli/modelspec/__init__.py",
    "cli/modelspec/cli.py",
    "cli/modelspec/auth.py",
    "cli/modelspec/client.py",
    "cli/modelspec/errors.py",
    "cli/modelspec/guidance.py",
    "cli/modelspec/setup.py",
    "cli/modelspec/spec.py",
    "cli/modelspec/agent-bundle.json",
    "cli/modelspec/spec.schema.json",
    "cli/modelspec/feedback.schema.json",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "cli/__init__.py",
    "cli/modelspec/__init__.py",
    "cli/modelspec/cli.py",
    "cli/modelspec/auth.py",
    "cli/modelspec/client.py",
    "cli/modelspec/errors.py",
    "cli/modelspec/guidance.py",
    "cli/modelspec/setup.py",
    "cli/modelspec/spec.py",
    "cli/modelspec/agent-bundle.json",
    "cli/modelspec/spec.schema.json",
    "cli/modelspec/feedback.schema.json",
    "pipeline/agent_copy.py",
    "pipeline/entity.py",
    "pipeline/pricing.py",
    "api/worker/tiers.json",
    "docs/decision-contract.schema.json",
    "schemas/feedback-v1.schema.json",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
