# Subscription logins stay with each CLI. The harness never opens auth files.
# Eligibility requires a doctor receipt for this image ID and adapter revision.
mcp_url: https://api.modelspec.dev/mcp
# Optional ModelSpec connection credential. This is not an agent-vendor API key.
mcp_token_env: MODELSPEC_API_KEY
concurrency_per_cli: 1
max_runs_per_cli: 10
timeout_seconds: 300
turn_cap: 8
clis:
  claude:
    version: "2.1.289"
    executable: claude
    config_dir: .claude
    model: fable
    effort: high
    usage_limit_exit_codes: []
  codex:
    version: "0.160.0"
    executable: codex
    min_version: "0.160"
    config_dir: .codex
    model: gpt-6.1-sol
    effort: max
    usage_limit_exit_codes: []
  gemini:
    version: "0.62.0"
    executable: gemini
    config_dir: .gemini
    model: gemini-3.8-pro
    usage_limit_exit_codes: []
  grok:
    version: "1.0.46"
    executable: grok
    config_dir: .grok
    model: grok-4.7
    effort: xhigh
    usage_limit_exit_codes: []
judges:
  claude: [grok, codex]
  codex: [grok, claude]
  gemini: [codex, claude]
  grok: [codex, claude]
