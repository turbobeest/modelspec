# Subscription logins stay with each CLI. The harness never opens auth files.
# Isolation support is verified in qa/tui_providers.py, not enabled by this file.
mcp_url: https://api.modelspec.dev/mcp
# Optional ModelSpec connection credential. This is not an agent-vendor API key.
mcp_token_env: MODELSPEC_API_KEY
concurrency_per_cli: 1
max_runs_per_cli: 10
timeout_seconds: 300
turn_cap: 8
clis:
  claude:
    executable: /Users/terbeest/.local/bin/claude
    model: fable
    effort: high
    usage_limit_exit_codes: []
  codex:
    executable: /Applications/ChatGPT.app/Contents/Resources/codex-cli/bin/codex
    model: gpt-6.1-sol
    effort: max
    usage_limit_exit_codes: []
  gemini:
    executable: gemini
    model: gemini-3.8-pro
    usage_limit_exit_codes: []
  grok:
    executable: grok
    model: grok-4.7
    effort: xhigh
    usage_limit_exit_codes: []
judges:
  claude: codex
  codex: claude
  gemini: claude
  grok: claude
