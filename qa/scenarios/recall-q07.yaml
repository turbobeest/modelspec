      '
    sources:
    - url: https://matharena.ai/competition_tables/aime--aime_2026
      read: '2026-09-24'
    - url: https://epoch.ai/data/benchmark_data.zip
      read: '2026-09-24'
    - url: https://matharena.ai/models
      read: '2026-09-24'
  missing_cards: []
