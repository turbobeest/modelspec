id: template-assistant-balanced
family: F1
persona: Engineer applying a published decision template
request: Find an active assistant that balances how people rate its responses against task cost.
constraints:
  must:
  - model.class = text-generator
  - model.lifecycle = active
  prefer:
    chat_preference:
      weight: 0.6
      reason: Prefer assistants whose open-ended responses people rate more highly.
    -offering.cost_per_task:
      weight: 0.4
      reason: Among strong assistants, prefer the cheaper task.
sources:
- registry/templates.yaml#assistant-balanced
template: assistant-balanced
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
