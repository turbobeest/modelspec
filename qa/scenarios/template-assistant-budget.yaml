id: template-assistant-budget
family: F4
persona: Engineer applying a published decision template
request: Find an active assistant that keeps one task at or under $0.05 without ignoring response
  quality.
constraints:
  must:
  - model.class = text-generator
  - model.lifecycle = active
  - offering.cost_per_task <= 0.05
  prefer:
    chat_preference:
      weight: 0.5
      reason: Prefer stronger assistants among offerings inside the budget.
    -offering.cost_per_task:
      weight: 0.5
      reason: Prefer the cheaper task among offerings inside the budget.
sources:
- registry/templates.yaml#assistant-budget
template: assistant-budget
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
