id: recall-q10
family: F4
persona: Developer choosing a model for production work
request: 'Choose a high-volume assistant whose input price is at most $0.20 per million tokens.

  '
constraints:
  class: generate
  task: high-volume general assistance
  price_cap_usd_per_million_input: 0.2
  price_includes_boundary: true
  open_weights: false
expected:
  id: Q10
  notes: 'Meeting the cap is not a quality ranking. No general-assistant comparison among these cheap
    models was read. Standard input price is the figure used. A price that is sometimes above the
    cap does not clear it. Gemini 2.0 Flash is not on Google''s current pricing page.

    '
  acceptable:
  - model_id: openai/gpt-6-luna
    reason: Standard input price $0.10 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-5-6-luna
    reason: Standard input price $0.20 per million tokens, which meets at most $0.20.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-5-4-nano
    reason: Standard input price $0.20 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-5-nano
    reason: Standard input price $0.05 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4-1-nano
    reason: Standard input price $0.10 per million tokens. Price qualification is not a quality win.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4o-mini
    reason: Standard input price $0.15 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-2-5-flash-lite
    reason: Text input price $0.10 per million tokens.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  must_never:
  - model_id: openai/gpt-6-astra
    reason: Standard input price $10 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4-1
    reason: Standard input price $2 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4-1-mini
    reason: Standard input price $0.40 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-3-8-flash
    reason: Input price $0.75 per million tokens through 2026-12-31.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: anthropic/claude-haiku-4-5
    reason: Standard input price $1 per million tokens.
    sources:
    - url: https://platform.claude.com/docs/en/about-claude/pricing
      read: '2026-09-24'
  - model_id: openai/text-embedding-3-large
    reason: Not an assistant.
    sources:
    - url: https://github.com/turbobeest/modelspec/blob/76eabc11/models/openai/text-embedding-3-large.md
      read: '2026-09-24'
  must_flag:
  - model_id: deepseek/deepseek-flash
    reason: 'Cache-miss input is $0.15 off-peak and $0.30 at peak, so it does not always sit at or
      under $0.20. The page identifies this row as DeepSeek-V4.1-Flash.

      '
    sources:
    - url: https://api-docs.deepseek.com/quick_start/pricing
      read: '2026-09-24'
  - model_id: google/gemini-2-0-flash
    reason: Not listed on the current Gemini pricing page, so today's input price was not read.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: deepseek/deepseek-v3-1
    reason: The current DeepSeek pricing page lists deepseek-flash and deepseek-v4-pro only.
    sources:
    - url: https://api-docs.deepseek.com/quick_start/pricing
      read: '2026-09-24'
  missing_cards: []
expected_source: tests/recall/expected.yaml#Q10
sources:
- tests/recall/questions.yaml#Q10
- tests/recall/specs/Q10.yaml
gaps:
- reason: high-volume throughput is not constrained because the question gives no rate.
  suggested_fix: Publish a dedicated facet or measured capability, or expose a clarification tool
    before deciding.
  source: tests/recall/specs/Q10.yaml
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
