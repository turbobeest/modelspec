id: template-regional-budget
family: F4
persona: Engineer applying a published decision template
request: Find the cheapest offering that runs inference in an EU member state and does not train
  on customer data.
constraints:
  must:
  - offering.region in {AT, BE, BG, HR, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HU, IE, IT, LT, LU, LV,
    MT, NL, PL, PT, RO, SE, SI, SK}
  - offering.data.trains_on_customer_data = false
  prefer:
    -offering.cost_per_task:
      weight: 0.7
      reason: Prefer the lower task cost after the data-handling gates pass.
    chat_preference:
      weight: 0.3
      reason: Keep a quality signal so a cheap but poor assistant does not win on cost alone.
sources:
- registry/templates.yaml#regional-budget
template: regional-budget
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
