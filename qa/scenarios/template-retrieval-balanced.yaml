id: template-retrieval-balanced
family: F1
persona: Engineer applying a published decision template
request: Find an embedding model that balances retrieval quality against the cost of embedding a
  task.
constraints:
  must:
  - model.class = vectoriser
  prefer:
    retrieval:
      weight: 0.7
      reason: Prefer stronger retrieval quality.
    -offering.cost_per_task:
      weight: 0.3
      reason: Among strong embedders, prefer the cheaper task.
sources:
