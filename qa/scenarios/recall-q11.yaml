id: recall-q11
family: F4
persona: Developer choosing a model for production work
request: 'Choose a low-cost support chatbot whose input price is at most $0.50 per million tokens.

  '
constraints:
  class: generate
  task: customer-support chat
  price_cap_usd_per_million_input: 0.5
  price_includes_boundary: true
  open_weights: false
expected:
  id: Q11
  notes: 'Same rule as Q10 at a $0.50 cap. Support quality was not compared. DeepSeek-V4.1-Flash
    stays under $0.50 at both the peak and off-peak cache-miss input prices. Haiku 4.5 at $1 does
    not.

    '
  acceptable:
  - model_id: openai/gpt-6-luna
    reason: Standard input price $0.10 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-5-nano
    reason: Standard input price $0.05 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4-1-nano
    reason: Standard input price $0.10 per million tokens. That does not establish support quality.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4-1-mini
    reason: Standard input price $0.40 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-5-mini
    reason: Standard input price $0.25 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4o-mini
    reason: Standard input price $0.15 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-3-5-turbo
    reason: Standard input price $0.50 per million tokens, on the boundary of the cap.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-2-5-flash-lite
    reason: Text input price $0.10 per million tokens.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-2-5-flash
    reason: Text input price $0.30 per million tokens.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-3-1-flash-lite
    reason: Text input price $0.25 per million tokens.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-3-5-flash-lite
    reason: Input price $0.30 per million tokens.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: deepseek/deepseek-flash
    reason: 'Cache-miss input is $0.15 off-peak and $0.30 at peak, both at or under $0.50. The row
      is DeepSeek-V4.1-Flash.

      '
    sources:
    - url: https://api-docs.deepseek.com/quick_start/pricing
      read: '2026-09-24'
  must_never:
  - model_id: openai/gpt-6-astra
    reason: Standard input price $10 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: openai/gpt-4-1
    reason: Standard input price $2 per million tokens.
    sources:
    - url: https://developers.openai.com/api/docs/pricing
      read: '2026-09-24'
  - model_id: google/gemini-3-8-flash
    reason: Input price $0.75 per million tokens through 2026-12-31.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: anthropic/claude-haiku-4-5
    reason: Standard input price $1 per million tokens.
    sources:
    - url: https://platform.claude.com/docs/en/about-claude/pricing
      read: '2026-09-24'
  - model_id: openai/text-embedding-3-large
    reason: Not a support chatbot.
    sources:
    - url: https://github.com/turbobeest/modelspec/blob/76eabc11/models/openai/text-embedding-3-large.md
      read: '2026-09-24'
  must_flag:
  - model_id: google/gemini-2-0-flash
    reason: Not listed on the current Gemini pricing page.
    sources:
    - url: https://ai.google.dev/gemini-api/docs/pricing
      read: '2026-09-24'
  - model_id: deepseek/deepseek-v3-1
    reason: Not listed on the current DeepSeek pricing page.
    sources:
    - url: https://api-docs.deepseek.com/quick_start/pricing
      read: '2026-09-24'
  missing_cards: []
expected_source: tests/recall/expected.yaml#Q11
sources:
- tests/recall/questions.yaml#Q11
- tests/recall/specs/Q11.yaml
gaps:
- reason: customer-support quality has no distinct registered domain.
  suggested_fix: Publish a dedicated facet or measured capability, or expose a clarification tool
    before deciding.
  source: tests/recall/specs/Q11.yaml
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
