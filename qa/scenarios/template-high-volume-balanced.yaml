id: template-high-volume-balanced
family: F4
persona: Engineer applying a published decision template
request: Find a text model for many short assistant requests that weighs quality and cost equally.
constraints:
  must:
  - model.class = text-generator
  prefer:
    chat_preference:
      weight: 0.5
      reason: Prefer assistants whose responses people rate more highly.
    -offering.cost_per_task:
      weight: 0.5
      reason: At volume, cost carries as much weight as quality.
  task_tokens:
    input: 2000
    output: 500
sources:
- registry/templates.yaml#high-volume-balanced
template: high-volume-balanced
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
