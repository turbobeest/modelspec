id: recall-q12
family: F3
persona: Developer choosing a model for production work
request: 'Choose the best open-weights coding model to self-host, assuming the hardware is adequate.

  '
constraints:
  class: generate
  task: coding
  open_weights: true
  hosting: self_hosted
  hardware: adequate, no device named
expected:
  id: Q12
  notes: 'No like-for-like self-hosted coding order was found. Terminal-Bench 4.0''s rendered board
    has no DeepSeek or Qwen row. SWE-bench.com Verified does not include the September 2026 open
    models. The three current open-weight contenders below have weights on Hugging Face and no shared
    coding score in the boards read today, so they may qualify and must not be ranked from a missing
    score.

    '
  acceptable:
  - rule: no separated open-weights coding winner
    reason: 'The allowed coding boards do not place DeepSeek-V4.1-Flash, Qwen3.8-Flash-Next and Qwen3.8-27B
      on one comparison.

      '
    sources:
    - url: https://www.tbench.ai/leaderboard
      read: '2026-09-24'
    - url: https://www.swebench.com/
      read: '2026-09-24'
  must_never:
  - model_id: openai/gpt-6-astra
    reason: Closed weights. The question asks for a model to self-host.
    sources:
    - url: https://developers.openai.com/api/docs/models/gpt-6-astra
      read: '2026-09-24'
  - model_id: anthropic/claude-opus-5-5
    reason: Sold as an API model. Not an open-weights download.
    sources:
    - url: https://platform.claude.com/docs/en/about-claude/pricing
      read: '2026-09-24'
  must_flag:
  - model_id: deepseek/deepseek-flash
    reason: 'Hugging Face lists MIT weights for DeepSeek-V4.1-Flash. No Terminal-Bench 4.0 or SWE-bench.com
      row was found for it.

      '
    sources:
    - url: https://huggingface.co/api/models/deepseek-ai/DeepSeek-V4.1-Flash
      read: '2026-09-24'
    - url: https://www.tbench.ai/leaderboard
      read: '2026-09-24'
  - model_id: qwen/qwen3-8-flash-next
    reason: 'Hugging Face lists about 180.0 billion BF16 parameters and licence "other". No shared
      coding row was found. The licence is not a known open-source licence.

      '
    sources:
    - url: https://huggingface.co/api/models/Qwen/Qwen3.8-Flash-Next
      read: '2026-09-24'
  - name: Qwen3.8-27B
    reason: 'Hugging Face Qwen/Qwen3.8-27B is Apache-2.0 and about 27.8 billion parameters. The catalogue
      has no canonical card, only a hosted Cerebras card. No shared coding row was found.

      '
    sources:
    - url: https://huggingface.co/api/models/Qwen/Qwen3.8-27B
      read: '2026-09-24'
  missing_cards:
  - name: Qwen3.8-27B
    reason: Canonical weights exist. The catalogue card is the hosted cerebras/qwen-3-8-27b entry
      only.
    sources:
    - url: https://huggingface.co/api/models/Qwen/Qwen3.8-27B
      read: '2026-09-24'
expected_source: tests/recall/expected.yaml#Q12
sources:
- tests/recall/questions.yaml#Q12
- tests/recall/specs/Q12.yaml
gaps:
- reason: the registry has no model-level self-hosting facet; open weights does not prove deployability.
  suggested_fix: Publish a dedicated facet or measured capability, or expose a clarification tool
    before deciding.
  source: tests/recall/specs/Q12.yaml
- reason: '"adequate hardware" names no registered hardware SKU to constrain.'
  suggested_fix: Publish a dedicated facet or measured capability, or expose a clarification tool
    before deciding.
  source: tests/recall/specs/Q12.yaml
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
