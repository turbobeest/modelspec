id: template-coding-fastest
family: F1
persona: Engineer applying a published decision template
request: Find an active coding model whose offering streams output fastest; coding strength weighs
  more than speed.
constraints:
  must:
  - model.class = text-generator
  - model.lifecycle = active
  prefer:
    offering.speed.throughput:
      weight: 0.25
      reason: Among offerings of similar coding strength, prefer the one that produces output tokens
        fastest.
    software_engineering:
      weight: 0.75
      reason: Weigh coding strength above speed, so a model must reach two thirds of the lineup's
        range to win on speed (MODEL-212).
sources:
- registry/templates.yaml#coding-fastest
template: coding-fastest
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
