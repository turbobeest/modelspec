id: template-long-documents
family: F1
persona: Engineer applying a published decision template
request: Find a text model that can accept million-token documents and produce strong written analysis.
constraints:
  must:
  - model.class = text-generator
  - model.context_window >= 1000000
  prefer:
    writing:
      weight: 0.5
      reason: Prefer clear, high-quality long-form writing.
    reasoning:
      weight: 0.3
      reason: Prefer stronger multi-step analysis of the document.
    -offering.cost_per_task:
      weight: 0.2
      reason: Use cost as a smaller tie-breaker after writing and reasoning quality.
sources:
- registry/templates.yaml#long-documents
template: long-documents
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
