id: template-high-volume-fastest
family: F4
persona: Engineer applying a published decision template
request: Find a text model for many short requests whose offering streams output fastest among strong,
  affordable models.
constraints:
  must:
  - model.class = text-generator
  prefer:
    chat_preference:
      weight: 0.75
      reason: Weigh response quality three times speed and cost together, so a fast, cheap but weak
        model cannot win (MODEL-212).
    offering.speed.throughput:
      weight: 0.15
      reason: Among offerings of similar quality, prefer the one that produces output tokens fastest.
    -offering.cost_per_task:
      weight: 0.1
      reason: At volume, cost still counts.
  task_tokens:
    input: 2000
    output: 500
sources:
- registry/templates.yaml#high-volume-fastest
template: high-volume-fastest
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
