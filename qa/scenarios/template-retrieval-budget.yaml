id: template-retrieval-budget
family: F4
persona: Engineer applying a published decision template
request: Find the cheapest hosted embedding model without ignoring retrieval quality.
constraints:
  must:
  - model.class = vectoriser
  prefer:
    -offering.cost_per_task:
      weight: 0.6
      reason: Prefer the cheaper task; embedding a corpus is priced per token.
    retrieval:
      weight: 0.4
      reason: Keep retrieval quality so a cheap but poor embedder does not win on cost alone.
sources:
- registry/templates.yaml#retrieval-budget
template: retrieval-budget
expected: null
rubric:
- Preserve every hard constraint and explain any constraint the API cannot express.
- Base recommendations on returned evidence; unknown is not a pass and a proxy is not direct evidence.
- Report ties or abstain when evidence cannot establish a winner; cite model and offering identities.
gaps: []
