id: template-maths-reasoning-fastest
family: F1
persona: Engineer applying a published decision template
request: Find an active text model whose offering streams output fastest; maths weighs more than
  speed.
constraints:
  must:
  - model.class = text-generator
  - model.lifecycle = active
  prefer:
    offering.speed.throughput:
      weight: 0.25
      reason: Among offerings of similar maths strength, prefer the one that produces output tokens
        fastest.
    maths:
      weight: 0.75
      reason: Weigh maths strength above speed, so a model must reach two thirds of the lineup's
        range to win on speed (MODEL-212).
