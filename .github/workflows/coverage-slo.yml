name: Coverage report

# MODEL-215. Once a day: measure every coverage target in
# docs/method/coverage-slo.md, publish the report to the `coverage` Pages
# branch, and keep one GitHub issue per breached target. A breach does not
# fail this job; a report that cannot be written does.
#
# Cost: two jobs. `report` takes about four minutes (the snapshot build reads
# every card); `private-health` about one. About thirty REST calls: one per
# scheduled workflow here and in modelspec-data plus one per private workflow
# file (MODEL-421), one per refresh branch (MODEL-232), one issue listing, and
# one per issue change.
#
# workflow-health (MODEL-421) watches every scheduled workflow, from its cron
# lines, here and in modelspec-data. This log, the report and its issues are
# public, so the private repository is checked in its own job,
# `private-health`. That job alone holds MODELSPEC_DATA_TOKEN (Contents: read
# and Actions: read on modelspec-data), reads the private workflow files and
# runs through the API (no checkout), prints nothing, uploads and caches
# nothing, and hands on only pass or fail as its job result. `report` holds no
# private access and turns that one word into the workflow-health result. The
# names and runs of red private workflows are in modelspec-data's own
# workflow-health issue.

on:
  schedule:
    # After the 06:00-07:00 UTC research, curation and accuracy runs finish.
    - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      stage_breach:
        description: 'A target id to give a synthetic breach, to prove the alert path'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: read
  # refresh-pr-merged lists the refresh branches' pull requests (MODEL-232).
  pull-requests: read

concurrency:
  group: coverage-slo
  cancel-in-progress: false

jobs:
  # The only job with private access. It passes when every scheduled workflow
  # in the private repository is green and fails otherwise (red, unreadable,
  # or no token). No output, summary, artifact or cache: the leak guard in
  # tests/test_data_workflows.py holds it to that.
  private-health:
    name: Check the private repository's scheduled workflows (pass or fail only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The same install as `report`, without its pip cache: a job with
      # private access saves no cache.
      - name: Install
        run: python -m pip install -e . "pydantic==2.13.5"

      - name: Fail when any private scheduled workflow is red or unreadable
        env:
          MODELSPEC_DATA_TOKEN: ${{ secrets.MODELSPEC_DATA_TOKEN }}
        run: |
          if [ -z "$MODELSPEC_DATA_TOKEN" ]; then
            echo "::warning::The private-data token is not set, so this check fails."
            exit 1
          fi
          python -m scripts.slo workflows --repo turbobeest/modelspec-data --quiet

  report:
    name: Measure the coverage targets
    needs: private-health
    # Runs whatever the private check concluded; its result is an input.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE_BREACH: ${{ inputs.stage_breach }}
      # success, failure, cancelled or skipped; read through result_env in
      # scripts/slo/targets.yaml.
      PRIVATE_WORKFLOW_HEALTH: ${{ needs.private-health.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # The package is the thin client since MODEL-307, so `-e .` no longer
      # brings pydantic; the report reaches it through `decision` (MODEL-312).
      - name: Install
        run: python -m pip install -e . "pydantic==2.13.5"

      - name: Measure every target
        run: |
          stage=()
          if [ -n "$STAGE_BREACH" ]; then stage=(--stage-breach "$STAGE_BREACH"); fi
          python -m scripts.slo report --out coverage-report "${stage[@]}"
          cat coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Open, update, escalate and close breach issues
        run: python -m scripts.slo alert --report coverage-report/coverage.json --apply

      - name: Check the Pages credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::No Cloudflare credentials; the report is in the run artifact only."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A preview branch of the modelspec Pages project, never production.
      - name: Publish the report page
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy coverage-report --project-name=modelspec --branch=coverage
