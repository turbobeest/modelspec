name: Build and deploy the sites

# The published state of both domains should always be a commit, never whatever
# somebody last pushed from a laptop. Build on every merge to main; deploy only
# from main, and only after the build has succeeded.
#
# Holding mode (Jamie, 2026-09-24). The repository variable SITE_MODE is the one
# switch. The full v1 tree is built first because holding derives its API and
# legal files from it. The workflow then replaces `dist` with the decide-only
# live composition and copies that tree byte for byte to the Pages preview
# branch `internal` (https://internal.modelspec-7np.pages.dev). Production
# (`--branch=main`) gets that composition only when SITE_MODE is
# exactly `live`; unset, empty or anything else gets the modelspec holding tree
# (pipeline/holding.py): a holding page, with /api/**, /legal/** and openapi.yaml
# byte for byte as the real build has them. A missing variable fails closed.
# benchgraph.dev (MODEL-126) is the same `_redirects` file in both modes, on
# `main` and on `internal` (https://internal.benchgraph.pages.dev). It has no
# holding page. Its paths redirect to modelspec.dev, so the dark 404 and the
# live /api/** are the modelspec tree the redirect lands on.
# Relaunch, go dark again, test: docs/handoff/holding-mode.md.

on:
  push:
    branches: [main]
  # Required check "Build both sites" must report on every PR. Filtering
  # this workflow by path leaves the check pending and deadlocks merge
  # (docs-only PR #34). Deploy still runs only on main, below.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_MODE: ${{ vars.SITE_MODE }}
  DATA_SPLIT_ENABLED: ${{ vars.DATA_SPLIT_ENABLED }}

concurrency:
  group: deploy-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both sites
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.holding.outputs.mode }}
      production: ${{ steps.holding.outputs.production }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # httpx: the decision snapshot build imports `decision.sources`
        # (MODEL-137), which fetches with it. Without it the snapshot step warns
        # and publishes nothing (seen on 8e4660a9).
        run: pip install pydantic pyyaml "httpx==0.28.1" "cryptography>=43,<46"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the decide app
        env:
          VITE_HUMAN_GATE_ENABLED: ${{ vars.HUMAN_GATE_ENABLED || 'false' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_VOCABULARY_URL: ${{ vars.DATA_SPLIT_ENABLED == 'true' && 'https://api.modelspec.dev/v1/vocabulary' || '/api/decision/vocabulary.json' }}
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Write the spec corpus's decisions for the web suite
        # MODEL-203. The engine's answer to every spec in tests/corpus, and each
        # corpus snapshot's vocabulary. The next two steps parse them with the
        # page's schema and draw them on the built page, so a field the page
        # reads strictly and the engine sends as null (#361) fails this PR.
        run: python -m tests.corpus decisions --out web/src/decide/__corpus__

      - name: Test the decide app
        # The web suite (Vitest) guards the decide page on every PR: this job is
        # the required "Build both sites" check.
        working-directory: web
        env:
          MODELSPEC_CORPUS_REQUIRED: '1'
        run: npm test

      - name: Draw the spec corpus on the built decide page in Chromium
        # MODEL-203. vite preview serves web/dist; the vocabulary and /v1/decide
        # are stubbed per case. No invalid_response, no blank table, no route
        # called "API". The Reset-all template check is an expected failure
        # until MODEL-204 lands.
        working-directory: web
        env:
          CI: true
        run: npx playwright test --config=playwright.corpus.config.ts

      - name: Build
        id: build
        env:
          MODELSPEC_RENDER_SOCIAL_CARDS: '1'
          MODELSPEC_SNAPSHOT_KEY: ${{ github.event_name != 'pull_request' && secrets.MODELSPEC_SNAPSHOT_KEY || '' }}
          MODELSPEC_SNAPSHOT_ED25519_KEY: ${{ github.event_name != 'pull_request' && secrets.MODELSPEC_SNAPSHOT_ED25519_KEY || '' }}
        run: |
          snapshot_args=()
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            snapshot_args+=(--decision-snapshot-if-ready)
          fi
          python -m pipeline.build --out dist "${snapshot_args[@]}" | tee summary.json
          {
            echo '### Site build'
            echo
            echo '```json'
            cat summary.json
            echo '```'
            echo
            echo "modelspec.dev: $(find dist/modelspec -type f | wc -l) files, $(du -sh dist/modelspec | cut -f1)"
            echo "benchgraph.dev: $(find dist/benchgraph -type f | wc -l) files, $(du -sh dist/benchgraph | cut -f1) (redirect only)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the holding trees, and pick what production gets
        id: holding
        run: |
          python -m pipeline.holding build --src dist --out dist-holding
          mode=$(python -m pipeline.holding mode)
          if [ "$mode" = "live" ]; then production=dist; else production=dist-holding; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"
          {
            echo "### Site mode: $mode"
            echo
            echo "Repository variable SITE_MODE: \`${SITE_MODE:-unset}\`."
            echo "Production modelspec.dev gets \`$production/modelspec\`."
            echo "benchgraph.dev gets \`$production/benchgraph\`, the redirect file"
            echo '(the same bytes as `dist/benchgraph`, in both modes).'
            echo 'The modelspec preview branch `internal` gets the same decide composition as live.'
            echo
            echo "holding modelspec: $(find dist-holding/modelspec -type f | wc -l) files, $(du -sh dist-holding/modelspec | cut -f1)"
            echo "holding benchgraph: $(find dist-holding/benchgraph -type f | wc -l) files, $(du -sh dist-holding/benchgraph | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the live and internal decide sites
        run: |
          # Holding must derive from the untouched full build above. Live is a
          # whitelist (pipeline/live.py) so a new v1 page cannot reappear merely
          # by being generated, and it fails if llms.txt, the Markdown twin, the
          # MCP card or the agent skill names a path the tree lacks (MODEL-214).
          mv dist dist-v1
          python -m pipeline.live build --src dist-v1 --web web/dist --out dist
          cp -a dist dist-internal
          diff -r dist dist-internal
          rm -rf dist-v1

      - name: Check the graph in Chromium
        env:
          CI: true
          MODELSPEC_GRAPH_BASE_URL: http://127.0.0.1:8000
        run: |
          cd web
          npx playwright install --with-deps chromium
          cd ..
          python -m http.server 8000 --bind 127.0.0.1 --directory dist/modelspec >/tmp/modelspec-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          cd web
          npx playwright test --config=playwright.graph.config.ts

      - name: Guard the Cloudflare Pages limits
        run: |
          # Pages refuses a deployment over 20,000 files or with any file over 25 MiB.
          # Failing here is far cheaper than a rejected deploy.
          # benchgraph, in all three trees, is the one-file redirect.
          # The limit still applies. There is no minimum size.
          for site in dist/modelspec dist/benchgraph dist-holding/modelspec dist-holding/benchgraph dist-internal/modelspec; do
            count=$(find "$site" -type f | wc -l)
            if [ "$count" -ge 20000 ]; then
              echo "::error::$site has $count files, at or over the Pages limit of 20,000"
              exit 1
            fi
            big=$(find "$site" -type f -size +25M | head -1)
            if [ -n "$big" ]; then
              echo "::error::$site contains a file over 25 MiB: $big"
              exit 1
            fi
          done

      - name: Check the pages we promise actually exist
        run: |
          set -e
          test -s dist/modelspec/index.html
          test -s dist/modelspec/method/index.html
          test -s dist/modelspec/decide/index.html
          test -s dist/modelspec/graph/index.html
          test -s dist/modelspec/graph/vendor/three.min.js
          test -s dist/modelspec/graph/vendor/3d-force-graph.min.js
          test "$(find dist/modelspec/graph/vendor -type f | wc -l | tr -d ' ')" = 2
          test ! -e dist/modelspec/graph/vendor/README.md
          test -s dist/modelspec/pricing/index.html
          test -s dist/modelspec/pricing-assets/pricing.css
          test -s dist/modelspec/pricing-assets/pricing.js
          test -s dist/modelspec/fonts/instrument-sans-latin-wdth-normal.woff2
          test -s dist/modelspec/feedback/index.html
          test -s dist/modelspec/feedback-assets/feedback.js
          test -s dist/modelspec/api/feedback/v1.schema.json
          grep -Fq 'https://api.modelspec.dev/v1/feedback' dist/modelspec/llms.txt
          grep -Fq 'data-feedback-launch' dist/modelspec/method/index.html
          grep -Fq '<link rel="canonical" href="https://modelspec.dev/"' dist/modelspec/index.html
          grep -Fq '<link rel="canonical" href="https://modelspec.dev/method/"' dist/modelspec/method/index.html
          grep -Fq '<link rel="canonical" href="https://modelspec.dev/decide/"' dist/modelspec/decide/index.html
          grep -Fq '<link rel="canonical" href="https://modelspec.dev/graph/"' dist/modelspec/graph/index.html
          grep -Fq '<link rel="canonical" href="https://modelspec.dev/pricing/"' dist/modelspec/pricing/index.html
          ! grep -Eiq '<meta[^>]+noindex' dist/modelspec/index.html
          ! grep -Eiq '<meta[^>]+noindex' dist/modelspec/method/index.html
          ! grep -Eiq '<meta[^>]+noindex' dist/modelspec/decide/index.html
          ! grep -Eiq '<meta[^>]+noindex' dist/modelspec/graph/index.html
          ! grep -Eiq '<meta[^>]+noindex' dist/modelspec/pricing/index.html
          ! grep -Fiq 'X-Robots-Tag' dist/modelspec/_headers
          grep -Fq '/landing/  /  301' dist/modelspec/_redirects
          test ! -e dist/modelspec/landing
          test -s dist/modelspec/sitemap.xml
          for f in llms.txt llms-full.txt index.md auth.md .well-known/mcp.json .well-known/api-catalog; do test -s dist/modelspec/$f; done
          test -s dist/modelspec/404.html
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -s dist/modelspec/api/index.json
          fi
          test -s dist/modelspec/api/build.json
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -s dist/modelspec/api/catalogue.json
          fi
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -s dist/modelspec/api/rank/candidates.json
          fi
          test -s dist/modelspec/api/rank/profiles.json
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -s dist/modelspec/api/policy/catalogue.json
          fi
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -s dist/modelspec/api/graph/views/hardware.json
          fi
          test -s dist/modelspec/legal/terms/index.html
          test -s dist/modelspec/legal/privacy/index.html
          test -s dist/modelspec/legal/neutrality/index.html
          test -s dist/modelspec/favicon.ico
          test -s dist/modelspec/favicon-64.png
          test -s dist/modelspec/icon.svg
          test -s dist/modelspec/apple-touch-icon.png
          test -s dist/modelspec/icon-192.png
          test -s dist/modelspec/icon-512.png
          test -s dist/modelspec/og-card.png
          for card in $(python -m pipeline.social_cards filenames); do test -s dist/modelspec/$card; done
          test -s dist/modelspec/site.webmanifest
          test ! -e dist/modelspec/downselect
          test ! -e dist/modelspec/models
          test ! -e dist/modelspec/providers
          test ! -e dist/modelspec/benchmarks
          test ! -e dist/modelspec/m
          test ! -e dist/modelspec/p
          test ! -e dist/modelspec/b
          diff -r dist dist-internal
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/benchgraph")
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file())
          if files != ["_redirects"]:
              raise SystemExit(f"dist/benchgraph should be only _redirects, found {files}")
          expected = (
              "/   https://modelspec.dev/             301\n"
              "/*  https://modelspec.dev/:splat       301\n"
          )
          got = (root / "_redirects").read_text(encoding="utf-8")
          if got != expected:
              raise SystemExit(f"_redirects content: {got!r}")
          print("benchgraph.dev redirect tree ok")
          PY

      - name: Check the holding trees are dark and keep the data
        run: |
          set -e
          test -s dist-holding/modelspec/index.html
          test -s dist-holding/modelspec/404.html
          grep -q 'X-Robots-Tag: noindex' dist-holding/modelspec/_headers
          grep -Fq '<link rel="canonical" href="https://modelspec.dev/">' dist-holding/modelspec/index.html
          ! grep -Eiq '<meta[^>]+noindex' dist-holding/modelspec/index.html
          grep -Eiq '<meta[^>]+noindex' dist-holding/modelspec/404.html
          test ! -e dist-holding/modelspec/sitemap.xml
          test ! -e dist-holding/modelspec/_worker.js
          test ! -e dist-holding/modelspec/llms.txt
          test ! -e dist-holding/modelspec/b
          diff -r dist/modelspec/api dist-holding/modelspec/api
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -s dist-holding/modelspec/api/catalogue.json
          fi
          if [ "$DATA_SPLIT_ENABLED" != "true" ]; then
          test -n "$(find dist-holding/modelspec/api/benchmarks -name '*.json' -print -quit)"
          fi
          diff -r dist/modelspec/legal dist-holding/modelspec/legal
          cmp dist/modelspec/openapi.yaml dist-holding/modelspec/openapi.yaml
          # benchgraph is the redirect file in both trees. No holding page, no local /api.
          diff -r dist/benchgraph dist-holding/benchgraph
          test -s dist-holding/benchgraph/_redirects
          test "$(find dist-holding/benchgraph -type f | wc -l)" -eq 1

      - name: Check the export carries a pin-able schema version
        if: vars.DATA_SPLIT_ENABLED != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(rel):
              return json.loads(Path(rel).read_text(encoding="utf-8"))

          index = load("dist/modelspec/api/index.json")
          build = load("dist/modelspec/api/build.json")
          candidates = load("dist/modelspec/api/rank/candidates.json")
          profiles = load("dist/modelspec/api/rank/profiles.json")
          hardware = load("dist/modelspec/api/graph/views/hardware.json")
          policy = load("dist/modelspec/api/policy/catalogue.json")
          version = build["export_schema_version"]
          if not version or not str(version)[0].isdigit():
              raise SystemExit(f"build.json export_schema_version is unusable: {version!r}")
          for name, payload in (
              ("index.json", index),
              ("candidates.json", candidates),
              ("profiles.json", profiles),
              ("hardware.json", hardware),
              ("policy/catalogue.json", policy),
          ):
              got = (payload.get("build") or {}).get("export_schema_version")
              if got != version:
                  raise SystemExit(
                      f"{name} build.export_schema_version {got!r} != build.json {version!r}"
                  )
          # MODEL-80: this file is the free tier's whole source, so an uncited
          # policy answer in it is an uncited answer served to a customer.
          # Standing rule 1, enforced on the artifact rather than on the card.
          uncited = [
              row["model_id"] for row in policy["models"]
              if (row["primary_provider"]["data_residency_disclosure"] == "published"
                  and not (row["primary_provider"]["data_residency_source"] or {}).get("read_on"))
          ]
          if uncited:
              raise SystemExit(
                  f"{len(uncited)} policy rows publish a residency with no read date: "
                  f"{uncited[:5]}")
          print(f"export_schema_version={version}")
          print(f"policy rows: {policy['count']} models, "
                f"{sum(len(r['platforms']) for r in policy['models'])} platform rows")
          PY

      - name: Last good site remains if this build failed
        if: failure()
        run: |
          {
            echo '### Export failed; last good site remains serving'
            echo
            echo 'This job did not produce a deployable tree. The deploy job only'
            echo 'runs after a successful build on main, so the previous Cloudflare'
            echo 'Pages deployment of modelspec.dev and benchgraph.dev stays up.'
            echo 'The store is the static tree, not R2 or D1.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sites
          path: dist
          retention-days: 7
          # upload-artifact >= 4.4 drops dotfiles by default, which silently
          # removed dist/*/.well-known/ (api-catalog, mcp.json, agent-skills)
          # from every deploy (MODEL-94).
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: sites-holding
          path: dist-holding
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: sites-internal
          path: dist-internal
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployed: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Check the deploy credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Skip rather than fail when the repository has no Cloudflare
          # credentials yet, so main does not sit red for a missing secret
          # while the build itself is healthy.
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Deploy skipped'
              echo
              echo 'CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this'
              echo 'repository, so the built sites were not published. The build artifact'
              echo 'is attached to this run.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites
          path: dist

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites-holding
          path: dist-holding

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites-internal
          path: dist-internal

      # Production first, so the domains show what SITE_MODE says even if a
      # preview deploy below fails. `production` is dist-holding unless
      # SITE_MODE is exactly `live` (the build job's summary names it).
      - name: Deploy modelspec.dev (${{ needs.build.outputs.mode }})
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ needs.build.outputs.production || 'dist-holding' }}/modelspec --project-name=modelspec --branch=main

      # Redirect file in both modes: dist-holding/benchgraph is a copy of dist/benchgraph.
      - name: Deploy benchgraph.dev (${{ needs.build.outputs.mode }})
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ needs.build.outputs.production || 'dist-holding' }}/benchgraph --project-name=benchgraph --branch=main

      # The same composition as live, always, on `internal` for testing.
      - name: Deploy the real modelspec site to the internal preview
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-internal/modelspec --project-name=modelspec --branch=internal

      # Same redirect file production deploys. Benchmark pages preview on modelspec.
      - name: Deploy the real benchgraph site to the internal preview
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/benchgraph --project-name=benchgraph --branch=internal

  smoke:
    # MODEL-203. After each deploy, what visitors and the CLI get, with nothing
    # stubbed: corpus specs POSTed to api.modelspec.dev and parsed with the page's
    # schema, the deployed /decide/ page drawing an answer in Chromium, and a
    # clean install of this commit's wheel against the published snapshot. It
    # fails loudly and rolls nothing back: the deploy already happened.
    name: Smoke-test the deployed decide surfaces
    needs: [build, deploy]
    # Only after a real deploy: without credentials the deploy job succeeds
    # with its steps skipped, and nothing new is live to test.
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://api.modelspec.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          pip install pydantic pyyaml "httpx==0.28.1" build
          cd web && npm ci

      - name: Wait for the Worker from this commit
        # rank-api.yml deploys it from the same push; up to 10 minutes, then a
        # warning and the Worker that is serving is tested anyway.
        run: python -m tests.corpus wait-worker --origin "$API" --commit "$GITHUB_SHA"

      - name: POST the live corpus specs to api.modelspec.dev
        run: python -m tests.corpus live --origin "$API" --out live-corpus

      - name: Parse the live answers with the page's schema
        if: ${{ !cancelled() }}
        working-directory: web
        env:
          MODELSPEC_CORPUS_DIR: ../live-corpus
          MODELSPEC_CORPUS_REQUIRED: '1'
        run: npx vitest run src/decide/__tests__/corpus.test.ts

      - name: Fetch agent discovery from the deployed sites
        # MODEL-214. llms.txt, llms-full.txt, index.md and auth.md were absent
        # from production from the 2026-09-25 flip until MODEL-214, and nothing failed.
        if: ${{ !cancelled() }}
        run: |
          status=0
          python -m pipeline.live smoke --origin https://internal.modelspec-7np.pages.dev || status=1
          if [ "${{ needs.build.outputs.mode }}" = "live" ]; then
            python -m pipeline.live smoke --origin https://modelspec.dev || status=1
          fi
          exit $status

      - name: Load the deployed /decide/ in Chromium
        if: ${{ !cancelled() }}
        working-directory: web
        env:
          CI: true
        run: |
          npx playwright install --with-deps chromium
          urls="https://internal.modelspec-7np.pages.dev/decide/"
          if [ "${{ needs.build.outputs.mode }}" = "live" ]; then urls="$urls https://modelspec.dev/decide/"; fi
          status=0
          for url in $urls; do
            echo "::group::$url"
            MODELSPEC_DECIDE_URL="$url" npx playwright test --config=playwright.corpus.config.ts || { status=1; echo "::error::$url did not draw a decision"; }
            echo "::endgroup::"
          done
          exit $status

      - name: Run the CLI matrix from a clean install of this commit's wheel
        if: ${{ !cancelled() && vars.DATA_SPLIT_ENABLED != 'true' }}
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/bin/pip" install -q "$RUNNER_TEMP"/wheel/*.whl
          python -m tests.corpus cli-matrix --modelspec "$RUNNER_TEMP/cli/bin/modelspec" --work "$RUNNER_TEMP/cli-matrix"
