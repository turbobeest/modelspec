name: Build and deploy the sites

# The published state of both domains should always be a commit, never whatever
# somebody last pushed from a laptop. Build on every merge to main; deploy only
# from main, and only after the build has succeeded.
#
# Holding mode (Jamie, 2026-09-24). The repository variable SITE_MODE is the one
# switch. The real site is always built and always deployed to the Pages preview
# branch `internal` (https://internal.modelspec-7np.pages.dev,
# https://internal.benchgraph.pages.dev). Production (`--branch=main`, the two
# domains) gets the real site only when SITE_MODE is exactly `live`; unset,
# empty or anything else gets the holding trees (pipeline/holding.py): a
# holding page, with /api/**, /legal/** and openapi.yaml byte for byte as the
# real build has them. A missing variable fails closed.
# Relaunch, go dark again, test: docs/handoff/holding-mode.md.

on:
  push:
    branches: [main]
  # Required check "Build both sites" must report on every PR. Filtering
  # this workflow by path leaves the check pending and deadlocks merge
  # (docs-only PR #34). Deploy still runs only on main, below.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_MODE: ${{ vars.SITE_MODE }}

concurrency:
  group: deploy-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both sites
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.holding.outputs.mode }}
      production: ${{ steps.holding.outputs.production }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pydantic pyyaml

      - name: Build
        id: build
        run: |
          python -m pipeline.build --out dist | tee summary.json
          {
            echo '### Site build'
            echo
            echo '```json'
            cat summary.json
            echo '```'
            echo
            echo "modelspec.dev: $(find dist/modelspec -type f | wc -l) files, $(du -sh dist/modelspec | cut -f1)"
            echo "benchgraph.dev: $(find dist/benchgraph -type f | wc -l) files, $(du -sh dist/benchgraph | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the holding trees, and pick what production gets
        id: holding
        run: |
          python -m pipeline.holding build --src dist --out dist-holding
          mode=$(python -m pipeline.holding mode)
          if [ "$mode" = "live" ]; then production=dist; else production=dist-holding; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"
          {
            echo "### Site mode: $mode"
            echo
            echo "Repository variable SITE_MODE: \`${SITE_MODE:-unset}\`."
            echo "Production (modelspec.dev, benchgraph.dev) gets \`$production\`;"
            echo 'the preview branch `internal` gets the real site, `dist`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard the Cloudflare Pages limits
        run: |
          # Pages refuses a deployment over 20,000 files or with any file over 25 MiB.
          # Failing here is far cheaper than a rejected deploy.
          for site in dist/modelspec dist/benchgraph dist-holding/modelspec dist-holding/benchgraph; do
            count=$(find "$site" -type f | wc -l)
            if [ "$count" -ge 20000 ]; then
              echo "::error::$site has $count files, at or over the Pages limit of 20,000"
              exit 1
            fi
            big=$(find "$site" -type f -size +25M | head -1)
            if [ -n "$big" ]; then
              echo "::error::$site contains a file over 25 MiB: $big"
              exit 1
            fi
          done

      - name: Check the pages we promise actually exist
        run: |
          set -e
          test -s dist/modelspec/index.html
          test -s dist/modelspec/models/index.html
          test -s dist/modelspec/sitemap.xml
          test -s dist/modelspec/404.html
          test -s dist/benchgraph/index.html
          test -s dist/benchgraph/benchmarks/index.html
          test -s dist/benchgraph/sitemap.xml
          test -s dist/benchgraph/404.html
          test -s dist/benchgraph/api/catalogue.json
          test -s dist/modelspec/api/index.json
          test -s dist/modelspec/api/build.json
          test -s dist/modelspec/api/rank/candidates.json
          test -s dist/modelspec/api/rank/profiles.json
          test -s dist/modelspec/api/policy/catalogue.json
          test -s dist/modelspec/api/graph/views/hardware.json

      - name: Check the holding trees are dark and keep the data
        run: |
          set -e
          for site in modelspec benchgraph; do
            test -s "dist-holding/$site/index.html"
            test -s "dist-holding/$site/404.html"
            grep -q 'X-Robots-Tag: noindex' "dist-holding/$site/_headers"
            test ! -e "dist-holding/$site/sitemap.xml"
            test ! -e "dist-holding/$site/_worker.js"
            test ! -e "dist-holding/$site/llms.txt"
            diff -r "dist/$site/api" "dist-holding/$site/api"
          done
          diff -r dist/modelspec/legal dist-holding/modelspec/legal
          cmp dist/modelspec/openapi.yaml dist-holding/modelspec/openapi.yaml

      - name: Check the export carries a pin-able schema version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(rel):
              return json.loads(Path(rel).read_text(encoding="utf-8"))

          index = load("dist/modelspec/api/index.json")
          build = load("dist/modelspec/api/build.json")
          candidates = load("dist/modelspec/api/rank/candidates.json")
          profiles = load("dist/modelspec/api/rank/profiles.json")
          hardware = load("dist/modelspec/api/graph/views/hardware.json")
          policy = load("dist/modelspec/api/policy/catalogue.json")
          version = build["export_schema_version"]
          if not version or not str(version)[0].isdigit():
              raise SystemExit(f"build.json export_schema_version is unusable: {version!r}")
          for name, payload in (
              ("index.json", index),
              ("candidates.json", candidates),
              ("profiles.json", profiles),
              ("hardware.json", hardware),
              ("policy/catalogue.json", policy),
          ):
              got = (payload.get("build") or {}).get("export_schema_version")
              if got != version:
                  raise SystemExit(
                      f"{name} build.export_schema_version {got!r} != build.json {version!r}"
                  )
          # MODEL-80: this file is the free tier's whole source, so an uncited
          # policy answer in it is an uncited answer served to a customer.
          # Standing rule 1, enforced on the artifact rather than on the card.
          uncited = [
              row["model_id"] for row in policy["models"]
              if (row["primary_provider"]["data_residency_disclosure"] == "published"
                  and not (row["primary_provider"]["data_residency_source"] or {}).get("read_on"))
          ]
          if uncited:
              raise SystemExit(
                  f"{len(uncited)} policy rows publish a residency with no read date: "
                  f"{uncited[:5]}")
          print(f"export_schema_version={version}")
          print(f"policy rows: {policy['count']} models, "
                f"{sum(len(r['platforms']) for r in policy['models'])} platform rows")
          PY

      - name: Last good site remains if this build failed
        if: failure()
        run: |
          {
            echo '### Export failed; last good site remains serving'
            echo
            echo 'This job did not produce a deployable tree. The deploy job only'
            echo 'runs after a successful build on main, so the previous Cloudflare'
            echo 'Pages deployment of modelspec.dev and benchgraph.dev stays up.'
            echo 'The store is the static tree, not R2 or D1.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sites
          path: dist
          retention-days: 7
          # upload-artifact >= 4.4 drops dotfiles by default, which silently
          # removed dist/*/.well-known/ (api-catalog, mcp.json, agent-skills)
          # from every deploy (MODEL-94).
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: sites-holding
          path: dist-holding
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deploy credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Skip rather than fail when the repository has no Cloudflare
          # credentials yet, so main does not sit red for a missing secret
          # while the build itself is healthy.
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Deploy skipped'
              echo
              echo 'CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this'
              echo 'repository, so the built sites were not published. The build artifact'
              echo 'is attached to this run.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites
          path: dist

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites-holding
          path: dist-holding

      # Production first, so the domains show what SITE_MODE says even if a
      # preview deploy below fails. `production` is dist-holding unless
      # SITE_MODE is exactly `live` (the build job's summary names it).
      - name: Deploy modelspec.dev (${{ needs.build.outputs.mode }})
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ needs.build.outputs.production || 'dist-holding' }}/modelspec --project-name=modelspec --branch=main

      - name: Deploy benchgraph.dev (${{ needs.build.outputs.mode }})
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ needs.build.outputs.production || 'dist-holding' }}/benchgraph --project-name=benchgraph --branch=main

      # The real site, always, on the preview branch `internal`, for testing.
      - name: Deploy the real modelspec site to the internal preview
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/modelspec --project-name=modelspec --branch=internal

      - name: Deploy the real benchgraph site to the internal preview
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/benchgraph --project-name=benchgraph --branch=internal
