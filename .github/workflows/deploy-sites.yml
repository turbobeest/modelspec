name: Build and deploy the sites

# The published state of both domains should always be a commit, never whatever
# somebody last pushed from a laptop. Build on every merge to main; deploy only
# from main, and only after the build has succeeded.
#
# Holding mode (Jamie, 2026-09-24). The repository variable SITE_MODE is the one
# switch. The full v1 tree is built first because holding derives its API and
# legal files from it. The workflow then replaces `dist` with the decide-only
# live composition and copies that tree byte for byte to the Pages preview
# branch `internal` (https://internal.modelspec-7np.pages.dev). Production
# (`--branch=main`) gets that composition only when SITE_MODE is
# exactly `live`; unset, empty or anything else gets the modelspec holding tree
# (pipeline/holding.py): a holding page, with /api/**, /legal/** and openapi.yaml
# byte for byte as the real build has them. A missing variable fails closed.
# benchgraph.dev (MODEL-126) is the same `_redirects` file in both modes, on
# `main` and on `internal` (https://internal.benchgraph.pages.dev). It has no
# holding page. Its paths redirect to modelspec.dev, so the dark 404 and the
# live /api/** are the modelspec tree the redirect lands on.
# Relaunch, go dark again, test: docs/handoff/holding-mode.md.

on:
  push:
    branches: [main]
  # Required check "Build both sites" must report on every PR. Filtering
  # this workflow by path leaves the check pending and deadlocks merge
  # (docs-only PR #34). Deploy still runs only on main, below.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_MODE: ${{ vars.SITE_MODE }}

concurrency:
  group: deploy-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both sites
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.holding.outputs.mode }}
      production: ${{ steps.holding.outputs.production }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pydantic pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the decide app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build
        id: build
        env:
          MODELSPEC_SNAPSHOT_KEY: ${{ github.event_name != 'pull_request' && secrets.MODELSPEC_SNAPSHOT_KEY || '' }}
        run: |
          snapshot_args=()
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            snapshot_args+=(--decision-snapshot-if-ready)
          fi
          python -m pipeline.build --out dist "${snapshot_args[@]}" | tee summary.json
          {
            echo '### Site build'
            echo
            echo '```json'
            cat summary.json
            echo '```'
            echo
            echo "modelspec.dev: $(find dist/modelspec -type f | wc -l) files, $(du -sh dist/modelspec | cut -f1)"
            echo "benchgraph.dev: $(find dist/benchgraph -type f | wc -l) files, $(du -sh dist/benchgraph | cut -f1) (redirect only)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the holding trees, and pick what production gets
        id: holding
        run: |
          python -m pipeline.holding build --src dist --out dist-holding
          mode=$(python -m pipeline.holding mode)
          if [ "$mode" = "live" ]; then production=dist; else production=dist-holding; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"
          {
            echo "### Site mode: $mode"
            echo
            echo "Repository variable SITE_MODE: \`${SITE_MODE:-unset}\`."
            echo "Production modelspec.dev gets \`$production/modelspec\`."
            echo "benchgraph.dev gets \`$production/benchgraph\`, the redirect file"
            echo '(the same bytes as `dist/benchgraph`, in both modes).'
            echo 'The modelspec preview branch `internal` gets the same decide composition as live.'
            echo
            echo "holding modelspec: $(find dist-holding/modelspec -type f | wc -l) files, $(du -sh dist-holding/modelspec | cut -f1)"
            echo "holding benchgraph: $(find dist-holding/benchgraph -type f | wc -l) files, $(du -sh dist-holding/benchgraph | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the live and internal decide sites
        run: |
          # Holding must derive from the untouched full build above. Live is a
          # whitelist so a new v1 page cannot reappear merely by being generated.
          mv dist dist-v1
          mkdir -p dist/modelspec dist/benchgraph
          cp -a dist-v1/modelspec/api dist/modelspec/api
          cp -a dist-v1/modelspec/legal dist/modelspec/legal
          cp -a dist-v1/modelspec/.well-known dist/modelspec/.well-known
          cp -a dist-v1/modelspec/openapi.yaml dist/modelspec/openapi.yaml
          cp -a dist-v1/benchgraph/_redirects dist/benchgraph/_redirects
          cp web/dist/decide.html dist/modelspec/index.html
          cp web/dist/decide.html dist/modelspec/404.html
          cp -a web/dist/assets dist/modelspec/assets
          find dist/modelspec/assets -type f -name 'main-*' -delete
          if [ -f web/dist/favicon.svg ]; then cp web/dist/favicon.svg dist/modelspec/favicon.svg; fi
          python - <<'PY'
          from pathlib import Path

          root = Path("dist/modelspec")
          (root / "robots.txt").write_text(
              "User-agent: *\nAllow: /\n\nSitemap: https://modelspec.dev/sitemap.xml\n",
              encoding="utf-8",
          )
          (root / "sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              + "".join(
                  f"  <url><loc>https://modelspec.dev{path}</loc></url>\n"
                  for path in ("/", "/legal/terms/", "/legal/privacy/", "/legal/neutrality/")
              )
              + "</urlset>\n",
              encoding="utf-8",
          )
          (root / "_headers").write_text(
              "/*\n"
              "  X-Content-Type-Options: nosniff\n"
              "  Referrer-Policy: strict-origin-when-cross-origin\n"
              "  Permissions-Policy: camera=(), microphone=(), geolocation=()\n"
              "  Strict-Transport-Security: max-age=63072000; includeSubDomains; preload\n"
              "/api/*\n"
              "  Access-Control-Allow-Origin: *\n"
              "/assets/*\n"
              "  Cache-Control: public, max-age=31536000, immutable\n",
              encoding="utf-8",
          )
          PY
          cp -a dist dist-internal
          diff -r dist dist-internal
          rm -rf dist-v1

      - name: Guard the Cloudflare Pages limits
        run: |
          # Pages refuses a deployment over 20,000 files or with any file over 25 MiB.
          # Failing here is far cheaper than a rejected deploy.
          # benchgraph, in all three trees, is the one-file redirect.
          # The limit still applies. There is no minimum size.
          for site in dist/modelspec dist/benchgraph dist-holding/modelspec dist-holding/benchgraph dist-internal/modelspec; do
            count=$(find "$site" -type f | wc -l)
            if [ "$count" -ge 20000 ]; then
              echo "::error::$site has $count files, at or over the Pages limit of 20,000"
              exit 1
            fi
            big=$(find "$site" -type f -size +25M | head -1)
            if [ -n "$big" ]; then
              echo "::error::$site contains a file over 25 MiB: $big"
              exit 1
            fi
          done

      - name: Check the pages we promise actually exist
        run: |
          set -e
          test -s dist/modelspec/index.html
          test -s dist/modelspec/sitemap.xml
          test -s dist/modelspec/404.html
          test -s dist/modelspec/api/index.json
          test -s dist/modelspec/api/build.json
          test -s dist/modelspec/api/catalogue.json
          test -s dist/modelspec/api/rank/candidates.json
          test -s dist/modelspec/api/rank/profiles.json
          test -s dist/modelspec/api/policy/catalogue.json
          test -s dist/modelspec/api/graph/views/hardware.json
          test -s dist/modelspec/legal/terms/index.html
          test -s dist/modelspec/legal/privacy/index.html
          test -s dist/modelspec/legal/neutrality/index.html
          test ! -e dist/modelspec/downselect
          test ! -e dist/modelspec/graph
          test ! -e dist/modelspec/models
          test ! -e dist/modelspec/providers
          test ! -e dist/modelspec/benchmarks
          test ! -e dist/modelspec/m
          test ! -e dist/modelspec/p
          test ! -e dist/modelspec/b
          test ! -e dist/modelspec/pricing
          diff -r dist dist-internal
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/benchgraph")
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file())
          if files != ["_redirects"]:
              raise SystemExit(f"dist/benchgraph should be only _redirects, found {files}")
          expected = (
              "/   https://modelspec.dev/benchmarks/  301\n"
              "/*  https://modelspec.dev/:splat       301\n"
          )
          got = (root / "_redirects").read_text(encoding="utf-8")
          if got != expected:
              raise SystemExit(f"_redirects content: {got!r}")
          print("benchgraph.dev redirect tree ok")
          PY

      - name: Check the holding trees are dark and keep the data
        run: |
          set -e
          test -s dist-holding/modelspec/index.html
          test -s dist-holding/modelspec/404.html
          grep -q 'X-Robots-Tag: noindex' dist-holding/modelspec/_headers
          test ! -e dist-holding/modelspec/sitemap.xml
          test ! -e dist-holding/modelspec/_worker.js
          test ! -e dist-holding/modelspec/llms.txt
          test ! -e dist-holding/modelspec/b
          diff -r dist/modelspec/api dist-holding/modelspec/api
          test -s dist-holding/modelspec/api/catalogue.json
          test -n "$(find dist-holding/modelspec/api/benchmarks -name '*.json' -print -quit)"
          diff -r dist/modelspec/legal dist-holding/modelspec/legal
          cmp dist/modelspec/openapi.yaml dist-holding/modelspec/openapi.yaml
          # benchgraph is the redirect file in both trees. No holding page, no local /api.
          diff -r dist/benchgraph dist-holding/benchgraph
          test -s dist-holding/benchgraph/_redirects
          test "$(find dist-holding/benchgraph -type f | wc -l)" -eq 1

      - name: Check the export carries a pin-able schema version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(rel):
              return json.loads(Path(rel).read_text(encoding="utf-8"))

          index = load("dist/modelspec/api/index.json")
          build = load("dist/modelspec/api/build.json")
          candidates = load("dist/modelspec/api/rank/candidates.json")
          profiles = load("dist/modelspec/api/rank/profiles.json")
          hardware = load("dist/modelspec/api/graph/views/hardware.json")
          policy = load("dist/modelspec/api/policy/catalogue.json")
          version = build["export_schema_version"]
          if not version or not str(version)[0].isdigit():
              raise SystemExit(f"build.json export_schema_version is unusable: {version!r}")
          for name, payload in (
              ("index.json", index),
              ("candidates.json", candidates),
              ("profiles.json", profiles),
              ("hardware.json", hardware),
              ("policy/catalogue.json", policy),
          ):
              got = (payload.get("build") or {}).get("export_schema_version")
              if got != version:
                  raise SystemExit(
                      f"{name} build.export_schema_version {got!r} != build.json {version!r}"
                  )
          # MODEL-80: this file is the free tier's whole source, so an uncited
          # policy answer in it is an uncited answer served to a customer.
          # Standing rule 1, enforced on the artifact rather than on the card.
          uncited = [
              row["model_id"] for row in policy["models"]
              if (row["primary_provider"]["data_residency_disclosure"] == "published"
                  and not (row["primary_provider"]["data_residency_source"] or {}).get("read_on"))
          ]
          if uncited:
              raise SystemExit(
                  f"{len(uncited)} policy rows publish a residency with no read date: "
                  f"{uncited[:5]}")
          print(f"export_schema_version={version}")
          print(f"policy rows: {policy['count']} models, "
                f"{sum(len(r['platforms']) for r in policy['models'])} platform rows")
          PY

      - name: Last good site remains if this build failed
        if: failure()
        run: |
          {
            echo '### Export failed; last good site remains serving'
            echo
            echo 'This job did not produce a deployable tree. The deploy job only'
            echo 'runs after a successful build on main, so the previous Cloudflare'
            echo 'Pages deployment of modelspec.dev and benchgraph.dev stays up.'
            echo 'The store is the static tree, not R2 or D1.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sites
          path: dist
          retention-days: 7
          # upload-artifact >= 4.4 drops dotfiles by default, which silently
          # removed dist/*/.well-known/ (api-catalog, mcp.json, agent-skills)
          # from every deploy (MODEL-94).
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: sites-holding
          path: dist-holding
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: sites-internal
          path: dist-internal
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deploy credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Skip rather than fail when the repository has no Cloudflare
          # credentials yet, so main does not sit red for a missing secret
          # while the build itself is healthy.
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Deploy skipped'
              echo
              echo 'CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this'
              echo 'repository, so the built sites were not published. The build artifact'
              echo 'is attached to this run.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites
          path: dist

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites-holding
          path: dist-holding

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sites-internal
          path: dist-internal

      # Production first, so the domains show what SITE_MODE says even if a
      # preview deploy below fails. `production` is dist-holding unless
      # SITE_MODE is exactly `live` (the build job's summary names it).
      - name: Deploy modelspec.dev (${{ needs.build.outputs.mode }})
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ needs.build.outputs.production || 'dist-holding' }}/modelspec --project-name=modelspec --branch=main

      # Redirect file in both modes: dist-holding/benchgraph is a copy of dist/benchgraph.
      - name: Deploy benchgraph.dev (${{ needs.build.outputs.mode }})
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ needs.build.outputs.production || 'dist-holding' }}/benchgraph --project-name=benchgraph --branch=main

      # The same composition as live, always, on `internal` for testing.
      - name: Deploy the real modelspec site to the internal preview
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-internal/modelspec --project-name=modelspec --branch=internal

      # Same redirect file production deploys. Benchmark pages preview on modelspec.
      - name: Deploy the real benchgraph site to the internal preview
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/benchgraph --project-name=benchgraph --branch=internal
