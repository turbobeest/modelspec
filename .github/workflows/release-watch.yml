name: Watch primary sources for releases

# MODEL-216. Reads the labs' model pages, Hugging Face org feeds and
# OpenRouter's public model list, diffs them against
# registry/release-watch-baseline.json, and files each new model to
# POST /v1/signals/discovered. release-signals.yml then processes it exactly as
# it processes a Grok Bot signal. See docs/release-watch.md.
#
# Every 6 hours, so a model a lab lists reaches the queue within 6 hours, well
# inside the 24-hour promise. One Linux job of about a minute; plain HTTP only,
# no Firecrawl credit is ever spent here.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Diff watched sources and file discoveries
    # The same switch as release-signals.yml: nothing is filed while the queue
    # it feeds is not being drained.
    if: vars.SIGNALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      SIGNALS_ORIGIN: https://api.modelspec.dev
      MODELSPEC_SIGNALS_READ_KEY: ${{ secrets.MODELSPEC_SIGNALS_READ_KEY }}
    steps:
      - name: Refuse a missing read key
        run: |
          if [ -z "$MODELSPEC_SIGNALS_READ_KEY" ]; then
            echo "::error::MODELSPEC_SIGNALS_READ_KEY is required."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Only what the watcher imports (pydantic comes in through `decision`).
      # The full dev install is not needed here.
      - name: Install the watcher's dependencies
        run: python -m pip install httpx pyyaml pydantic

      - name: Diff every source and file what is new
        id: watch
        run: |
          set +e
          python scripts/release_watch.py --post \
            --report "$RUNNER_TEMP/watch.json" \
            --summary "$RUNNER_TEMP/watch.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/watch.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # A source outage is an alert, never a quiet skip: one open issue carries
      # every outage until someone closes it, and this run goes red too.
      - name: Raise the outage alert
        if: steps.watch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create release-watch --color B60205 \
            --description "Release watcher source outage (MODEL-216)" --force
          open="$(gh issue list --label release-watch --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/watch.md"
          else
            gh issue create --label release-watch \
              --title "release watch: a watched source is failing" \
              --body-file "$RUNNER_TEMP/watch.md"
          fi
          echo "::error::A watched source or the signal endpoint failed. See the summary."
          exit 1
