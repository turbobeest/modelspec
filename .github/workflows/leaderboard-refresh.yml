name: Weekly leaderboard refresh

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and report without changing cards or opening a pull request'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-leaderboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-read live boards
    runs-on: ubuntu-latest
    steps:
      - name: Fail if RESEARCH_PR_TOKEN is empty
        env:
          RESEARCH_PR_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN }}
        run: |
          if [ -z "${RESEARCH_PR_TOKEN}" ]; then
            echo "::error::RESEARCH_PR_TOKEN is empty; the refresh PR would not run required checks."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install refresh dependencies
        run: pip install pydantic pyyaml httpx pyarrow

      - name: Preserve the mechanically checked baseline
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          cp -R models verification "$RUNNER_TEMP/before/"

      - name: Re-read every covered board once
        env:
          MODELSPEC_SOURCE_CACHE: ${{ runner.temp }}/source-copies
        run: |
          args=(--observed-at "$(date -u +%F)" --audit-json "$RUNNER_TEMP/audit.json" --report-json "$RUNNER_TEMP/report.json")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/refresh_leaderboards.py "${args[@]}" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the generated diff is score-only
        id: guard
        if: inputs.dry_run != true
        run: |
          mkdir -p "$RUNNER_TEMP/after"
          cp -R models verification "$RUNNER_TEMP/after/"
          PYTHONPATH="$PWD" python - "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" <<'PY'
          import sys
          from pathlib import Path
          from scripts.refresh_leaderboards import check_score_only

          result = check_score_only(Path(sys.argv[1]), Path(sys.argv[2]))
          if not result.ok:
              print("::error::refresh produced a non-score diff")
              print("\n".join(result.errors))
              raise SystemExit(1)
          PY
          echo "score_only=true" >> "$GITHUB_OUTPUT"

      - name: Count changes and verification failures
        id: result
        run: |
          python - "$RUNNER_TEMP/report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          with open(sys.argv[2], "a") as out:
              print(f"changes={len(report['changes'])}", file=out)
              print(f"reconfirmed={len(report['reconfirmed'])}", file=out)
              print(f"updates={len(report['changes']) + len(report['reconfirmed'])}", file=out)
              print(f"failures={len(report['failures'])}", file=out)
              print(f"quarantined={len(report['quarantined'])}", file=out)
          PY

      - name: Prepare the pull-request body
        if: inputs.dry_run != true && steps.result.outputs.updates != '0'
        run: |
          {
            echo 'This weekly job re-read the registered live boards for existing models in the premier set.'
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo 'The diff guard proved that no card, evidence row, identity fact, or licence fact was added or removed.'
            echo
            echo 'Written by GPT-5 Codex.'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open the score-only pull request
        id: pr
        if: inputs.dry_run != true && steps.result.outputs.updates != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RESEARCH_PR_TOKEN }}
          branch: data/weekly-leaderboard-refresh
          delete-branch: true
          add-paths: |
            models/**
            verification/log.jsonl
            verification/queue/events.jsonl
          signoff: true
          commit-message: |
            data: refresh live-board observations (MODEL-124)

            Co-Authored-By: GPT-5 Codex <noreply@openai.com>
          title: 'data: refresh live-board observations (MODEL-124)'
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Put the PR URL in the audit records and body
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          python - "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/pr-body.md" <<'PY'
          import json, os, sys
          audit_path, body_path = sys.argv[1:]
          rows = json.load(open(audit_path))
          for row in rows:
              row["pr"] = os.environ["PR_URL"]
          with open(audit_path, "w") as out:
              json.dump(rows, out, indent=2)
              out.write("\n")
          body = open(body_path).read().replace("${PR_URL}", os.environ["PR_URL"])
          with open(body_path, "w") as out:
              out.write(body)
          PY
          gh pr edit "${{ steps.pr.outputs.pull-request-number }}" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Upload the audit artifact
        if: steps.pr.outputs.pull-request-number
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-refresh-audit-${{ steps.pr.outputs.pull-request-number }}
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error

      - name: Enable auto-merge for a verified score-only refresh
        if: >-
          steps.pr.outputs.pull-request-number &&
          steps.guard.outputs.score_only == 'true' &&
          steps.result.outputs.failures == '0' &&
          steps.result.outputs.quarantined == '0'
        env:
          GH_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"

      - name: Fail a no-update run that could not read every board
        if: steps.result.outputs.updates == '0' && steps.result.outputs.failures != '0'
        run: |
          echo "::error::No score changed, but one or more live boards failed; see the run summary."
          exit 1
