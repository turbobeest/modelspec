name: Validate Model Cards

on:
  pull_request:
    paths:
      - 'models/**'
      - 'schema/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate changed model cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff against main

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "fastapi==0.141.1" \
            "uvicorn==0.52.4" \
            -e "."

      - name: Run validation
        id: validate
        run: |
          # Keep this step green long enough to publish the diagnostic comment.
          # The validator's exit status and the report shape are both checked
          # below, so a crash, invalid card, or incomplete report cannot pass.
          set +e
          python scripts/validate_pr.py > validation_output.json 2>validation_stderr.txt
          validation_status=$?
          set -e

          echo "validator_status=${validation_status}" >> "$GITHUB_OUTPUT"
          echo "result<<VALIDATION_EOF" >> "$GITHUB_OUTPUT"
          cat validation_output.json >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "VALIDATION_EOF" >> "$GITHUB_OUTPUT"

          # Also set a simple pass/fail flag. Do not use permissive .get()
          # defaults: a valid JSON object such as {} is not a validation pass.
          if VALIDATOR_STATUS="$validation_status" python - <<'PY'
          import json
          import os
          import sys

          try:
              with open("validation_output.json", encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, json.JSONDecodeError):
              sys.exit(1)

          required = {
              "mode",
              "results",
              "total",
              "valid",
              "invalid",
              "new_cards",
              "regression_errors",
              "labels",
          }
          if not isinstance(report, dict) or report.get("mode") != "pr":
              sys.exit(1)
          if not required.issubset(report):
              sys.exit(1)
          if not isinstance(report["results"], list):
              sys.exit(1)
          if not isinstance(report["regression_errors"], list):
              sys.exit(1)
          if not isinstance(report["labels"], list):
              sys.exit(1)

          counts = {name: report[name] for name in ("total", "valid", "invalid", "new_cards")}
          if any(type(value) is not int or value < 0 for value in counts.values()):
              sys.exit(1)
          if counts["valid"] + counts["invalid"] != counts["total"]:
              sys.exit(1)
          if len(report["results"]) != counts["total"]:
              sys.exit(1)

          statuses = []
          for result in report["results"]:
              if not isinstance(result, dict) or result.get("status") not in {"valid", "invalid"}:
                  sys.exit(1)
              statuses.append(result["status"])
          if statuses.count("valid") != counts["valid"]:
              sys.exit(1)
          if statuses.count("invalid") != counts["invalid"]:
              sys.exit(1)
          if os.environ.get("VALIDATOR_STATUS") != "0":
              sys.exit(1)
          if counts["invalid"] != 0 or report["regression_errors"]:
              sys.exit(1)
          PY
          then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync('validation_output.json', 'utf8'));
            } catch (e) {
              data = null;
            }

            let body;
            if (!data) {
              body = '## ModelSpec Card Validation\n\n**Status**: Failed to parse validation output.\n\nCheck the workflow logs for details.';
            } else {
              const results = data.results || [];
              const regressionErrors = data.regression_errors || [];
              const total = data.total || 0;
              const invalid = data.invalid || 0;
              const newCards = data.new_cards || 0;
              const totalFieldsAdded = data.total_fields_added || 0;

              const allValid = invalid === 0 && regressionErrors.length === 0;
              const statusEmoji = allValid ? '\u2705' : '\u274c';
              const statusText = allValid ? 'All cards valid' : `${invalid} card(s) have errors`;

              body = `## ModelSpec Card Validation\n\n`;
              body += `**Status**: ${statusEmoji} ${statusText}\n`;
              body += `**Changed cards**: ${total}\n`;
              body += `**New cards**: ${newCards}\n\n`;

              if (total > 0) {
                body += `| Card | Completeness | Fields Added | Status |\n`;
                body += `|------|-------------|-------------|--------|\n`;

                for (const r of results) {
                  if (r.status === 'valid') {
                    const delta = r.completeness_delta != null ? ` (${r.completeness_delta >= 0 ? '+' : ''}${r.completeness_delta}%)` : ' (new)';
                    const fieldsAdded = (r.fields_added || []).slice(0, 5).map(f => {
                      const parts = f.split('.');
                      return parts[parts.length - 1];
                    }).join(', ');
                    const fieldsExtra = (r.fields_added || []).length > 5 ? ` +${(r.fields_added || []).length - 5} more` : '';
                    body += `| ${r.model_id} | ${r.completeness}%${delta} | ${fieldsAdded}${fieldsExtra} | \u2705 Valid |\n`;
                  } else {
                    const shortError = (r.error || 'Unknown error').substring(0, 80);
                    body += `| ${r.file} | - | - | \u274c ${shortError} |\n`;
                  }
                }
                body += `\n**Total field enrichments**: ${totalFieldsAdded} fields across ${total} cards\n`;
              }

              if (regressionErrors.length > 0) {
                body += `\n### Regression Errors\n\n`;
                body += `${regressionErrors.length} existing card(s) failed validation:\n\n`;
                for (const err of regressionErrors.slice(0, 10)) {
                  body += `- \`${err.file}\`: ${err.error.substring(0, 100)}\n`;
                }
                if (regressionErrors.length > 10) {
                  body += `\n... and ${regressionErrors.length - 10} more\n`;
                }
              }
            }

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## ModelSpec Card Validation')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync('validation_output.json', 'utf8'));
            } catch (e) {
              return;
            }

            const labels = data.labels || [];
            if (labels.length === 0) return;

            // Ensure labels exist (create if needed)
            const labelColors = {
              'new-models': '0E8A16',
              'benchmark-update': '1D76DB',
              'cost-update': 'D93F0B',
              'enrichment': 'FBCA04',
              'schema-valid': '0E8A16',
              'schema-invalid': 'B60205',
            };

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: labelColors[label] || 'EDEDED',
                  });
                }
              }
            }

            // Remove previous schema-valid/schema-invalid labels
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const existing of currentLabels) {
              if ((existing.name === 'schema-valid' || existing.name === 'schema-invalid') && !labels.includes(existing.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: existing.name,
                });
              }
            }

            // Apply new labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels,
            });

      - name: Fail if validation errors
        if: steps.validate.outputs.passed == 'false'
        run: |
          echo "::error::Model card validation failed. See PR comment for details."
          if [ -s validation_stderr.txt ]; then
            cat validation_stderr.txt
          fi
          exit 1
