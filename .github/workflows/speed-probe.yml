name: Speed probe

# MODEL-212, ADR 0004 step 2. Manual only: nothing here runs on a schedule.
# Jamie approved the pilot alone, with a $15 cap. The baseline and any
# refresh need a separate go and a change to this file, which a person merges.
#
# preflight  free: checks every key is set, every pinned model ID is listed,
#            and prints the runner's vantage. No paid request.
# pilot      one live slot of scripts/speed/pilot.yaml under SPEED_CAP_USD.
#            It cannot publish (one slot fails the gates). Its run file,
#            measurement and verification records go to a data PR, never to
#            main, for review under the two-key rules.
#
# The cap is not an input: raising it needs a reviewed edit to this file.
# Method and cost: docs/method/speed-measurement.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight (free) or pilot (paid, capped at SPEED_CAP_USD)'
        type: choice
        options: [preflight, pilot]
        default: preflight

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: speed-probe
  cancel-in-progress: false

env:
  SPEED_CAP_USD: '15'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  probe:
    name: Speed probe (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # A pilot slot is 160 sequential streams, estimated at 10 to 20 minutes.
    timeout-minutes: 45
    steps:
      - name: Fail if RESEARCH_PR_TOKEN is empty
        if: inputs.mode == 'pilot'
        env:
          RESEARCH_PR_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN }}
        run: |
          if [ -z "${RESEARCH_PR_TOKEN}" ]; then
            echo "::error::RESEARCH_PR_TOKEN is empty; the data PR would not run required checks."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install the harness dependencies
        run: pip install pydantic pyyaml

      - name: Preflight (free)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python -m scripts.speed preflight | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The pilot's worst case against the cap (free)
        if: inputs.mode == 'pilot'
        run: python -m scripts.speed plan | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the pilot slot (paid, capped)
        if: inputs.mode == 'pilot'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python -m scripts.speed run --live --cap-usd "$SPEED_CAP_USD" --window measurements/speed/pilot

      - name: Aggregate, verify and report (free)
        if: inputs.mode == 'pilot'
        run: |
          python -m scripts.speed aggregate measurements/speed/pilot
          python -m scripts.speed verify measurements/speed/pilot
          python -m scripts.speed report measurements/speed/pilot | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/report.md"
          {
            echo 'The speed-v1 pilot (MODEL-212): one live slot under a $'"$SPEED_CAP_USD"' cap.'
            echo 'One slot cannot pass the publication gates, so no speed fact enters the snapshot.'
            echo
            cat "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open the data pull request
        if: inputs.mode == 'pilot'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RESEARCH_PR_TOKEN }}
          branch: data/speed-pilot-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            measurements/speed/**
          signoff: true
          commit-message: 'data: speed-v1 pilot run (MODEL-212)'
          title: 'data: speed-v1 pilot run (MODEL-212)'
          body-path: ${{ runner.temp }}/pr-body.md
