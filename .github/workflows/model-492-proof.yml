name: MODEL-492 proof loop
on:
  pull_request: {}
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install "pydantic==2.13.5" "PyYAML==6.0.3" "FalkorDB==1.7.1" "httpx==0.28.1" "rich==15.0.0" "typer==0.27.2" "click==8.5.0" pytest -e ".[dev,verify]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - name: Loop
        run: |
          pass=0
          for i in $(seq 1 50); do
            if python -m pytest -p no:cacheprovider -q -s tests/test_social_cards.py::test_chromium_layout_keeps_every_card_block_separate_and_in_frame > loop.log 2>&1; then
              pass=$((pass+1)); grep -h "screenshot attempt" loop.log || true
            else
              echo "FAILURE on iteration $i"; cat loop.log; echo "LOOP COUNT: $pass passed before the failure"; exit 1
            fi
          done
          echo "LOOP COUNT: $pass of 50 passed"
