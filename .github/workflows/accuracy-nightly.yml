name: Decision accuracy nightly

# A failing night opens one issue labelled `alert`, which the orchestrator's
# heartbeat reads, and the next green night closes it (MODEL-335). The coverage
# report's `workflow-health` target (MODEL-215) also watches this workflow.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      stage_failure:
        description: 'Add a synthetic failing gate, to prove the alert path'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: decision-accuracy-nightly
  cancel-in-progress: false

jobs:
  accuracy:
    name: Source fidelity and reference agreement
    runs-on: ubuntu-latest
    # Runs take 5-8 minutes; the default limit is six hours.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      STAGE_FAILURE: ${{ inputs.stage_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run network accuracy layers
        # Layers 2 and 4 gate. Frozen-image engine recall is included as a report-only layer.
        run: |
          stage=()
          if [ "$STAGE_FAILURE" = "true" ]; then stage=(--stage-failure); fi
          python scripts/accuracy.py --profile nightly --output-dir accuracy-report "${stage[@]}"

      - name: Summarise the layers on the run page
        if: always()
        # The coverage report links failing runs here: the layer table, not the details.
        run: |
          if [ -f accuracy-report/accuracy.md ]; then
            sed '/^## /,$d' accuracy-report/accuracy.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-accuracy-nightly
          path: accuracy-report/

      - name: Alert the orchestrator
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/accuracy_alert.py --report accuracy-report/accuracy.json \
            --run-url "$RUN_URL" --output alert.md
          gh label create alert --color B60205 \
            --description "Read by the orchestrator heartbeat" --force
          number=$(gh issue list --label alert --state open \
            --search 'in:title "Accuracy nightly failed"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file alert.md
          else
            gh issue create --title "Accuracy nightly failed" --label alert --body-file alert.md
          fi

      - name: Close the alert after a green night
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label alert --state open \
            --search 'in:title "Accuracy nightly failed"' --json number --jq '.[].number' |
          while read -r number; do
            gh issue close "$number" --comment "Green again: $RUN_URL"
          done
