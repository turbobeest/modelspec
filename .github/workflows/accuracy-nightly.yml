name: Decision accuracy nightly

# A failing night opens one issue labelled `alert`, which the orchestrator's
# heartbeat reads, and the next green night closes it (MODEL-335). The coverage
# report's `workflow-health` target (MODEL-215) also watches this workflow.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      stage_failure:
        description: 'Add a synthetic failing gate, to prove the alert path'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: decision-accuracy-nightly
  cancel-in-progress: false

jobs:
  accuracy:
    name: Freshness, source fidelity and reference agreement
    runs-on: ubuntu-latest
    # Runs take 5-8 minutes; the default limit is six hours.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      STAGE_FAILURE: ${{ inputs.stage_failure }}
      DATA_SPLIT_ENABLED: ${{ vars.DATA_SPLIT_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Require the private checkout credential
        if: vars.DATA_SPLIT_ENABLED == 'true'
        env:
          DATA_TOKEN: ${{ secrets.MODELSPEC_DATA_TOKEN }}
        run: test -n "$DATA_TOKEN"

      # Fail before the gates if the private alert sink has no credential
      # (MODEL-483 E). The token appears in this step and in the sink step only.
      - name: Require the private alert sink credential
        env:
          ALERT_TOKEN: ${{ secrets.ACCURACY_ALERT_TOKEN }}
        run: test -n "$ALERT_TOKEN" || { echo "private alert sink unavailable"; exit 1; }

      # actions/checkout logs `git log -1 --format=%H` (not silent). Fetch the
      # branch and discard the output so the private commit is not in the log.
      - name: Read private verification records
        if: vars.DATA_SPLIT_ENABLED == 'true'
        env:
          DATA_TOKEN: ${{ secrets.MODELSPEC_DATA_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          dest=.accuracy-private
          rm -rf "$dest"
          mkdir -p "$dest"
          git -C "$dest" init -q >/dev/null 2>&1
          git -C "$dest" remote add origin "https://github.com/turbobeest/modelspec-data.git" >/dev/null 2>&1
          header=$(printf 'x-access-token:%s' "$DATA_TOKEN" | base64 | tr -d '\n')
          git -C "$dest" -c "http.extraheader=AUTHORIZATION: basic ${header}" fetch --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1
          git -C "$dest" checkout --detach --quiet origin/main >/dev/null 2>&1

      - name: Run network accuracy layers
        # Layers 2, 3 and 4 gate. Freshness uses the private checkout when data is split.
        # Frozen-image engine recall is included as a report-only layer.
        run: |
          stage=()
          if [ "$STAGE_FAILURE" = "true" ]; then stage=(--stage-failure); fi
          corrections=()
          if [ "$DATA_SPLIT_ENABLED" = "true" ]; then
            corrections=(--private-data-root .accuracy-private --private-data)
          fi
          python scripts/accuracy.py --profile nightly --output-dir accuracy-report "${stage[@]}" "${corrections[@]}"

      - name: Alert the orchestrator
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/accuracy_alert.py --report accuracy-report/accuracy.json \
            --run-url "$RUN_URL" --output alert.md
          gh label create alert --color B60205 \
            --description "Read by the orchestrator heartbeat" --force
          number=$(gh issue list --label alert --state open \
            --search 'in:title "Accuracy nightly failed"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file alert.md
          else
            gh issue create --title "Accuracy nightly failed" --label alert --body-file alert.md
          fi

      - name: Close the alert after a green night
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          gh issue list --label alert --state open \
            --search 'in:title "Accuracy nightly failed"' --json number --jq '.[].number' |
          while read -r number; do
            gh issue close "$number" --comment "Green again: $RUN_URL"
          done

      # The detail of a red night goes to one open private issue labelled
      # accuracy-nightly, and a green night closes it. Nothing here prints the
      # detail, uploads it, or sets an output (MODEL-483 E).
      - name: Send the detail to the private alert issue
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_ALERT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fail() { echo "private alert sink unavailable"; exit 1; }
          test -n "$GH_TOKEN" || fail
          case "$JOB_STATUS" in
            failure)
              python scripts/accuracy_alert.py --report accuracy-report/accuracy.json \
                --run-url "$RUN_URL" --detail-output "$RUNNER_TEMP/red-night.md" >/dev/null 2>&1 || fail
              gh label create accuracy-nightly --color B60205 -R turbobeest/modelspec-data \
                --force >/dev/null 2>&1 || fail
              number=$(gh issue list -R turbobeest/modelspec-data --label accuracy-nightly \
                --state open --json number -q '.[0].number // empty' 2>/dev/null) || fail
              if [ -n "$number" ]; then
                gh issue comment "$number" -R turbobeest/modelspec-data \
                  --body-file "$RUNNER_TEMP/red-night.md" >/dev/null 2>&1 || fail
              else
                gh issue create -R turbobeest/modelspec-data --title "Accuracy nightly failed" \
                  --label accuracy-nightly --body-file "$RUNNER_TEMP/red-night.md" >/dev/null 2>&1 || fail
              fi
              ;;
            success)
              numbers=$(gh issue list -R turbobeest/modelspec-data --label accuracy-nightly \
                --state open --json number -q '.[].number' 2>/dev/null) || fail
              for number in $numbers; do
                gh issue close "$number" -R turbobeest/modelspec-data \
                  --comment "Green again: $RUN_URL" >/dev/null 2>&1 || fail
              done
              ;;
          esac
