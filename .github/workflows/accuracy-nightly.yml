name: Decision accuracy nightly

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: decision-accuracy-nightly
  cancel-in-progress: false

jobs:
  accuracy:
    name: Source fidelity and reference agreement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run network accuracy layers
        # Layers 2 and 4. Source readers enforce family independence themselves.
        run: python scripts/accuracy.py --profile nightly --output-dir accuracy-report

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-accuracy-nightly
          path: accuracy-report/

      - name: Open an issue for a failed nightly report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Decision accuracy nightly failed';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Download the decision-accuracy-nightly artifact for the Markdown and JSON reports.'
            ].join('\n');
            // One open issue collects every failing night; don't file a new one each run.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
