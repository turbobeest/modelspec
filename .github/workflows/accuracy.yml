name: Decision accuracy

on:
  pull_request:
    paths:
      - 'decision/**'
      - 'registry/**'
      - 'models/**'
      - 'offerings/**'
      - 'verification/**'
      - 'tests/recall/**'
      - 'scripts/accuracy.py'
      - 'accuracy.yaml'
      - '.github/workflows/accuracy.yml'

permissions:
  contents: read

concurrency:
  group: accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accuracy:
    name: Decision accuracy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run PR accuracy layers
        # Layers 1, 3, 5 (report-only), and 6. The harness publishes both formats.
        run: python scripts/accuracy.py --profile pr --output-dir accuracy-report

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-accuracy
          path: accuracy-report/
