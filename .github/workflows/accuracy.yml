name: Decision accuracy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'decision/**'
      - 'registry/**'
      - 'models/**'
      - 'offerings/**'
      - 'verification/**'
      - 'tests/recall/**'
      - 'scripts/accuracy.py'
      - 'scripts/recall_run.py'
      - 'accuracy.yaml'
      - '.github/workflows/accuracy.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accuracy:
    name: Decision accuracy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Guard approved recall inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          PR_LABELS="$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '[.labels[].name]')"
          python scripts/accuracy.py \
            --check-recall-approval \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --labels-json "$PR_LABELS"

      - name: Load merge-base frozen-image engine baseline
        run: |
          MERGE_BASE="$(git merge-base \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.base.sha }}")"
          if git cat-file -e "$MERGE_BASE:tests/recall/baseline.json"; then
            git show "$MERGE_BASE:tests/recall/baseline.json" \
              > "$RUNNER_TEMP/approved-recall-baseline.json"
          else
            # MODEL-160 introduces the first baseline, so derive it from the merge-base checkout.
            BASE_CHECKOUT="$RUNNER_TEMP/recall-merge-base"
            BASE_REPORT="$RUNNER_TEMP/recall-merge-base-report"
            git worktree add --detach "$BASE_CHECKOUT" "$MERGE_BASE"
            PYTHONPATH="$BASE_CHECKOUT" python "$BASE_CHECKOUT/scripts/recall_run.py" \
              --root "$BASE_CHECKOUT" \
              --output-dir "$BASE_REPORT" \
              --date 2026-09-25
            python - "$BASE_REPORT" "$RUNNER_TEMP/approved-recall-baseline.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_dir, output_path = map(Path, sys.argv[1:])
          report_path = next(report_dir.glob("*.json"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          baseline = {
              "schema_version": 1,
              "as_of": report["report_date"],
              "snapshot": report["snapshot"],
              "generated_by": "merge-base recall run",
              "verdicts": {
                  question["id"]: question["verdict"] for question in report["questions"]
              },
          }
          output_path.write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          fi

      - name: Run PR accuracy and frozen-image engine recall
        # Layers 1, 5 (frozen-image engine recall), and 6. Freshness gates private data nightly.
        run: |
          python scripts/accuracy.py --profile pr \
            --approved-recall-baseline "$RUNNER_TEMP/approved-recall-baseline.json" \
            --output-dir accuracy-report

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decision-accuracy
          path: accuracy-report/
