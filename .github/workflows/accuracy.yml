name: Decision accuracy

on:
  pull_request:
    paths:
      - 'decision/**'
      - 'registry/**'
      - 'models/**'
      - 'offerings/**'
      - 'verification/**'
      - 'tests/recall/**'
      - 'scripts/accuracy.py'
      - 'accuracy.yaml'
      - '.github/workflows/accuracy.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accuracy:
    name: Decision accuracy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Guard approved recall inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          python scripts/accuracy.py \
            --check-recall-approval \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --labels-json "$PR_LABELS"

      - name: Run PR accuracy layers
        # Layers 1, 3, 5 (recall limit), and 6. The harness publishes both formats.
        run: python scripts/accuracy.py --profile pr --output-dir accuracy-report

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-accuracy
          path: accuracy-report/
