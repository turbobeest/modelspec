name: Publish the public data image

# MODEL-246. Makes the public data paths equal the private data as it was
# nine months ago, and opens a data-lag/* pull request when that changes. Until
# the private history reaches back past the cutoff the script changes nothing.
#
# Off until vars.DATA_SPLIT_ENABLED is 'true'. Needs MODELSPEC_DATA_TOKEN, a
# read-only token scoped to turbobeest/modelspec-data. No pull_request trigger:
# secrets never reach PR or fork runs. A human merges the result.
on:
  schedule:
    - cron: '5 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-lag
  cancel-in-progress: false

jobs:
  lag:
    name: Publish the lagged data image
    if: vars.DATA_SPLIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
    steps:
      - name: Fail if a token is empty
        env:
          MODELSPEC_DATA_TOKEN: ${{ secrets.MODELSPEC_DATA_TOKEN }}
          RESEARCH_PR_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN }}
        run: |
          if [ -z "$MODELSPEC_DATA_TOKEN" ] || [ -z "$RESEARCH_PR_TOKEN" ]; then
            echo "::error::MODELSPEC_DATA_TOKEN and RESEARCH_PR_TOKEN are both required."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out the private data with its history
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec-data
          token: ${{ secrets.MODELSPEC_DATA_TOKEN }}
          path: modelspec-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish the image as of today minus nine months
        id: lag
        run: |
          python scripts/data_lag.py --private modelspec-data > "$RUNNER_TEMP/lag-status.json"
          python -c 'import json,os; print("status=" + json.load(open(os.environ["RUNNER_TEMP"] + "/lag-status.json"))["status"])' >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.lag.outputs.status == 'published'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RESEARCH_PR_TOKEN }}
          branch: data-lag/image
          add-paths: |
            data-image.json
            models
            benchmarks
            hardware
            hosts
            offerings
            verification
            measurements
            premier
            research
            registry/sources.yaml
            registry/providers.yaml
            registry/harnesses.yaml
            registry/labs.yaml
            registry/release-watch-baseline.json
          signoff: true
          commit-message: 'data: publish the lagged data image (MODEL-246)'
          title: '(MODEL-246) data: publish the lagged data image'
          body: |
            The public data image, as of the private data nine months ago.
            See `data-image.json` for the source commit. The data freeze check
            accepts this branch because it is `data-lag/*` and carries nothing
            newer than the cutoff.
