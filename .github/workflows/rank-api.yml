name: Rank API

# MODEL-68. Builds the rank Worker's Python bundle, proves it bundles, and runs
# the byte-identity suite that holds `POST /v1/rank` to what
# `modelspec offline rank --json` answers. On push to main only, the `deploy`
# job publishes the Worker to api.modelspec.dev and refuses to pass until the
# version it just pushed is the version answering. PR runs never reach that job
# or its secrets.
# This is not a required check; `Run pytest` and `Build both sites` are.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rank-api-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned. 4.94.0 (the version graph-service uses) ships a workerd that refuses
  # this Worker's compatibility_date, and a Python Worker is far more sensitive
  # to the runtime it is bundled against than a JavaScript one.
  WRANGLER: wrangler@4.134.0
  RANK_HOST: api.modelspec.dev

jobs:
  bundle:
    name: Rank Worker bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "pytest==9.1.1" \
            -e .

      - name: Vendor the scorer into the Worker bundle
        # --check imports the bundle in isolation. A new third-party import in
        # pipeline/ranking.py or api/ranking/engine.py would break the Worker at
        # deploy time; this turns that into a failure on the pull request.
        run: python api/worker/vendor.py --check

      - name: Byte-identity against `modelspec offline rank --json`
        run: python -m pytest -q tests/test_rank_worker.py

      - name: Build the Worker bundle
        working-directory: api/worker
        # --dry-run needs no credential, so the bundle is proven to build on
        # every pull request rather than first on main with a token in scope.
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir ../../dist/rank-worker

      - name: Summarise
        run: |
          {
            echo '### Rank Worker bundle'
            echo
            echo "Bundled files:"
            echo '```'
            find dist/rank-worker -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the rank Worker
    needs: bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: rank-api-deploy
      cancel-in-progress: false
    env:
      # Scoped to Workers Scripts:Edit, Workers KV Storage:Edit and Workers
      # Routes:Edit on the modelspec.dev zone. No DNS, no R2, no Containers.
      # CLOUDFLARE_API_TOKEN (Pages) and CLOUDFLARE_GRAPH_API_TOKEN (benchgraph)
      # are different credentials and are not used here.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_MODELSPEC_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vendor the scorer into the Worker bundle
        run: python api/worker/vendor.py

      - name: Deploy
        working-directory: api/worker
        # BUILD_COMMIT is what makes the smoke test meaningful: the script
        # answers with this value as `service_commit`, so an old deployment
        # cannot pass for the one this run pushed. CLI vars are merged over the
        # config vars, so EXPORT_ORIGIN is unaffected.
        run: npx --yes "$WRANGLER" deploy --var "BUILD_COMMIT:${GITHUB_SHA}"

      - name: Smoke-test api.modelspec.dev
        run: |
          set -uo pipefail
          base="https://${RANK_HOST}/v1"
          fail() {
            echo "::error::$1"
            if [ -s body.json ]; then cat body.json; echo; fi
            exit 1
          }

          # Reads one top-level field from the last response. Nothing is masked:
          # an empty file reads as {}, and a body that fails to parse prints its
          # traceback and leaves the field empty, which the loop already treats
          # as "not the version we deployed".
          field() {
            python3 -c 'import json,sys; raw=open("body.json").read().strip(); print((json.loads(raw) if raw else {}).get(sys.argv[1], ""))' "$1"
          }

          # 1. The version that was deployed must be the version answering.
          #    MODEL-9 shipped three changes that were never exercised because a
          #    smoke test could not tell those two apart.
          deadline=$((SECONDS + 300)); status=""; commit=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            : > body.json
            status=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 "${base}/health" || echo 000)
            commit=$(field service_commit)
            if [ "$status" = 200 ] && [ "$commit" = "${GITHUB_SHA}" ]; then break; fi
            echo "health HTTP ${status} service_commit=${commit:-none}; want ${GITHUB_SHA}; retrying"
            sleep 10
          done
          if [ "$status" = 000 ]; then
            fail "${RANK_HOST} is unreachable after 5 min. A 522 means the Workers route is not bound to the proxied DNS record for ${RANK_HOST} (AAAA -> 100::, proxied). See docs/rank-api.md."
          fi
          if [ "$commit" != "${GITHUB_SHA}" ]; then
            fail "the rank Worker never rolled onto ${GITHUB_SHA}: /v1/health reports service_commit=${commit:-none} after 5 min (last HTTP ${status}). An older script is still answering, so nothing in this deploy was exercised."
          fi
          loaded=$(field export_loaded)
          if [ "$loaded" != "True" ]; then
            fail "the deployed Worker cannot read the published export (export_loaded=${loaded:-none}). Read last_error in the body below."
          fi
          echo "fresh deployment on ${GITHUB_SHA}, export loaded"

          # 2. A ranking, carrying everything the contract promises per row.
          : > body.json
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 -X POST "${base}/rank" \
            -H 'content-type: application/json' \
            -d '{"use_case":"coding","environment":{"hosting":"managed_api"},"limit":3}')
          if [ "$status" != 200 ]; then fail "POST /v1/rank returned HTTP ${status}, not 200"; fi
          python3 .github/scripts/check_rank_response.py ranked body.json || exit 1

          # 3. A no-match names the constraint instead of returning an empty list.
          : > body.json
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 -X POST "${base}/rank" \
            -H 'content-type: application/json' \
            -d '{"use_case":"coding","environment":{"hosting":"local"},"constraints":{"max_cost_per_million_input_tokens":0.0}}')
          if [ "$status" != 422 ]; then fail "a no-match request returned HTTP ${status}, not the documented 422"; fi
          python3 .github/scripts/check_rank_response.py no-match body.json || exit 1

          # 4. A malformed request is refused, not ranked on a guess.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -X POST "${base}/rank" \
            -H 'content-type: application/json' -d '{"use_case":"not_a_use_case"}')
          if [ "$status" != 400 ]; then fail "an unknown use case returned HTTP ${status}, not 400"; fi

          echo "api.modelspec.dev is live on ${GITHUB_SHA}"
