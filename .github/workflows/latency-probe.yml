name: API latency probe

on:
  workflow_dispatch:
    inputs:
      count:
        description: Calls per generic request shape
        default: '30'
        required: true
      encoding:
        description: Response encoding to negotiate
        type: choice
        options: ['br, gzip', gzip, identity]
        default: 'br, gzip'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'brotli==1.2.0'
      - name: Measure generic API requests
        env:
          MODELSPEC_API_KEY: ${{ secrets.MODELSPEC_SMOKE_API_KEY }}
          PROBE_COUNT: ${{ inputs.count }}
          PROBE_ENCODING: ${{ inputs.encoding }}
        run: |
          # The optional smoke key enables measurements; without it the probe skips.
          if [ "$PROBE_COUNT" -gt 100 ]; then echo "count must be at most 100" >&2; exit 2; fi
          python qa/latency_probe.py --count "$PROBE_COUNT" \
            --encoding "$PROBE_ENCODING" --output "$RUNNER_TEMP/latency.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-latency-${{ github.run_id }}
          path: ${{ runner.temp }}/latency.json
          retention-days: 14
