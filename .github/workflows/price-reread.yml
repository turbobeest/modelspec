name: Weekly price and plan re-read

# MODEL-217. Re-fetches every sourced price and subscription-plan page over plain
# HTTP and re-reads it with the verifier's deterministic readers
# (scripts/price_reread.py). A changed value opens a pull request on
# data/weekly-price-reread, which automerge.yml skips: a person reviews every
# price change. A page the readers no longer understand, or cannot fetch, opens
# or updates one issue and fails the run. The job never guesses a value.
#
# Cost (measured 2026-09-29): 33 plain fetches and about a minute of re-reading
# from a cold cache, plus about 20 s of setup, on one Linux job: 2 runner minutes
# a week, free on this public repository. No model and no paid scraper.

on:
  schedule:
    # Tuesdays, away from Monday's leaderboard refresh.
    - cron: '41 7 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Re-read and report without opening a pull request or an issue'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Last week's retained copies are an artifact of the previous run.
  actions: read

concurrency:
  group: weekly-price-reread
  cancel-in-progress: false

jobs:
  reread:
    name: Re-read price and plan pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # scripts/price_reread.py imports decision/ from the checkout.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Keep retained copies outside the checkout
        run: echo "MODELSPEC_SOURCE_CACHE=$RUNNER_TEMP/source-copies" >> "$GITHUB_ENV"

      - name: Fail if RESEARCH_PR_TOKEN is empty
        env:
          RESEARCH_PR_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN }}
        run: |
          if [ -z "${RESEARCH_PR_TOKEN}" ]; then
            echo "::error::RESEARCH_PR_TOKEN is empty; the re-read PR would not run required checks."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install re-read dependencies
        run: pip install pydantic pyyaml httpx

      - name: Restore last week's retained copies
        # Only the source diff in the report needs them; the re-read itself
        # compares the recorded value with the new page.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$MODELSPEC_SOURCE_CACHE"
          run_id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=price-reread-copies&per_page=1" \
            --jq '.artifacts[0] | select(.expired | not) | .workflow_run.id // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "${{ github.repository }}" \
              --name price-reread-copies --dir "$MODELSPEC_SOURCE_CACHE" \
              || echo "::notice::could not restore the copies from run $run_id"
          fi

      - name: Re-read every page once
        run: |
          args=(--report-json "$RUNNER_TEMP/report.json" --report-md "$RUNNER_TEMP/report.md" --retain-only-cited)
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            args+=(--write)
          fi
          python scripts/price_reread.py "${args[@]}" > /dev/null
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Count changes and alerts
        id: result
        run: |
          python - "$RUNNER_TEMP/report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          with open(sys.argv[2], "a") as out:
              print(f"changes={len(report['changes'])}", file=out)
              print(f"alerts={len(report['alerts'])}", file=out)
          PY

      - name: Keep this week's copies for next week's diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-reread-copies
          path: ${{ runner.temp }}/source-copies
          retention-days: 35
          if-no-files-found: ignore

      - name: Prepare the pull-request body
        if: inputs.dry_run != true && steps.result.outputs.changes != '0'
        run: |
          {
            echo 'The weekly re-read found values that no longer match their pages. Each new value below was read by the verifier'"'"'s deterministic readers from a fresh copy of the page, and the verifier confirmed it. Both of those keys are code in this repository, so check the source diff before merging. This pull request is never auto-merged.'
            echo
            # A pull-request body holds at most 65,536 characters.
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open the re-read pull request
        if: inputs.dry_run != true && steps.result.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RESEARCH_PR_TOKEN }}
          branch: data/weekly-price-reread
          delete-branch: true
          add-paths: |
            offerings/**
            verification/log.jsonl
            verification/queue/events.jsonl
          signoff: true
          commit-message: 'data: re-read prices and plans (MODEL-217)'
          title: 'data: re-read prices and plans (MODEL-217)'
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Open or update the alert issue
        if: inputs.dry_run != true && steps.result.outputs.alerts != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Price and plan re-read needs a person
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/issue-body.md"
          # One open issue collects every week's alerts.
          number="$(gh issue list --repo "${{ github.repository }}" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
          fi

      - name: Fail a run with alerts
        if: steps.result.outputs.alerts != '0'
        run: |
          echo "::error::${{ steps.result.outputs.alerts }} price or plan facts could not be re-read; see the run summary."
          exit 1
