name: Test suite

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-shards:
    name: pytest shard ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: 0, label: 1/4}
          - {index: 1, label: 2/4}
          - {index: 2, label: 3/4}
          - {index: 3, label: 4/4}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml
      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev]"
      - name: Select test files and collect node ids
        run: |
          python scripts/pytest_shards.py --shard-count 4 \
            --shard-index ${{ matrix.index }} > shard-files.txt
          python -m pytest --collect-only -q -m "not perf" \
            $(< shard-files.txt) > shard-${{ matrix.index }}-collection.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser and build the app on the Chromium pytest shard
        # test_landing.py serves the built decide app at /decide/, and
        # test_social_cards.py renders cards in Chromium. They share a shard's
        # install; every other shard builds the site without rendering cards.
        run: |
          if grep -qxE 'tests/test_(landing|social_cards)\.py' shard-files.txt; then
            cd web
            npm ci
            npm run build
            npx playwright install --with-deps chromium
          fi
      - name: Run test shard
        # -n auto uses the four cores on ubuntu-latest. --dist loadfile also
        # keeps each module together for shared module and process state.
        run: >-
          python -m pytest -q -n auto --dist loadfile -m "not perf"
          --junitxml=shard-${{ matrix.index }}-junit.xml $(< shard-files.txt)
      - name: Upload collected node ids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.index }}-collection
          path: shard-${{ matrix.index }}-collection.txt
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.index }}-junit
          path: shard-${{ matrix.index }}-junit.xml

  pytest-perf-and-collection:
    name: pytest perf and collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml
      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev]"
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
          -shellcheck= -color

      - name: Run timing tests serially
        # Wall-clock bounds run alone. Parallel load made a 6 ms load take 211 ms.
        run: python -m pytest -q -p no:xdist -m perf
      - name: Collect the full non-performance suite
        run: python -m pytest --collect-only -q -m "not perf" > full-collection.txt
      - name: Upload full collection
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-collection
          path: full-collection.txt

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Inspect the wheel contents
        run: >-
          python -c "import glob, zipfile;
          names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          roots={name.split('/', 1)[0] for name in names};
          assert {'api', 'cli', 'decision', 'pipeline', 'registry', 'schema'} <= roots;
          assert not ({'docs', 'models', 'tests', 'web'} & roots)"
      - name: Install and run the wheel outside the checkout
        run: |
          repo_root="$PWD"
          wheel="$(realpath dist/*.whl)"
          venv="$RUNNER_TEMP/modelspec-package-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install "$wheel"
          export PATH="$venv/bin:$PATH"
          cd "$(mktemp -d)"
          export MODELSPEC_CACHE="$PWD/cache"
          modelspec --help
          modelspec decide --help
          modelspec verify --help >/dev/null
          if modelspec verify accuracy --profile pr --config /nonexistent \
            > verify-accuracy.txt 2>&1; then
            echo "::error::the repository-only accuracy command ran from the wheel"
            exit 1
          fi
          grep -Fq "No such command 'accuracy'" verify-accuracy.txt
          modelspec snapshot fetch
          "$venv/bin/python" "$repo_root/scripts/package_smoke_fixture.py" \
            --cache "$MODELSPEC_CACHE" --key-id test-package-smoke
          modelspec vocab >/dev/null
          modelspec decide --template budget-coding >/dev/null
          python -c "from decision.registry import default; assert default().facets()"

  required-pytest:
    name: Run pytest
    needs: [pytest-shards, pytest-perf-and-collection, package-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require pytest jobs to succeed
        if: always()
        env:
          SHARD_RESULT: ${{ needs.pytest-shards.result }}
          PERF_RESULT: ${{ needs.pytest-perf-and-collection.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          test "$SHARD_RESULT" = success || {
            echo "::error::pytest shards finished with result: $SHARD_RESULT"
            exit 1
          }
          test "$PERF_RESULT" = success || {
            echo "::error::pytest perf and collection finished with result: $PERF_RESULT"
            exit 1
          }
          test "$PACKAGE_RESULT" = success || {
            echo "::error::package smoke test finished with result: $PACKAGE_RESULT"
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download shard collections
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*-collection
          path: shard-collections
          merge-multiple: true
      - name: Download full collection
        uses: actions/download-artifact@v4
        with:
          name: pytest-full-collection
      - name: Verify shard coverage
        run: python scripts/verify_pytest_shards.py full-collection.txt shard-collections/*.txt
