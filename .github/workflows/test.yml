name: Test suite

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml

      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev]"

      - name: Run test suite
        # -n auto: ubuntu-latest public runners are 4 vCPU, so this is 4
        # workers there and uses the machine's cores locally. --dist loadfile
        # keeps each test module on one worker: several modules cache the
        # catalogue at import, and a few hold process-wide state.
        run: python -m pytest -q -n auto --dist loadfile -m "not perf"

      - name: Run timing tests serially
        # Wall-clock bounds (the `perf` marker) run alone, without xdist: under
        # four parallel workers a 6 ms load measured 211 ms. The bounds are
        # ticket acceptance criteria and are not loosened for CI.
        run: python -m pytest -q -p no:xdist -m perf
