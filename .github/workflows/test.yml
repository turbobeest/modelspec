name: Test suite

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-shards:
    name: pytest shard ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: 0, label: 1/4}
          - {index: 1, label: 2/4}
          - {index: 2, label: 3/4}
          - {index: 3, label: 4/4}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml
      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev]"
      - name: Select test files and collect node ids
        run: |
          python scripts/pytest_shards.py --shard-count 4 \
            --shard-index ${{ matrix.index }} > shard-files.txt
          python -m pytest --collect-only -q -m "not perf" \
            $(< shard-files.txt) > shard-${{ matrix.index }}-collection.txt
      - name: Run test shard
        # -n auto uses the four cores on ubuntu-latest. --dist loadfile also
        # keeps each module together for shared module and process state.
        run: python -m pytest -q -n auto --dist loadfile -m "not perf" $(< shard-files.txt)
      - name: Upload collected node ids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.index }}-collection
          path: shard-${{ matrix.index }}-collection.txt

  required-pytest:
    name: Run pytest
    needs: pytest-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml
      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev]"
      - name: Run timing tests serially
        # Wall-clock bounds run alone. Parallel load made a 6 ms load take 211 ms.
        run: python -m pytest -q -p no:xdist -m perf
      - name: Collect the full non-performance suite
        run: python -m pytest --collect-only -q -m "not perf" > full-collection.txt
      - name: Download shard collections
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*-collection
          path: shard-collections
          merge-multiple: true
      - name: Verify shard coverage
        run: python scripts/verify_pytest_shards.py full-collection.txt shard-collections/*.txt
      - name: Require every shard to succeed
        if: always()
        env:
          SHARD_RESULT: ${{ needs.pytest-shards.result }}
        run: test "$SHARD_RESULT" = success
