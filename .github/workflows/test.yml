name: Test suite

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-shards:
    name: pytest shard ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHON_PLAYWRIGHT_VERSION: '1.63.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full-build modules run alone, without competing xdist workers.
          - {index: 0, label: 1/8, workers: 0}
          - {index: 1, label: 2/8, workers: 0}
          - {index: 2, label: 3/8, workers: 0}
          - {index: 3, label: 4/8, workers: 0}
          - {index: 4, label: 5/8, workers: auto}
          - {index: 5, label: 6/8, workers: auto}
          - {index: 6, label: 7/8, workers: auto}
          - {index: 7, label: 8/8, workers: auto}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Published blog revisions are checked against origin/main.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml
      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev,verify]"
      - name: Select test files and collect node ids
        run: |
          python scripts/pytest_shards.py --shard-count 8 \
            --isolate tests/test_private_serving.py \
            --isolate tests/test_social_cards.py \
            --isolate tests/test_agent_ready.py \
            --isolate tests/test_landing.py \
            --shard-index ${{ matrix.index }} > shard-files.txt
          python -m pytest --collect-only -q -m "not perf" \
            $(< shard-files.txt) > shard-${{ matrix.index }}-collection.txt
      - name: Select browser dependencies
        id: browsers
        run: |
          python_browser=false
          node_browser=false
          app=false
          if grep -qx 'tests/test_rendered_interactions.py' shard-files.txt; then
            python_browser=true
          fi
          if grep -qxE 'tests/test_(landing|social_cards)\.py' shard-files.txt; then
            node_browser=true
          fi
          if grep -qx 'tests/test_landing.py' shard-files.txt; then
            app=true
          fi
          node_version=$(python -c 'import json; print(json.load(open("web/package-lock.json"))["packages"]["node_modules/playwright"]["version"])')
          printf 'python=%s\nnode=%s\nnode-version=%s\napp=%s\n' \
            "$python_browser" "$node_browser" "$node_version" "$app" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache Chromium for the selected browser runtimes
        if: steps.browsers.outputs.python == 'true' || steps.browsers.outputs.node == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Separate runtime selections so an immutable cache contains every
          # required browser even if Python and Node versions later diverge.
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PYTHON_PLAYWRIGHT_VERSION }}-${{ steps.browsers.outputs.node-version }}-${{ steps.browsers.outputs.python }}-${{ steps.browsers.outputs.node }}
      - name: Install Python Playwright on the interaction recipe shard
        if: steps.browsers.outputs.python == 'true'
        # Cached browser binaries still need the runner's system libraries.
        run: |
          python -m pip install "playwright==$PYTHON_PLAYWRIGHT_VERSION"
          python -m playwright install --with-deps chromium
      - name: Install Node dependencies and Chromium
        if: steps.browsers.outputs.node == 'true'
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the app for landing browser tests
        if: steps.browsers.outputs.app == 'true'
        run: cd web && npm run build
      - name: Run test shard
        # Keep module fixtures together. Preserve the splitters' longest-first
        # order instead of xdist's default ordering by test count.
        run: >-
          python -m pytest -q -n ${{ matrix.workers }} --dist loadfile
          --no-loadscope-reorder -m "not perf" --durations=25
          --junitxml=shard-${{ matrix.index }}-junit.xml $(< shard-files.txt)
      - name: Upload collected node ids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.index }}-collection
          path: shard-${{ matrix.index }}-collection.txt
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.index }}-junit
          path: shard-${{ matrix.index }}-junit.xml

  pytest-perf-and-collection:
    name: pytest perf and collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/test.yml
      - name: Install package and test dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "httpx==0.28.1" \
            "rich==15.0.0" \
            "typer==0.27.2" \
            "click==8.5.0" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-xdist==3.8.0" \
            "ruff==0.16.6" \
            "mypy==2.3.1" \
            -e ".[dev,verify]"
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
          -shellcheck= -color

      - name: Run timing tests serially
        # Wall-clock bounds run alone. Parallel load made a 6 ms load take 211 ms.
        run: python -m pytest -q -p no:xdist -m perf
      - name: Collect the full non-performance suite
        run: python -m pytest --collect-only -q -m "not perf" > full-collection.txt
      - name: Upload full collection
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-collection
          path: full-collection.txt

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Inspect the wheel contents
        run: >-
          python -c "import glob, zipfile;
          names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          roots={name.split('/', 1)[0] for name in names};
          assert 'cli' in roots;
          assert not ({'api', 'decision', 'pipeline', 'registry', 'schema', 'models', 'tests', 'web'} & roots);
          assert 'cli/modelspec/agent-bundle.json' in names;
          assert not any(name.endswith(('/offline.py', '/snapshot.py', '/legacy.py')) for name in names)"
      - name: Install and run the wheel outside the checkout
        run: |
          repo_root="$PWD"
          wheel="$(realpath dist/*.whl)"
          venv="$RUNNER_TEMP/modelspec-package-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install "$wheel"
          export PATH="$venv/bin:$PATH"
          cd "$(mktemp -d)"
          modelspec --help > modelspec-help.txt
          cat modelspec-help.txt
          modelspec decide --help
          modelspec help agent --json > modelspec-agent.json
          modelspec key --json > modelspec-key.json
          "$venv/bin/python" "$repo_root/scripts/package_smoke.py"

  required-pytest:
    name: Run pytest
    needs: [pytest-shards, pytest-perf-and-collection, package-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require pytest jobs to succeed
        if: always()
        env:
          SHARD_RESULT: ${{ needs.pytest-shards.result }}
          PERF_RESULT: ${{ needs.pytest-perf-and-collection.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          test "$SHARD_RESULT" = success || {
            echo "::error::pytest shards finished with result: $SHARD_RESULT"
            exit 1
          }
          test "$PERF_RESULT" = success || {
            echo "::error::pytest perf and collection finished with result: $PERF_RESULT"
            exit 1
          }
          test "$PACKAGE_RESULT" = success || {
            echo "::error::package smoke test finished with result: $PACKAGE_RESULT"
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download shard collections
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*-collection
          path: shard-collections
          merge-multiple: true
      - name: Download full collection
        uses: actions/download-artifact@v4
        with:
          name: pytest-full-collection
      - name: Verify shard coverage
        run: python scripts/verify_pytest_shards.py full-collection.txt shard-collections/*.txt
