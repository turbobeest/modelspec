name: Benchgraph graph

# MODEL-9 part 1. Builds the FalkorDB graph export from benchmarks/*.md, proves
# the round trip and the named queries against a real FalkorDB, smoke-tests the
# query container, and keeps the export as a workflow artifact.
# Part 2: on push to main only, the `deploy` job uploads that export to R2 and
# deploys the Worker + Container. PR runs never reach it or its secrets.
# This is not a required check; `Run pytest` and `Build both sites` are.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchgraph-graph-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph:
    name: Benchgraph graph export
    runs-on: ubuntu-latest
    services:
      falkordb:
        # Keep in step with FALKORDB_IMAGE in pipeline/benchgraph_graph.py
        # and FROM in graph-service/Dockerfile.
        image: falkordb/falkordb:v4.20.1
        env:
          BROWSER: "0"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BENCHGRAPH_FALKORDB_HOST: localhost
      BENCHGRAPH_FALKORDB_PORT: "6379"
      # Turn "FalkorDB unreachable" from a skip into a failure.
      BENCHGRAPH_REQUIRE_FALKORDB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install \
            "pydantic==2.13.5" \
            "PyYAML==6.0.3" \
            "FalkorDB==1.7.1" \
            "pytest==9.1.1" \
            "pytest-xdist==3.8.0"

      - name: Ingest, round-trip and query tests
        run: python -m pytest -q tests/test_benchgraph_graph.py

      - name: Build and verify the export
        run: |
          python -m pipeline.benchgraph_graph export --out dist/benchgraph-graph --verify | tee export-summary.json
          {
            echo '### Benchgraph graph export'
            echo
            echo '```json'
            cat export-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the query container
        run: |
          docker build -f graph-service/Dockerfile -t benchgraph-graph:ci .
          docker run -d --name graph -p 8080:8080 \
            -v "$PWD/dist/benchgraph-graph:/export:ro" -e GRAPH_EXPORT_URL=/export \
            -e "BUILD_COMMIT=${GITHUB_SHA}" \
            benchgraph-graph:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/graph/health && break
            sleep 2
          done
          # The image must echo back the version it was started for; the
          # deploy's roll check is worthless without it.
          curl -fsS http://localhost:8080/graph/health -o health.json
          python3 -c "import json,os,sys; got=json.load(open('health.json')).get('service_commit'); sys.exit(0 if got==os.environ['GITHUB_SHA'] else 'service_commit=%r' % (got,))"
          curl -fsS "http://localhost:8080/graph/benchmarks_still_separating?capability=coding&limit=3"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/graph/cypher?q=MATCH')" = 404
          docker logs graph
          docker rm -f graph

      - name: Upload the export
        uses: actions/upload-artifact@v4
        with:
          name: benchgraph-graph-${{ github.sha }}
          path: dist/benchgraph-graph/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy graph service to Cloudflare
    needs: graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: benchgraph-graph-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRAPH_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: benchgraph-graph-exports
      GRAPH_HOST: graph.benchgraph.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the export
        uses: actions/download-artifact@v4
        with:
          name: benchgraph-graph-${{ github.sha }}
          path: dist/benchgraph-graph

      - name: Install wrangler
        working-directory: graph-service/worker
        run: npm ci

      - name: Upload the export to R2 (manifest last)
        working-directory: graph-service/worker
        run: |
          set -euo pipefail
          for prefix in "benchgraph-graph/${GITHUB_SHA}" "benchgraph-graph/latest"; do
            for f in nodes.json edges.json manifest.json; do
              npx wrangler r2 object put "${BUCKET}/${prefix}/${f}" \
                --file "${GITHUB_WORKSPACE}/dist/benchgraph-graph/${f}" \
                --content-type application/json --remote
            done
          done

      - name: Deploy Worker and Container
        working-directory: graph-service/worker
        # BUILD_COMMIT is what makes the deploy roll the container: the Durable
        # Object destroys an instance left over from an earlier BUILD_COMMIT, and
        # the fresh one reports this value back as `service_commit`. CLI vars are
        # merged over the config vars, so GRAPH_EXPORT_URL is unaffected.
        run: npx wrangler deploy --var "BUILD_COMMIT:${GITHUB_SHA}"

      - name: Smoke-test graph.benchgraph.dev
        run: |
          set -uo pipefail
          url="https://${GRAPH_HOST}/graph"
          deadline=$((SECONDS + 300))
          status=""; commit=""; service=""
          # Nothing is masked here: an unreadable body must stay
          # visible. An empty file reads as {}; anything else that fails to parse
          # prints its traceback and leaves the field empty, which the loop
          # already treats as "not the version we deployed".
          field() {
            python3 -c "import json,sys; raw=open('health.json').read().strip(); print((json.loads(raw) if raw else {}).get(sys.argv[1]) or '')" "$1"
          }
          while [ "$SECONDS" -lt "$deadline" ]; do
            : > health.json
            status=$(curl -sS -o health.json -w '%{http_code}' --max-time 20 "${url}/health" || echo 000)
            # service_commit is the container's own BUILD_COMMIT, fixed when that
            # instance started: it can only match if this deploy rolled it.
            # build_commit is the export that instance loaded. Both must be this
            # sha, or whatever answered is not what we just deployed.
            service=$(field service_commit)
            commit=$(field build_commit)
            if [ "$status" = 200 ] && [ "$service" = "${GITHUB_SHA}" ] && [ "$commit" = "${GITHUB_SHA}" ]; then
              echo "fresh instance on ${GITHUB_SHA}: service_commit and build_commit both match"
              break
            fi
            echo "health HTTP ${status} service_commit=${service:-none} build_commit=${commit:-none}; want ${GITHUB_SHA}; retrying"
            sleep 10
          done
          if [ "$status" = 000 ]; then
            echo "::error::${GRAPH_HOST} unreachable after 5 min. Check the proxied DNS record for ${GRAPH_HOST} (see docs/benchgraph-graph.md)."
            exit 1
          fi
          if [ "$service" != "${GITHUB_SHA}" ]; then
            echo "::error::the container never rolled onto ${GITHUB_SHA}: /graph/health reports service_commit=${service:-none} after 5 min (last HTTP ${status}). An older image is still answering, so nothing in this deploy was exercised. A 404/522 usually means the route or DNS record is missing; error=version_rolling means the Durable Object did not destroy the old instance."
            cat health.json; echo
            exit 1
          fi
          if [ "$status" != 200 ] || [ "$commit" != "${GITHUB_SHA}" ]; then
            echo "::error::${url}/health is on the new image but did not load export ${GITHUB_SHA} within 5 min (last HTTP ${status}, build_commit=${commit:-none}). Read last_error in the body below."
            cat health.json; echo
            exit 1
          fi
          curl -fsS --max-time 60 "${url}/benchmarks_still_separating?capability=coding&limit=3"
