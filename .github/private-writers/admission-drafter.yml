name: Draft a model admission packet

'on':
  workflow_dispatch:
    inputs:
      model:
        description: Canonical lab/model ID, such as anthropic/claude-haiku-5-5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-drafter-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft one release for human review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pr_branch: ${{ (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated') && steps.pr.outputs.pull-request-branch || '' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    defaults:
      run:
        working-directory: data
    steps:
      - name: Validate the release ID
        working-directory: .
        id: input
        env:
          MODEL_ID: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if ! [[ "$MODEL_ID" =~ ^[a-z0-9][a-z0-9.-]*/[a-z0-9][a-z0-9.-]*$ ]] \
            || [[ "$MODEL_ID" == *..* ]] || [ "${#MODEL_ID}" -gt 128 ]; then
            echo '::error::Use a lowercase lab/model ID with no .. segments, at most 128 characters.'
            exit 2
          fi
          printf 'model_id=%s\n' "$MODEL_ID" >> "$GITHUB_OUTPUT"
          printf 'lab=%s\nslug=%s\n' "${MODEL_ID%%/*}" "${MODEL_ID#*/}" >> "$GITHUB_OUTPUT"
      - name: Check out private data
        uses: actions/checkout@v4
        with:
          path: data
          ref: main
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse code and symlinks in data paths
        working-directory: .
        run: python -I data/.github/scripts/check_linked_data.py --engine engine --data data
      - name: Install the pinned engine
        run: python -I -m pip install -e "$GITHUB_WORKSPACE/engine[dev]"
      - name: Draft the admission packet
        env:
          MODEL_ID: ${{ steps.input.outputs.model_id }}
          MODELSPEC_SOURCE_CACHE: ${{ runner.temp }}/admission-sources
        run: |
          set -euo pipefail
          python -I -c 'import runpy,sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_module("scripts.admission_drafter", run_name="__main__")' \
            "$GITHUB_WORKSPACE/engine" \
            --data-dir "$GITHUB_WORKSPACE/data" \
            --model "$MODEL_ID" \
            --write \
            --report "$GITHUB_WORKSPACE/data/reports/admission/$MODEL_ID.json" \
            --body "$GITHUB_WORKSPACE/data/reports/admission/$MODEL_ID.md" \
            --manifest "$GITHUB_WORKSPACE/data/reports/admission/$MODEL_ID.manifest.json" \
            --cache-dir "$RUNNER_TEMP/admission-sources"
      - name: Retain packet and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-packet-${{ steps.input.outputs.lab }}-${{ steps.input.outputs.slug }}
          path: |
            ${{ github.workspace }}/data/reports/admission/${{ steps.input.outputs.model_id }}.json
            ${{ github.workspace }}/data/reports/admission/${{ steps.input.outputs.model_id }}.manifest.json
          retention-days: 35
          if-no-files-found: ignore
      - name: Open the admission draft pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          path: data
          base: main
          branch: admission/${{ steps.input.outputs.model_id }}
          draft: true
          add-paths: |
            reports/admission/${{ steps.input.outputs.model_id }}.json
            reports/admission/${{ steps.input.outputs.model_id }}.md
            reports/admission/${{ steps.input.outputs.model_id }}.manifest.json
            models/${{ steps.input.outputs.model_id }}.md
            offerings/*/${{ steps.input.outputs.model_id }}.yaml
            registry/sources.yaml
            verification/queue/events.jsonl
            verification/log.jsonl
            premier/slice-1.yaml
          signoff: true
          commit-message: |-
            data: draft ${{ steps.input.outputs.model_id }} admission (MODEL-428)

            Co-Authored-By: ChatGPT Codex <noreply@openai.com>
          title: 'data: draft ${{ steps.input.outputs.model_id }} admission (MODEL-428)'
          body-path: ${{ github.workspace }}/data/reports/admission/${{ steps.input.outputs.model_id }}.md
  recall-dispatch:
    # MODEL-476: a pull request opened with the repository token starts no pull_request
    # workflow, so this job starts the recall check on the branch. It alone holds
    # the actions write permission. It has no checkout, runs no script from a working tree, and its
    # only input is the pattern-checked branch name from the writer job's output.
    name: Start the recall check on the pull request branch
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch the recall workflow on the pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECALL_WORKFLOW: recall-private.yml
          BRANCH_PATTERN: '^admission/[a-z0-9][a-z0-9.-]*/[a-z0-9][a-z0-9.-]*$'
          BRANCHES: ${{ needs.draft.outputs.pr_branch }}
          STARTED_MESSAGE: 'The "Approved answers on private data" check was started on this branch by the workflow run that opened this pull request. Merge only when it passes.'
          FALLBACK_MESSAGE: 'The "Approved answers on private data" check could not be started automatically. Run it by dispatching "Private production-data recall" on this branch (or close and reopen the pull request) and merge only when it passes.'
        run: |
          set -u
          failed=0
          read -r -a names <<< "$BRANCHES"
          for branch in "${names[@]}"; do
            if [ "${#branch}" -gt 200 ] || [[ "$branch" == *..* ]] || ! [[ "$branch" =~ $BRANCH_PATTERN ]]; then
              echo "::error::A branch name did not match this writer's branch pattern. Nothing was dispatched for it."
              failed=1
              continue
            fi
            if gh workflow run "$RECALL_WORKFLOW" --ref "$branch"; then
              echo "Started $RECALL_WORKFLOW on $branch." >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$STARTED_MESSAGE" ]; then
                gh pr comment "$branch" --body "$STARTED_MESSAGE" \
                  || echo "::warning::The check was started but the pull request comment could not be posted."
              fi
            else
              echo "::warning::Could not dispatch $RECALL_WORKFLOW on $branch. The fallback text is posted on the pull request."
              gh pr comment "$branch" --body "$FALLBACK_MESSAGE" \
                || echo "::warning::The fallback comment could not be posted either."
              failed=1
            fi
          done
          exit "$failed"
