# MODEL-247: install in modelspec-data. This directory is not an Actions workflow directory.
name: Weekly leaderboard refresh
permissions:
  contents: read
concurrency:
  group: weekly-leaderboard-refresh
  cancel-in-progress: false
jobs:
  refresh:
    name: Re-read live boards
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated') && steps.pr.outputs.pull-request-branch || '' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: data
          persist-credentials: false
          token: ${{ github.token }}
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Link the data paths into the verified engine and put only the engine on the import path
        working-directory: .
        run: |
          set -euo pipefail
          if [ -L data ]; then
            echo "::error::refusing symlink data"
            exit 1
          fi
          if [ ! -d data/models ] || [ -L data/models ]; then
            echo "::error::data/models is missing"
            exit 1
          fi
          if [ ! -d data/benchmarks ] || [ -L data/benchmarks ]; then
            echo "::error::data/benchmarks is missing"
            exit 1
          fi
          paths="$(python -I engine/pipeline/data_source.py paths)"
          if [ -z "$(printf '%s' "$paths" | tr -d '[:space:]')" ]; then
            echo "::error::data paths are empty"
            exit 1
          fi
          while IFS= read -r P; do
            [ -n "$P" ] || continue
            prefix=data
            IFS=/ read -r -a parts <<< "$P"
            for part in "${parts[@]}"; do
              [ -n "$part" ] || continue
              prefix="$prefix/$part"
              if [ -L "$prefix" ]; then
                echo "::error::refusing symlink $prefix"
                exit 1
              fi
            done
            if [ -e "data/$P" ]; then
              resolved="$(realpath -e "data/$P")"
              case "$resolved/" in
                "$GITHUB_WORKSPACE/data/"*) ;;
                *)
                  echo "::error::data/$P resolves outside the data checkout ($resolved)"
                  exit 1
                  ;;
              esac
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install refresh dependencies
        run: python -I -m pip install pydantic pyyaml httpx pyarrow
      - name: Preserve the mechanically checked baseline
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          cp -R models verification "$RUNNER_TEMP/before/"
      - name: Re-read every covered board once
        env:
          MODELSPEC_SOURCE_CACHE: ${{ runner.temp }}/source-copies
          DRY_RUN: ${{ inputs.dry_run }}
          # The mode comes from the repository variable; unset means pinned.
          MODELSPEC_ARENA_REVISION: ${{ vars.MODELSPEC_ARENA_REVISION || 'pinned' }}
        run: |
          args=(--observed-at "$(date -u +%F)" --audit-json "$RUNNER_TEMP/audit.json" --report-json "$RUNNER_TEMP/report.json")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -I -m scripts.refresh_leaderboards "${args[@]}" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-refresh-report
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/audit.json
      - name: Prove the generated diff is score-only
        id: guard
        if: inputs.dry_run != true
        run: |
          mkdir -p "$RUNNER_TEMP/after"
          cp -R models verification "$RUNNER_TEMP/after/"
          python -I - "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" <<'PY'
          import sys
          from pathlib import Path
          from scripts.refresh_leaderboards import check_score_only

          result = check_score_only(Path(sys.argv[1]), Path(sys.argv[2]))
          if not result.ok:
              print("::error::refresh produced a non-score diff")
              print("\n".join(result.errors))
              raise SystemExit(1)
          PY
          echo "score_only=true" >> "$GITHUB_OUTPUT"
      - name: Count changes and verification failures
        id: result
        run: |
          python -I - "$RUNNER_TEMP/report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          with open(sys.argv[2], "a") as out:
              print(f"changes={len(report['changes'])}", file=out)
              print(f"reconfirmed={len(report['reconfirmed'])}", file=out)
              print(f"updates={len(report['changes']) + len(report['reconfirmed'])}", file=out)
              print(f"failures={len(report['failures'])}", file=out)
              print(f"quarantined={len(report['quarantined'])}", file=out)
          PY
      - name: Prepare the pull-request body
        if: inputs.dry_run != true && steps.result.outputs.updates != '0'
        run: |
          python -I - "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/pr-body.md" <<'PY'
          import sys
          from pathlib import Path
          from scripts.refresh_leaderboards import fit_pull_request_body

          report_path, body_path = sys.argv[1:]
          report = Path(report_path).read_text(encoding="utf-8")
          opening = (
              "This weekly job re-read the registered live boards for existing models "
              "in the premier set.\n\n"
          )
          closing = (
              "\nThe diff guard proved that no card, evidence row, identity fact, "
              "or licence fact was added or removed.\n\n"
              "Written by GPT-5 Codex.\n"
          )
          Path(body_path).write_text(
              fit_pull_request_body(opening + report + closing), encoding="utf-8",
          )
          PY
      - name: Open the score-only pull request
        id: pr
        if: inputs.dry_run != true && steps.result.outputs.updates != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data/weekly-leaderboard-refresh
          delete-branch: true
          add-paths: |
            models/**
            verification/log.jsonl
            verification/queue/events.jsonl
          signoff: true
          commit-message: |-
            data: refresh live-board observations (MODEL-124)

            Co-Authored-By: Codex (GPT-6.1 Sol) <noreply@openai.com>
          title: 'data: refresh live-board observations (MODEL-124)'
          body-path: ${{ runner.temp }}/pr-body.md
          path: data
      - name: Put the PR URL in the audit records
        if: steps.pr.outputs.pull-request-number
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          python -I - "$RUNNER_TEMP/audit.json" <<'PY'
          import json, os, sys
          audit_path = sys.argv[1]
          rows = json.load(open(audit_path))
          for row in rows:
              row["pr"] = os.environ["PR_URL"]
          with open(audit_path, "w") as out:
              json.dump(rows, out, indent=2)
              out.write("\n")
          PY
      - name: Upload the audit artifact
        if: steps.pr.outputs.pull-request-number
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-refresh-audit-${{ steps.pr.outputs.pull-request-number }}
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
      - name: Fill the pull request URL into the body
        if: steps.pr.outputs.pull-request-number
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          python -I - "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/pr-body.md" <<'PY'
          import os, sys
          from pathlib import Path
          from scripts.refresh_leaderboards import fit_pull_request_body

          report_path, body_path = sys.argv[1:]
          report = Path(report_path).read_text(encoding="utf-8")
          opening = (
              "This weekly job re-read the registered live boards for existing models "
              "in the premier set.\n\n"
          )
          closing = (
              "\nThe diff guard proved that no card, evidence row, identity fact, "
              "or licence fact was added or removed.\n\n"
              "Written by GPT-5 Codex.\n"
          )
          body = (opening + report + closing).replace("${PR_URL}", os.environ["PR_URL"])
          Path(body_path).write_text(fit_pull_request_body(body), encoding="utf-8")
          PY
      - name: Put the PR URL in the pull-request body
        if: steps.pr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if ! gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::warning::Could not update the pull request body. The full report is in the leaderboard-refresh-report artifact."
            exit 1
          fi
      - name: Fail a no-update run that could not read every board
        if: steps.result.outputs.updates == '0' && steps.result.outputs.failures != '0'
        run: |
          echo "::error::No score changed, but one or more live boards failed; see the run summary."
          exit 1
    defaults:
      run:
        working-directory: data
  recall-dispatch:
    # MODEL-476: a pull request opened with the repository token starts no pull_request
    # workflow, so this job starts the recall check on the branch. It alone holds
    # the actions write permission. It has no checkout, runs no script from a working tree, and its
    # only input is the pattern-checked branch name from the writer job's output. The read access to
    # repository contents is there only so that `gh pr comment <branch>` can find the pull request
    # (the fallback comment cannot post without it); the job still checks out nothing and runs
    # no code from a branch. The "started" comment is gone: the dispatched run posts a pending status.
    name: Start the recall check on the pull request branch
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Dispatch the recall workflow on the pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECALL_WORKFLOW: recall-private.yml
          BRANCH_PATTERN: '^data/weekly-leaderboard-refresh$'
          BRANCHES: ${{ needs.refresh.outputs.pr_branch }}
          STARTED_MESSAGE: ''
          FALLBACK_MESSAGE: 'The "Approved answers on private data" check could not be started automatically. Run it by dispatching "Private production-data recall" on this branch (or close and reopen the pull request) and merge only when it passes.'
        run: |
          set -u
          failed=0
          read -r -a names <<< "$BRANCHES"
          for branch in "${names[@]}"; do
            if [ "${#branch}" -gt 200 ] || [[ "$branch" == *..* ]] || ! [[ "$branch" =~ $BRANCH_PATTERN ]]; then
              echo "::error::A branch name did not match this writer's branch pattern. Nothing was dispatched for it."
              failed=1
              continue
            fi
            if gh workflow run "$RECALL_WORKFLOW" --ref "$branch"; then
              echo "Started $RECALL_WORKFLOW on $branch." >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$STARTED_MESSAGE" ]; then
                gh pr comment "$branch" --body "$STARTED_MESSAGE" \
                  || echo "::warning::The check was started but the pull request comment could not be posted."
              fi
            else
              echo "::warning::Could not dispatch $RECALL_WORKFLOW on $branch. The fallback text is posted on the pull request."
              gh pr comment "$branch" --body "$FALLBACK_MESSAGE" \
                || echo "::warning::The fallback comment could not be posted either."
              failed=1
            fi
          done
          exit "$failed"
'on':
  schedule:
    - cron: 20 6 * * 1
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and report without changing cards or opening a pull request
        type: boolean
        default: false
