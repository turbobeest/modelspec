# MODEL-247: install in modelspec-data. This directory is not an Actions workflow directory.
name: Process release signals
permissions:
  contents: read
env:
  MAX_RELEASE_SIGNAL_WORK_ITEMS: "10"
concurrency:
  group: release-signals
  cancel-in-progress: false
jobs:
  pending:
    name: Build pending-work matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    permissions: {}
    env:
      SIGNALS_ORIGIN: https://api.modelspec.dev
    steps:
      - name: Refuse missing repository credentials
        env:
          MODELSPEC_SIGNALS_READ_KEY: ${{ secrets.MODELSPEC_SIGNALS_READ_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$MODELSPEC_SIGNALS_READ_KEY" ] || [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::MODELSPEC_SIGNALS_READ_KEY and GITHUB_TOKEN are required."
            exit 1
          fi
      - name: Pull all pending signals and due re-checks
        env:
          MODELSPEC_SIGNALS_READ_KEY: ${{ secrets.MODELSPEC_SIGNALS_READ_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $MODELSPEC_SIGNALS_READ_KEY" \
            "$SIGNALS_ORIGIN/v1/signals/pending" \
            --output "$RUNNER_TEMP/pending.json"
      - name: Build the isolated-work matrix
        id: matrix
        run: |
          selected="$(jq -c \
            --argjson limit "$MAX_RELEASE_SIGNAL_WORK_ITEMS" \
            --argjson run "${GITHUB_RUN_NUMBER:-0}" '
            def take_window($slots; $run):
              . as $items
              | if ($slots <= 0) or (($items | length) == 0) then []
                elif ($items | length) <= $slots then $items
                else
                  ($run % ($items | length)) as $off
                  | [range(0; $slots) | $items[($off + .) % ($items | length)]]
                end;
            def signal_reserve($limit):
              if $limit >= 10 then 7 else ($limit * 7 / 10 | floor) end;
            (.signals // []) as $raw_signals
            | (.rechecks // []) as $raw_rechecks
            | (signal_reserve($limit)) as $sig_reserve
            | (if $limit >= 10 then 3 else ($limit - $sig_reserve) end) as $rec_reserve
            | [
                $raw_signals[] | {
                  _sort: [.timestamp, .signal_id],
                  signal_id,
                  recheck_day: 0,
                  pr_url: (.pr_url // null)
                }
              ] | sort_by(._sort) | map(del(._sort)) as $signals
            | [
                $raw_rechecks[] | {
                  _sort: [.due // "", .signal.timestamp // "", .signal.signal_id],
                  signal_id: .signal.signal_id,
                  recheck_day: .day,
                  pr_url: (.pr_url // null)
                }
              ] | sort_by(._sort) | map(del(._sort)) as $rechecks
            | ([$sig_reserve, ($signals | length), $limit] | min) as $sig0
            | ([$rec_reserve, ($rechecks | length), ($limit - $sig0)] | min) as $rec0
            | ($limit - $sig0 - $rec0) as $left
            | (if $left > 0 and (($signals | length) > $sig0)
                then [$left, (($signals | length) - $sig0)] | min else 0 end) as $sig_extra
            | ($sig0 + $sig_extra) as $sig_slots
            | ($left - $sig_extra) as $left2
            | (if $left2 > 0 and (($rechecks | length) > $rec0)
                then [$left2, (($rechecks | length) - $rec0)] | min else 0 end) as $rec_extra
            | ($rec0 + $rec_extra) as $rec_slots
            | ($signals | take_window($sig_slots; $run))
              + ($rechecks | take_window($rec_slots; $run))
          ' "$RUNNER_TEMP/pending.json")"
          matrix="$(jq -nc --argjson work "$selected" '{work: $work}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$selected")" >> "$GITHUB_OUTPUT"
      - name: Preserve pending work for each isolated job
        uses: actions/upload-artifact@v4
        with:
          name: release-signals-pending
          path: ${{ runner.temp }}/pending.json
          if-no-files-found: error
    defaults:
      run:
        working-directory: .
  process:
    name: Release signal to card change
    needs: pending
    if: needs.pending.outputs.count != '0'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.pending.outputs.matrix) }}
    runs-on: ubuntu-latest
    outputs:
      branch_0: ${{ strategy.job-index == 0 && steps.recall_branch.outputs.branch || '' }}
      branch_1: ${{ strategy.job-index == 1 && steps.recall_branch.outputs.branch || '' }}
      branch_2: ${{ strategy.job-index == 2 && steps.recall_branch.outputs.branch || '' }}
      branch_3: ${{ strategy.job-index == 3 && steps.recall_branch.outputs.branch || '' }}
      branch_4: ${{ strategy.job-index == 4 && steps.recall_branch.outputs.branch || '' }}
      branch_5: ${{ strategy.job-index == 5 && steps.recall_branch.outputs.branch || '' }}
      branch_6: ${{ strategy.job-index == 6 && steps.recall_branch.outputs.branch || '' }}
      branch_7: ${{ strategy.job-index == 7 && steps.recall_branch.outputs.branch || '' }}
      branch_8: ${{ strategy.job-index == 8 && steps.recall_branch.outputs.branch || '' }}
      branch_9: ${{ strategy.job-index == 9 && steps.recall_branch.outputs.branch || '' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      SIGNALS_ORIGIN: https://api.modelspec.dev
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Refuse missing repository credentials
        env:
          MODELSPEC_SIGNALS_READ_KEY: ${{ secrets.MODELSPEC_SIGNALS_READ_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$MODELSPEC_SIGNALS_READ_KEY" ] || [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::MODELSPEC_SIGNALS_READ_KEY and GITHUB_TOKEN are required."
            exit 1
          fi
        working-directory: .
      - name: Select the re-check base
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ matrix.work.pr_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          mode=initial
          ref="$DEFAULT_BRANCH"
          branch=
          if [[ "$PR_URL" == https://github.com/turbobeest/modelspec-data/pull/* ]]; then
            details="$(gh pr view "$PR_URL" --json state,headRefName,headRepositoryOwner)"
            state="$(jq -r '.state' <<<"$details")"
            case "$state" in
              OPEN)
                owner="$(jq -r '.headRepositoryOwner.login // ""' <<<"$details")"
                if [ "$owner" != "$REPOSITORY_OWNER" ]; then
                  echo "::error::Refusing to update a release-signal PR from another repository."
                  exit 1
                fi
                mode=open
                ref="$(jq -r '.headRefName' <<<"$details")"
                branch="$ref"
                ;;
              MERGED)
                mode=merged
                ;;
              CLOSED)
                mode=closed
                ;;
              *)
                echo "::error::Unknown pull request state: $state"
                exit 1
                ;;
            esac
          elif [ -n "$PR_URL" ]; then
            mode=unlinked
          fi
          {
            echo "mode=$mode"
            echo "ref=$ref"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}
          ref: ${{ steps.recheck.outputs.ref }}
          path: data
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - name: Refuse an engine pin that does not descend from the default branch pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          pin="${pin//$'\n'/}"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          if ! git -C data rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "::error::origin/main is not in the data checkout and no token is available to fetch it."
              exit 1
            fi
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -C data config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
            fetch_status=0
            git -C data fetch --no-tags origin main || fetch_status=$?
            git -C data config --local --unset-all http.https://github.com/.extraheader
            if [ "$fetch_status" -ne 0 ]; then
              exit "$fetch_status"
            fi
          fi
          base="$(git -C data show "origin/main:.engine-pin")"
          base="${base//$'\n'/}"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::origin/main:.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-ancestry"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$base^{commit}" 2>/dev/null \
            || ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$base" "$pin"; then
            echo "::error::.engine-pin $pin does not descend from the default branch pin $base."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Link the data paths into the verified engine and put only the engine on the import path
        working-directory: .
        run: |
          set -euo pipefail
          if [ -L data ]; then
            echo "::error::refusing symlink data"
            exit 1
          fi
          if [ ! -d data/models ] || [ -L data/models ]; then
            echo "::error::data/models is missing"
            exit 1
          fi
          if [ ! -d data/benchmarks ] || [ -L data/benchmarks ]; then
            echo "::error::data/benchmarks is missing"
            exit 1
          fi
          paths="$(python -I engine/pipeline/data_source.py paths)"
          if [ -z "$(printf '%s' "$paths" | tr -d '[:space:]')" ]; then
            echo "::error::data paths are empty"
            exit 1
          fi
          while IFS= read -r P; do
            [ -n "$P" ] || continue
            prefix=data
            IFS=/ read -r -a parts <<< "$P"
            for part in "${parts[@]}"; do
              [ -n "$part" ] || continue
              prefix="$prefix/$part"
              if [ -L "$prefix" ]; then
                echo "::error::refusing symlink $prefix"
                exit 1
              fi
            done
            if [ -e "data/$P" ]; then
              resolved="$(realpath -e "data/$P")"
              case "$resolved/" in
                "$GITHUB_WORKSPACE/data/"*) ;;
                *)
                  echo "::error::data/$P resolves outside the data checkout ($resolved)"
                  exit 1
                  ;;
              esac
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install pipeline dependencies
        # Browsers belong in read-only jobs. Unreadable HTTP prices remain explicit gaps here.
        run: python -I -m pip install -e "$GITHUB_WORKSPACE/engine[dev]" pyarrow
      - name: Download the pending-work snapshot
        uses: actions/download-artifact@v4
        with:
          name: release-signals-pending
          path: ${{ runner.temp }}
      - name: Preserve the mechanically checked baseline
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          cp -R models offerings registry verification "$RUNNER_TEMP/before/"
      - name: Process one isolated work item
        env:
          MODELSPEC_SOURCE_CACHE: ${{ runner.temp }}/source-copies
          PR_MODE: ${{ steps.recheck.outputs.mode }}
          PR_URL: ${{ matrix.work.pr_url }}
          SIGNAL_ID: ${{ matrix.work.signal_id }}
          RECHECK_DAY: ${{ matrix.work.recheck_day }}
          # The mode comes from the repository variable; unset means pinned.
          MODELSPEC_ARENA_REVISION: ${{ vars.MODELSPEC_ARENA_REVISION || 'pinned' }}
        run: |
          closed_pr=()
          if [ "$PR_MODE" = closed ]; then
            closed_pr=(--closed-unmerged-pr "$PR_URL")
          fi
          python -I -m scripts.process_release_signals \
            --pending "$RUNNER_TEMP/pending.json" \
            --result "$RUNNER_TEMP/result.json" \
            --audit-json "$RUNNER_TEMP/audit.json" \
            --report-json "$RUNNER_TEMP/refresh-report.json" \
            --signal-id "$SIGNAL_ID" \
            --recheck-day "$RECHECK_DAY" \
            "${closed_pr[@]}"
          cat "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the signal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-signal-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
          overwrite: true
      - name: Retain allowed pricing copies and citation metadata for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-signal-price-copies-${{ strategy.job-index }}
          path: ${{ runner.temp }}/source-copies
          retention-days: 35
          if-no-files-found: ignore
          overwrite: true
      - name: Classify the generated change
        id: classify
        run: |
          mkdir -p "$RUNNER_TEMP/after"
          cp -R models offerings registry verification "$RUNNER_TEMP/after/"
          python -I - "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" "$RUNNER_TEMP/result.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          from release_signals.pipeline import ChangePolicy

          before, after, result_file, output = map(Path, sys.argv[1:])
          result = json.loads(result_file.read_text())
          decision = ChangePolicy.classify(before, after)
          with output.open("a") as handle:
              print(f"changed={'true' if decision.changed else 'false'}", file=handle)
              print(f"signal_id={result.get('signal_id', '')}", file=handle)
              print(f"resolution={result.get('status', 'empty')}", file=handle)
              print(f"score_only={'true' if decision.score_only else 'false'}", file=handle)
              print(f"human={'true' if decision.merge == 'human' else 'false'}", file=handle)
              print(f"recheck_day={result.get('recheck_day') or 'initial'}", file=handle)
              print(f"failures={result.get('failures', 0)}", file=handle)
              print(f"quarantined={result.get('quarantined', 0)}", file=handle)
          PY
      - name: Flag a new-model PR closed without merge
        id: closed_pr
        if: steps.classify.outputs.resolution == 'closed_unmerged'
        env:
          PR_URL: ${{ matrix.work.pr_url }}
        run: |
          url="$PR_URL"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Validate cards and run two-key verification
        if: steps.classify.outputs.changed == 'true'
        env:
          MODELSPEC_SOURCE_CACHE: ${{ runner.temp }}/source-copies
        run: |
          python -I -m scripts.validate_pr --all > "$RUNNER_TEMP/card-validation.json"
          python -I -m cli.modelspec.legacy verify --skip-absent-copies --json > "$RUNNER_TEMP/verification.json"
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          counts = json.loads(Path(os.environ["RUNNER_TEMP"], "verification.json").read_text())["counts"]
          lines = [
              f"verified: {counts['verified']}",
              f"mismatch: {counts['mismatch']}",
              f"unreachable: {counts['unreachable']}",
              f"skipped: {counts['skipped']}",
              f"skipped for no copy: {counts['skipped_no_copy']}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Run the MODEL-111 accuracy harness
        if: steps.classify.outputs.changed == 'true'
        run: python -I -m scripts.accuracy --profile data-pr --output-dir "$RUNNER_TEMP/accuracy"
      - name: Run the MODEL-160 recall report
        if: steps.classify.outputs.changed == 'true'
        run: |
          python -I -m scripts.recall_run \
            --output-dir "$RUNNER_TEMP/recall" \
            --date "$(date -u +%F)"
      - name: Compare approved answers on private data
        id: approved
        if: steps.classify.outputs.changed == 'true'
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD origin/main)"
          if git cat-file -e "$merge_base:reports/recall/baseline.json" 2>/dev/null; then
            git show "$merge_base:reports/recall/baseline.json" \
              > "$RUNNER_TEMP/approved-private-recall.json"
          else
            cp reports/recall/baseline.json "$RUNNER_TEMP/approved-private-recall.json"
          fi
          python -I -m scripts.accuracy --compare-approved-answers \
            --report-dir "$RUNNER_TEMP/recall" \
            --baseline reports/recall/baseline.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --approved-baseline "$RUNNER_TEMP/approved-private-recall.json" \
            --step-output "$GITHUB_OUTPUT"
      - name: Commit and push the isolated signal branch
        if: steps.classify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNAL_ID: ${{ steps.classify.outputs.signal_id }}
          RECHECK_DAY: ${{ steps.classify.outputs.recheck_day }}
          PR_MODE: ${{ steps.recheck.outputs.mode }}
          EXISTING_BRANCH: ${{ steps.recheck.outputs.branch }}
        run: |
          git config user.name "modelspec-release-signals"
          git config user.email "noreply@modelspec.dev"
          if [ "$PR_MODE" = open ]; then
            branch="$EXISTING_BRANCH"
          else
            branch="data/release-signal-${SIGNAL_ID//[^A-Za-z0-9._-]/-}-${RECHECK_DAY}"
            git switch -c "$branch"
          fi
          git add models offerings registry/sources.yaml verification
          git commit -s \
            -m "pipeline: process release signal ${SIGNAL_ID} (MODEL-113)" \
            -m "Co-Authored-By: Codex (GPT-6.1 Sol) <noreply@openai.com>"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          push_status=0
          git push --set-upstream origin "HEAD:$branch" || push_status=$?
          git config --local --unset-all http.https://github.com/.extraheader
          if [ "$push_status" -ne 0 ]; then
            exit "$push_status"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Open or update the pull request
        id: pr
        if: steps.classify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_MODE: ${{ steps.recheck.outputs.mode }}
          EXISTING_PR_URL: ${{ matrix.work.pr_url }}
          HUMAN: ${{ steps.classify.outputs.human }}
          REGRESSED: ${{ steps.approved.outputs.regressed }}
          REGRESSION_IDS: ${{ steps.approved.outputs.regression_ids }}
        run: |
          model_id="$(python -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/result.json")).get("model_id") or "release signal")')"
          if [ "$REGRESSED" = true ]; then
            {
              echo "Regressed question ids: $REGRESSION_IDS"
              echo
              printf '%s\n' "A follow-up job of this workflow run starts the \"Approved answers on private data\" check on this branch. A comment on this pull request says it started, or says it could not and how to run it by hand. Merge only when it passes."
              echo
              cat "$RUNNER_TEMP/result.json"
            } > "$RUNNER_TEMP/pr-body.md"
            body_file="$RUNNER_TEMP/pr-body.md"
            title_prefix="ANSWERS REGRESS: "
          else
            body_file="$RUNNER_TEMP/result.json"
            title_prefix=
          fi
          if [ "$PR_MODE" = open ]; then
            if [ "$REGRESSED" = true ]; then
              if ! gh pr ready --undo "$EXISTING_PR_URL"; then
                echo "::error::The signal branch is already pushed. Updating ${EXISTING_PR_URL} failed."
                exit 1
              fi
              if ! title_json="$(gh pr view "$EXISTING_PR_URL" --json title)"; then
                echo "::error::The signal branch is already pushed. Updating ${EXISTING_PR_URL} failed."
                exit 1
              fi
              decision="$(printf '%s\n' "$title_json" | python -I -c 'import json,sys; title=json.load(sys.stdin)["title"]; prefix="ANSWERS REGRESS: "; print("keep" if title.startswith(prefix) else prefix + title)')"
              if [ "$decision" != keep ]; then
                if ! gh pr edit "$EXISTING_PR_URL" --title "$decision"; then
                  echo "::error::The signal branch is already pushed. Updating ${EXISTING_PR_URL} failed."
                  exit 1
                fi
              fi
              if ! gh pr comment "$EXISTING_PR_URL" --body-file "$body_file"; then
                echo "::error::The signal branch is already pushed. Updating ${EXISTING_PR_URL} failed."
                exit 1
              fi
            else
              gh pr comment "$EXISTING_PR_URL" --body-file "$body_file"
            fi
            pr_url="$EXISTING_PR_URL"
          elif [ "$HUMAN" = true ]; then
            pr_url="$(gh pr create --draft --head "$BRANCH" --label new-model \
              --title "${title_prefix}data: add or identify $model_id (MODEL-113)" \
              --body-file "$body_file")"
          elif [ "$REGRESSED" = true ]; then
            pr_url="$(gh pr create --draft --head "$BRANCH" \
              --title "${title_prefix}data: refresh $model_id release evidence (MODEL-113)" \
              --body-file "$body_file")"
          else
            pr_url="$(gh pr create --head "$BRANCH" \
              --title "data: refresh $model_id release evidence (MODEL-113)" \
              --body-file "$body_file")"
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Name the pushed branch for the recall dispatch
        id: recall_branch
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          FALLBACK_MESSAGE: 'The "Approved answers on private data" check could not be started automatically. Run it by dispatching "Private production-data recall" on this branch (or close and reopen the pull request) and merge only when it passes.'
        run: |
          branch="${BRANCH:-}"
          if [[ "$branch" =~ ^data/release-signal-[A-Za-z0-9._-]{1,150}-[0-9]{1,3}$ ]] && [[ "$branch" != *..* ]]; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            # The dispatch job never sees this name, so say here that the check was not started.
            echo "::warning::The pushed branch is not one this workflow names, so no recall check is dispatched for it. The fallback text is posted on the pull request."
            gh pr comment "$PR_URL" --body "$FALLBACK_MESSAGE" \
              || echo "::warning::The fallback comment could not be posted either."
          fi
      - name: Upload the score-only audit table
        if: steps.classify.outputs.score_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-signal-audit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
          overwrite: true
      - name: Acknowledge the signal and schedule its 1, 7, and 30 day re-checks
        if: steps.classify.outputs.resolution != 'empty'
        env:
          RESULT_URL: ${{ steps.pr.outputs.url || steps.closed_pr.outputs.url || matrix.work.pr_url || '' }}
          MODELSPEC_SIGNALS_READ_KEY: ${{ secrets.MODELSPEC_SIGNALS_READ_KEY }}
        run: |
          python -I - "$RUNNER_TEMP/ack.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = json.load(open(os.environ["RUNNER_TEMP"] + "/result.json"))
          acknowledgement = {
              "signal_id": result["signal_id"],
              "result": result["status"],
              "pr_url": os.environ["RESULT_URL"] or None,
          }
          if result.get("recheck_day"):
              acknowledgement["recheck_day"] = result["recheck_day"]
              acknowledgement["recheck_due"] = result["recheck_due"]
          Path(sys.argv[1]).write_text(json.dumps(acknowledgement))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $MODELSPEC_SIGNALS_READ_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/ack.json" \
            "$SIGNALS_ORIGIN/v1/signals/ack"
    defaults:
      run:
        working-directory: data
  review:
    name: Open one identity-review issue
    needs: [pending, process]
    if: always() && needs.pending.result == 'success' && needs.pending.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Prepare the private review label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create new-model --color 0E8A16 --description 'Release identity needs human review' --force
      - name: Download signal results
        uses: actions/download-artifact@v4
        with:
          pattern: release-signal-result-*
          path: ${{ runner.temp }}/signal-results
      - name: Open one issue for uncertain identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/signal-results"
          find "$RUNNER_TEMP/signal-results" -type f -name '*.json' | sort > "$RUNNER_TEMP/result-files.txt"
          if [ ! -s "$RUNNER_TEMP/result-files.txt" ]; then
            exit 0
          fi
          files=()
          while IFS= read -r path; do
            files+=("$path")
          done < "$RUNNER_TEMP/result-files.txt"
          jq -s 'map(select(.status == "uncertain") | {signal_id, reason})' "${files[@]}" > "$RUNNER_TEMP/uncertain.json"
          jq -s 'map(select(.status == "closed_unmerged") | {signal_id, reason, pr_url})' "${files[@]}" > "$RUNNER_TEMP/closed-unmerged.json"
          uncertain_count="$(jq 'length' "$RUNNER_TEMP/uncertain.json")"
          closed_count="$(jq 'length' "$RUNNER_TEMP/closed-unmerged.json")"
          if [ "$uncertain_count" -eq 0 ] && [ "$closed_count" -eq 0 ]; then
            exit 0
          fi
          today="$(date -u +%F)"
          {
            if [ "$uncertain_count" -ne 0 ]; then
              echo "Signals whose identity could not be resolved."
              echo
              jq -r '.[] | "- \(.signal_id): \(.reason)"' "$RUNNER_TEMP/uncertain.json"
            fi
            if [ "$closed_count" -ne 0 ]; then
              if [ "$uncertain_count" -ne 0 ]; then
                echo
              fi
              echo "New-model pull requests closed without merge"
              echo
              jq -r '.[] | "- \(.signal_id): \(.reason)\(if .pr_url then " (\(.pr_url))" else "" end)"' "$RUNNER_TEMP/closed-unmerged.json"
            fi
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create \
            --title "release signals needing identity review ($today)" \
            --label new-model \
            --body-file "$RUNNER_TEMP/issue-body.md"
  recall-dispatch:
    # MODEL-476: a pull request opened with the repository token starts no pull_request
    # workflow, so this job starts the recall check on the branch. It alone holds
    # the actions write permission. It has no checkout, runs no script from a working tree, and its
    # only input is the pattern-checked branch name from the writer job's output.
    name: Start the recall check on the pull request branch
    needs: process
    if: ${{ !cancelled() && needs.process.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch the recall workflow on the pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECALL_WORKFLOW: recall-private.yml
          BRANCH_PATTERN: '^data/release-signal-[A-Za-z0-9._-]{1,150}-[0-9]{1,3}$'
          BRANCHES: ${{ needs.process.outputs.branch_0 }} ${{ needs.process.outputs.branch_1 }} ${{ needs.process.outputs.branch_2 }} ${{ needs.process.outputs.branch_3 }} ${{ needs.process.outputs.branch_4 }} ${{ needs.process.outputs.branch_5 }} ${{ needs.process.outputs.branch_6 }} ${{ needs.process.outputs.branch_7 }} ${{ needs.process.outputs.branch_8 }} ${{ needs.process.outputs.branch_9 }}
          STARTED_MESSAGE: 'The "Approved answers on private data" check was started on this branch by the workflow run that opened this pull request. Merge only when it passes.'
          FALLBACK_MESSAGE: 'The "Approved answers on private data" check could not be started automatically. Run it by dispatching "Private production-data recall" on this branch (or close and reopen the pull request) and merge only when it passes.'
        run: |
          set -u
          failed=0
          read -r -a names <<< "$BRANCHES"
          for branch in "${names[@]}"; do
            if [ "${#branch}" -gt 200 ] || [[ "$branch" == *..* ]] || ! [[ "$branch" =~ $BRANCH_PATTERN ]]; then
              echo "::error::A branch name did not match this writer's branch pattern. Nothing was dispatched for it."
              failed=1
              continue
            fi
            if gh workflow run "$RECALL_WORKFLOW" --ref "$branch"; then
              echo "Started $RECALL_WORKFLOW on $branch." >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$STARTED_MESSAGE" ]; then
                gh pr comment "$branch" --body "$STARTED_MESSAGE" \
                  || echo "::warning::The check was started but the pull request comment could not be posted."
              fi
            else
              echo "::warning::Could not dispatch $RECALL_WORKFLOW on $branch. The fallback text is posted on the pull request."
              gh pr comment "$branch" --body "$FALLBACK_MESSAGE" \
                || echo "::warning::The fallback comment could not be posted either."
              failed=1
            fi
          done
          exit "$failed"
'on':
  workflow_dispatch: null
