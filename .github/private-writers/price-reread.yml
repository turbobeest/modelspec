                  exit 1
                  ;;
              esac
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install fallback dependencies
        run: python -I -m pip install pydantic pyyaml httpx
      - name: Download rendered pages
        uses: actions/download-artifact@v4
        with:
          name: price-reread-rendered
          path: ${{ runner.temp }}/rendered
      - name: Restore this UTC month's fallback ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: price-reread.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_SCHEDULE: schedule
          EVENT_DISPATCH: workflow_dispatch
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/firecrawl-ledger"
          mkdir -p "$ledger"
          month="$(date -u +%Y-%m-01)"
          ids="$(gh api --paginate "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&per_page=100&created=>=${month}" \
            --jq '.workflow_runs[] | select(.id < (env.CURRENT_RUN_ID | tonumber) and .head_branch == "main" and (.event == env.EVENT_SCHEDULE or .event == env.EVENT_DISPATCH)) | .id')"
          while read -r id; do
            [ -n "$id" ] || continue
            [[ "$id" =~ ^[0-9]+$ ]]
            mkdir -p "$ledger/$id"
            name="$(gh api --paginate "repos/${REPO}/actions/runs/${id}/artifacts" \
              --jq '.artifacts[] | select(.name == "price-reread-fallback" and (.expired | not)) | .name')"
            if [ -n "$name" ]; then
              gh run download "$id" --repo "$REPO" \
                --name price-reread-fallback --dir "$ledger/$id" \
                || echo "::notice::unreadable fallback ledger for run $id; reserve 12 credits"
            fi
          done <<< "$ids"
      - name: Fetch only failed eligible pages
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -I -m scripts.price_reread --fallback-from-render "$RUNNER_TEMP/rendered" --fallback-to "$RUNNER_TEMP/fallback" --fallback-ledger "$RUNNER_TEMP/firecrawl-ledger"
      - name: Retain fallback pages and monthly spend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-reread-fallback
          path: ${{ runner.temp }}/fallback
          retention-days: 35
          if-no-files-found: warn
    defaults:
      run:
        working-directory: data
  reread:
    name: Re-read price and plan pages
    needs: [render, fallback]
    if: always() && needs.render.result == 'success' && (needs.fallback.result == 'success' || needs.fallback.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Keep retained copies outside the checkout
        run: echo "MODELSPEC_SOURCE_CACHE=$RUNNER_TEMP/source-copies" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Link the data paths into the verified engine and put only the engine on the import path
        working-directory: .
        run: |
          set -euo pipefail
          if [ -L data ]; then
            echo "::error::refusing symlink data"
            exit 1
          fi
          if [ ! -d data/models ] || [ -L data/models ]; then
            echo "::error::data/models is missing"
            exit 1
          fi
          if [ ! -d data/benchmarks ] || [ -L data/benchmarks ]; then
            echo "::error::data/benchmarks is missing"
            exit 1
          fi
          paths="$(python -I engine/pipeline/data_source.py paths)"
          if [ -z "$(printf '%s' "$paths" | tr -d '[:space:]')" ]; then
            echo "::error::data paths are empty"
            exit 1
          fi
          while IFS= read -r P; do
            [ -n "$P" ] || continue
            prefix=data
            IFS=/ read -r -a parts <<< "$P"
            for part in "${parts[@]}"; do
              [ -n "$part" ] || continue
              prefix="$prefix/$part"
              if [ -L "$prefix" ]; then
                echo "::error::refusing symlink $prefix"
                exit 1
              fi
            done
            if [ -e "data/$P" ]; then
              resolved="$(realpath -e "data/$P")"
              case "$resolved/" in
                "$GITHUB_WORKSPACE/data/"*) ;;
                *)
                  echo "::error::data/$P resolves outside the data checkout ($resolved)"
                  exit 1
                  ;;
              esac
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install re-read dependencies
        run: |
          python -I -m pip install pydantic pyyaml httpx
      - name: Restore last week's retained copies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: price-reread.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_SCHEDULE: schedule
          EVENT_DISPATCH: workflow_dispatch
        run: |
          mkdir -p "$MODELSPEC_SOURCE_CACHE"
          run_id=""
          ids="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&per_page=20" \
            --jq '.workflow_runs[] | select(.id != (env.CURRENT_RUN_ID | tonumber) and .head_branch == "main" and (.event == env.EVENT_SCHEDULE or .event == env.EVENT_DISPATCH)) | .id')"
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api "repos/${REPO}/actions/runs/${id}/artifacts" \
              --jq '.artifacts[] | select(.name == "price-reread-copies" and (.expired | not)) | .name' \
              | grep -q .; then
              run_id="$id"
              break
            fi
          done <<< "$ids"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$REPO" \
              --name price-reread-copies --dir "$MODELSPEC_SOURCE_CACHE" \
              || echo "::notice::could not restore the copies from run $run_id"
          fi
      - name: Download rendered pages
        uses: actions/download-artifact@v4
        with:
          name: price-reread-rendered
          path: ${{ runner.temp }}/rendered
      - name: Download fallback pages when present
        if: needs.fallback.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: price-reread-fallback
          path: ${{ runner.temp }}/fallback
      - name: Re-read every page once
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FALLBACK_RESULT: ${{ needs.fallback.result }}
        run: |
          args=(--rendered-from "$RUNNER_TEMP/rendered" --report-json "$RUNNER_TEMP/report.json" --report-md "$RUNNER_TEMP/report.md" --retain-only-cited)
          if [ "$FALLBACK_RESULT" = "success" ]; then
            args+=(--fallback-from "$RUNNER_TEMP/fallback")
          fi
          if [ "$DRY_RUN" != "true" ]; then
            args+=(--write)
          fi
          python -I -m scripts.price_reread "${args[@]}" > /dev/null
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Count changes and alerts
        id: result
        run: |
          python -I - "$RUNNER_TEMP/report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          with open(sys.argv[2], "a") as out:
              print(f"changes={len(report['changes'])}", file=out)
              print(f"reconfirmed={len(report['reconfirmed'])}", file=out)
              print(f"alerts={len(report['alerts'])}", file=out)
          PY
      - name: Keep this week's copies for next week's diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-reread-copies
          path: ${{ runner.temp }}/source-copies
          retention-days: 35
          if-no-files-found: ignore
      - name: Prepare the pull-request body
        if: inputs.dry_run != true && steps.result.outputs.changes != '0'
        run: |
          {
            echo 'The weekly re-read found values that no longer match their pages. Each new value below was read by the verifier'"'"'s deterministic readers from a fresh copy of the page, and the verifier confirmed it. Both of those keys are code in this repository, so check the source diff before merging. This pull request is never auto-merged.'
            echo
            # A pull-request body holds at most 65,536 characters.
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/pr-body.md"
      - name: Open the re-read pull request
        if: inputs.dry_run != true && steps.result.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data/weekly-price-reread
          delete-branch: true
          add-paths: |
            offerings/**
            verification/log.jsonl
            verification/queue/events.jsonl
          signoff: true
          commit-message: |-
            data: re-read prices and plans (MODEL-217)

            Co-Authored-By: Codex (GPT-6.1 Sol) <noreply@openai.com>
          title: 'data: re-read prices and plans (MODEL-217)'
          body-path: ${{ runner.temp }}/pr-body.md
          path: data
      - name: Prove a no-change run only appended to the verification log
        id: reconfirm
        if: inputs.dry_run != true && steps.result.outputs.changes == '0' && steps.result.outputs.reconfirmed != '0'
        run: |
          changed="$(git status --porcelain -- offerings verification)"
          if [ "$changed" != " M verification/log.jsonl" ]; then
            echo "::error::a run with no value change touched more than the log:"
            echo "$changed"
            exit 1
          fi
          if git diff --numstat verification/log.jsonl | awk '$2 != 0 { bad = 1 } END { exit !bad }'; then
            echo "::error::the log was edited, not appended to"
            exit 1
          fi
          echo "log_only=true" >> "$GITHUB_OUTPUT"
      - name: Open the reconfirmation pull request
        if: steps.reconfirm.outputs.log_only == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data/weekly-price-reconfirm
          delete-branch: true
          add-paths: verification/log.jsonl
          signoff: true
          commit-message: |-
            data: reconfirm prices and plans (MODEL-217)

            Co-Authored-By: Codex (GPT-6.1 Sol) <noreply@openai.com>
          title: 'data: reconfirm prices and plans (MODEL-217)'
          body-path: ${{ runner.temp }}/report.md
          path: data
      - name: Open or update the alert issue
        if: inputs.dry_run != true && steps.result.outputs.alerts != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Price and plan re-read needs a person
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/issue-body.md"
          # One open issue collects every week's alerts.
          number="$(gh issue list --repo "${{ github.repository }}" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
          fi
      - name: Fail a run with alerts
        if: steps.result.outputs.alerts != '0'
        env:
          ALERTS: ${{ steps.result.outputs.alerts }}
        run: |
          echo "::error::${ALERTS} price or plan facts could not be re-read; see the run summary."
          exit 1
    defaults:
      run:
        working-directory: data
'on':
  schedule:
    - cron: 41 7 * * 2
  workflow_dispatch:
