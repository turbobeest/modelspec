name: Weekly data trust audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-data-trust-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Link the data paths into the verified engine and put only the engine on the import path
        working-directory: .
        run: |
          set -euo pipefail
          if [ -L data ]; then
            echo "::error::refusing symlink data"
            exit 1
          fi
          if [ ! -d data/models ] || [ -L data/models ]; then
            echo "::error::data/models is missing"
            exit 1
          fi
          if [ ! -d data/benchmarks ] || [ -L data/benchmarks ]; then
            echo "::error::data/benchmarks is missing"
            exit 1
          fi
          paths="$(python -I engine/pipeline/data_source.py paths)"
          if [ -z "$(printf '%s' "$paths" | tr -d '[:space:]')" ]; then
            echo "::error::data paths are empty"
            exit 1
          fi
          while IFS= read -r P; do
            [ -n "$P" ] || continue
            prefix=data
            IFS=/ read -r -a parts <<< "$P"
            for part in "${parts[@]}"; do
              [ -n "$part" ] || continue
              prefix="$prefix/$part"
              if [ -L "$prefix" ]; then
                echo "::error::refusing symlink $prefix"
                exit 1
              fi
            done
            if [ -e "data/$P" ]; then
              resolved="$(realpath -e "data/$P")"
              case "$resolved/" in
                "$GITHUB_WORKSPACE/data/"*) ;;
                *)
                  echo "::error::data/$P resolves outside the data checkout ($resolved)"
                  exit 1
                  ;;
              esac
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install audit dependencies
        run: python -I -m pip install 'pydantic>=2,<3' pyyaml httpx 'pyarrow>=14'
      - name: Choose the UTC report date and ISO week seed
        id: date
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "seed=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Audit invariants and re-read sixty sampled claims
        id: audit
        continue-on-error: true
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
          REPORT_SEED: ${{ steps.date.outputs.seed }}
        run: |
          python -I -m scripts.data_trust run --data-dir . --n 60 \
            --date "$REPORT_DATE" --seed "$REPORT_SEED" \
            --output-dir reports/data-trust --defect-log reports/data-trust/defects.jsonl \
            --summary-only > "$RUNNER_TEMP/data-trust-summary.txt"
      - name: Publish aggregate counts and prepare the report PR
        id: counts
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
        run: |
          python -I - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.data_trust.report import summary
          day = os.environ['REPORT_DATE']
          report = json.loads(Path(f'reports/data-trust/{day}.json').read_text())
          aggregate = summary(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(aggregate)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"errors={report['invariants']['errors']}\n")
          body = (
              f'Weekly data trust audit for {day} (MODEL-267).\n\n' + aggregate + '\n'
              f'Full private report: `reports/data-trust/{day}.md` and `.json`. '
              'Every finding is retained in the dated `.findings.jsonl.gz`; '
              'defects are an append-only stream in `defects*.jsonl`. '
              'Unreadable claims are excluded from the Wilson interval. '
              'This sample cannot establish five-nines accuracy.\n\n'
              'Served-tier invariant errors fail the job after this PR is created. '
              'Legacy provenance gaps, reader gaps, source mismatches and unreadable sources do not fail it. '
              'Guard assignments remain null until preventive fixes are tested. '
              'A human reviews and merges this PR.\n'
          )
          Path(os.environ['RUNNER_TEMP'], 'data-trust-pr.md').write_text(body)
          PY
      - name: Open the private report pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: data
          branch: data/data-trust-${{ steps.date.outputs.date }}
          delete-branch: true
          add-paths: reports/data-trust/**
          commit-message: |-
            data: weekly trust audit (MODEL-267)

            Co-Authored-By: GPT-6.1 Sol <noreply@openai.com>
          title: 'data: trust audit for ${{ steps.date.outputs.date }} (MODEL-267)'
          body-path: ${{ runner.temp }}/data-trust-pr.md
      - name: Fail on served invariant errors after retaining the report
        if: steps.counts.outputs.errors != '0'
        run: |
          echo '::error::Served invariant errors found. The private report PR contains the findings.'
          exit 1
