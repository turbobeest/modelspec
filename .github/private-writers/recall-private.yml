name: Private production-data recall

on:
  pull_request:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recall-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recall:
    name: Approved answers on private data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
      PYTHONPATH: ${{ github.workspace }}/data
    defaults:
      run:
        working-directory: data
    steps:
      - name: Check out private data
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Refuse an engine pin older than the base branch pin
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PIN: ${{ steps.engine_pin.outputs.sha }}
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/engine-pin-check"
          git -C data cat-file -e "$BASE_SHA^{commit}"
          if ! git -C data cat-file -e "$BASE_SHA:.engine-pin" 2>/dev/null; then
            # The base predates .engine-pin; this PR introduces it.
            exit 0
          fi
          base_pin="$(git -C data cat-file blob "$BASE_SHA:.engine-pin")"
          if ! [[ "$base_pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The base branch .engine-pin is not one full commit SHA.'
            exit 1
          fi
          if ! git -C "$check" merge-base --is-ancestor "$base_pin" "$PIN"; then
            echo "::error::.engine-pin $PIN does not descend from the base pin $base_pin."
            exit 1
          fi
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse code and symlinks in linked data paths
        working-directory: .
        run: python -I data/.github/scripts/check_linked_data.py --engine engine --data data
      - name: Compose engine code with private data
        run: python ../engine/scripts/prepare_data_writer.py --engine ../engine --data .
      - name: Install engine dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check public writer mirrors
        working-directory: .
        run: |
          set -euo pipefail
          mirrors="$RUNNER_TEMP/public-writer-mirrors"
          git clone --quiet --depth 1 --filter=blob:none --sparse --single-branch --branch main --no-tags \
            https://github.com/turbobeest/modelspec.git "$mirrors"
          git -C "$mirrors" sparse-checkout set .github/private-writers
          python -I data/.github/scripts/check_writer_mirrors.py \
            --mirrors "$mirrors/.github/private-writers" --workflows data/.github/workflows
      - name: Run broader data tests
        run: |
          python -m pytest -q .github/scripts/tests \
            tests/test_decision_sources.py tests/test_decision_verify.py \
            tests/test_decision_model.py tests/test_decision_snapshot.py \
            tests/test_subscription_availability.py \
            tests/test_subscription_availability_reader.py tests/test_slice1_offerings.py
      - name: Load the private merge-base baseline
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          if git cat-file -e "$merge_base:reports/recall/baseline.json" 2>/dev/null; then
            git show "$merge_base:reports/recall/baseline.json" \
              > "$RUNNER_TEMP/approved-private-recall.json"
          else
            # The first baseline is seeded and reviewed in this PR.
            cp reports/recall/baseline.json "$RUNNER_TEMP/approved-private-recall.json"
          fi
      - name: Score the approved answers on private data
        run: |
          if ! python scripts/recall_run.py --root "$PWD" \
            --output-dir "$RUNNER_TEMP/private-recall" \
            > "$RUNNER_TEMP/private-recall.log" 2>&1; then
            echo '::error::Private recall did not complete.'
            exit 1
          fi
      - name: Compare private baselines and summarise aggregate verdicts
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            args=(--approved-baseline "$RUNNER_TEMP/approved-private-recall.json")
          fi
          python reports/recall/check.py \
            --report-dir "$RUNNER_TEMP/private-recall" \
            --baseline reports/recall/baseline.json \
            --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
  # MODEL-476: GitHub does not count the check run of a workflow_dispatch run in a pull
  # request's checks, but a commit status posted through the REST API counts. These two
  # jobs run only for workflow_dispatch and are the only jobs here that may write
  # commit statuses. The recall job above runs code from the branch under test and holds
  # no write permission. A job-level `permissions` block replaces the workflow-level one,
  # so these jobs hold nothing else (no `contents`). They have no checkout, no `uses:`, no
  # secret, and read their inputs only through `env:`.
  status-pending:
    name: Report the started check as a commit status
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CONTEXT: Approved answers on private data
        run: |
          set -euo pipefail
          : "${SHA:?}" "${REPO:?}" "${RUN_ID:?}" "${CONTEXT:?}"
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=pending \
            -f context="$CONTEXT" \
            -f description='Started by a writer workflow on this branch head; the run is in progress.' \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
  status-final:
    name: Report the recall result as a commit status
    needs: [status-pending, recall]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the final status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CONTEXT: Approved answers on private data
          RECALL_RESULT: ${{ needs.recall.result }}
        run: |
          set -euo pipefail
          : "${SHA:?}" "${REPO:?}" "${RUN_ID:?}" "${CONTEXT:?}"
          # Only an exact "success" is a success. Every other value, including an empty or
          # unknown one, is an error or a failure; a status is never left pending.
          case "${RECALL_RESULT:-}" in
            success)
              state=success
              description='The approved answers hold on private data.'
              ;;
            failure)
              state=failure
              description='The approved answers did not hold on private data, or the run failed.'
              ;;
            cancelled)
              state=error
              description='The recall run was cancelled before it finished.'
              ;;
            skipped)
              state=error
              description='The recall run was skipped and did not finish.'
              ;;
            *)
              state=error
              description='The recall result could not be read.'
              ;;
          esac
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="$CONTEXT" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
