            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install dependencies
        run: python -I -m pip install pyyaml pydantic
      - name: Download change report
        uses: actions/download-artifact@v4
        with:
          name: curation-change-report-${{ env.AXIS }}-${{ github.run_id }}
          path: data/benchmarks/_curation/reports/
      - name: Open or comment on one issue per page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python -I -m scripts.curation.ci issues --apply --repo "$REPO" --report benchmarks/_curation/reports/change_report.json
    defaults:
      run:
        working-directory: data
'on':
  workflow_dispatch:
    inputs:
      axis:
        description: benchmarks (models is reserved for MODEL-5)
        type: choice
        options:
          - benchmarks
        default: benchmarks
      pages:
        description: pilot | all | comma-separated page ids
        type: string
        default: pilot
      immediate_brief:
        description: optional page id or URL to watch right now (overrides pages)
        type: string
        default: ''
