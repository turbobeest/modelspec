# MODEL-247: install in modelspec-data. This directory is not an Actions workflow directory.
name: Curation watcher
permissions:
  contents: read
concurrency:
  group: curation-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    name: Trial gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Link the data paths into the verified engine and put only the engine on the import path
        working-directory: .
        run: |
          set -euo pipefail
          paths="$(python -I engine/pipeline/data_source.py paths)"
          while IFS= read -r P; do
            [ -n "$P" ] || continue
            if [ -L "data/$P" ]; then
              echo "::error::data/$P is a symlink"
              exit 1
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install dependencies
        run: python -I -m pip install pyyaml pydantic
      - name: Decide whether this run proceeds
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python -I -m scripts.curation.ci gate --event "$EVENT" --schedule "$SCHEDULE" | tee -a "$GITHUB_OUTPUT"
      - name: Record the gate decision
        env:
          RUN: ${{ steps.gate.outputs.run }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${RUN:-}" ]; then
            echo "::error::The trial gate produced no run= decision. Failing the workflow instead of silently skipping every downstream job."
            exit 1
          fi
          {
            echo "### Trial gate: run=${RUN}"
            echo ""
            echo "Reason: ${REASON:-(none reported)}"
          } >> "$GITHUB_STEP_SUMMARY"
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    defaults:
      run:
        working-directory: data
  watch:
    name: Watch sources
    needs: gate
    permissions:
      contents: read
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      has_work: ${{ steps.plan.outputs.has_work }}
      has_dead: ${{ steps.plan.outputs.has_dead }}
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      AXIS: ${{ inputs.axis || 'benchmarks' }}
      PAGES: ${{ inputs.pages || 'pilot' }}
      BRIEF: ${{ inputs.immediate_brief || '' }}
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
