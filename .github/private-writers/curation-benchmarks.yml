              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install dependencies
        run: python -I -m pip install pyyaml pydantic
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.267
      - name: Download change report
        uses: actions/download-artifact@v4
        with:
          name: curation-change-report-${{ env.AXIS }}-${{ github.run_id }}
          path: data/benchmarks/_curation/reports/
      - name: Draft each change (claude -p, no tools, untrusted source)
        if: needs.watch.outputs.has_changes == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty; run claude setup-token and store it as a repo secret."
            exit 1
          fi
          python -I -m scripts.curation.ci draft --drafter claude --report benchmarks/_curation/reports/change_report.json
      - name: Open draft PRs (one per changed page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty."
            exit 1
          fi
          [ -f benchmarks/_curation/reports/drafts.json ] || echo '[]' > benchmarks/_curation/reports/drafts.json
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git config --local user.name "modelspec-curation"
          git config --local user.email "curation@modelspec.dev"
          git fetch --no-tags origin main
          python -I -m scripts.curation.propose --manifest benchmarks/_curation/reports/drafts.json \
            --leads benchmarks/_curation/reports/change_report.json --repo "$REPO" --open-prs
          git config --local --unset-all http.https://github.com/.extraheader
    defaults:
      run:
        working-directory: data
  issues:
    name: Dead-leaderboard issues
    needs: watch
    if: needs.watch.outputs.has_dead == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      AXIS: ${{ inputs.axis || 'benchmarks' }}
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
