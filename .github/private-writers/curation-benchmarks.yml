          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          pin="$(< data/.engine-pin)"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::.engine-pin must hold exactly one full 40-character lowercase commit SHA.'
            exit 1
          fi
          check="$RUNNER_TEMP/engine-pin-check"
          rm -rf "$check"
          git clone --quiet --bare --filter=tree:0 --single-branch --branch main --no-tags \
            "$ENGINE_REPO" "$check"
          if ! git -C "$check" cat-file -e "$pin^{commit}" 2>/dev/null \
            || ! git -C "$check" merge-base --is-ancestor "$pin" refs/heads/main; then
            echo "::error::.engine-pin $pin is not a commit on modelspec main."
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned public engine
        uses: actions/checkout@v4
        with:
          repository: turbobeest/modelspec
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: engine
          persist-credentials: false
      - name: Confirm the engine checkout is the verified pin
        env:
          PIN: ${{ steps.engine_pin.outputs.sha }}
        run: test "$(git -C ../engine rev-parse HEAD)" = "$PIN"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Link the data paths into the verified engine and put only the engine on the import path
        working-directory: .
        run: |
          set -euo pipefail
          paths="$(python -I engine/pipeline/data_source.py paths)"
          while IFS= read -r P; do
            [ -n "$P" ] || continue
            if [ -L "data/$P" ]; then
              echo "::error::data/$P is a symlink"
              exit 1
            fi
            if [ -d "data/$P" ]; then
              bad="$(find "data/$P" -mindepth 1 \( -type l -o \( -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.pth' -o -name '*.so' -o -name 'sitecustomize*' -o -name 'usercustomize*' -o -name '__init__*' -o -name 'conftest*' \) \) \) -print -quit)"
              if [ -n "$bad" ]; then
                echo "::error::refusing $bad"
                exit 1
              fi
            fi
            rm -rf "engine/$P"
            if [ -e "data/$P" ]; then
              mkdir -p "$(dirname "engine/$P")"
              ln -s "$GITHUB_WORKSPACE/data/$P" "engine/$P"
            fi
          done <<< "$paths"
          purelib="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          quoted="$(python -I -c 'import json, pathlib; print(json.dumps(str(pathlib.Path("engine").resolve())))')"
          mkdir -p "$purelib"
          printf 'import sys; sys.path.insert(0, %s)\n' "$quoted" > "$purelib/modelspec-engine.pth"
      - name: Install dependencies
        run: python -I -m pip install pyyaml pydantic
      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: data/benchmarks/_curation/state
          key: curation-state-${{ env.AXIS }}-${{ github.run_id }}
          restore-keys: curation-state-${{ env.AXIS }}-
      - name: Run watcher and classifier (Firecrawl cap 10, plain HTTP if no key)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$BRIEF" ]; then
            python -I -m scripts.curation.watch --axis "$AXIS" --immediate-brief "$BRIEF" --firecrawl-credit-cap 10 --firecrawl-key-from-env
          else
            python -I -m scripts.curation.watch --axis "$AXIS" --pages "$PAGES" --firecrawl-credit-cap 10 --firecrawl-key-from-env
          fi
          cat benchmarks/_curation/reports/change_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Plan follow-up jobs
        id: plan
        run: |
          set -euo pipefail
          python -I -m scripts.curation.ci plan --report benchmarks/_curation/reports/change_report.json | tee -a "$GITHUB_OUTPUT"
      - name: Upload change report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curation-change-report-${{ env.AXIS }}-${{ github.run_id }}
          path: data/benchmarks/_curation/reports/
    defaults:
      run:
        working-directory: data
  draft:
    name: Draft and propose
    needs: watch
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.watch.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      MODELSPEC_REQUIRE_DATA_DIR: '1'
      AXIS: ${{ inputs.axis || 'benchmarks' }}
      MODELSPEC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: data
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Verify the engine pin is on modelspec main
        id: engine_pin
        working-directory: .
        env:
          ENGINE_REPO: https://github.com/turbobeest/modelspec.git
