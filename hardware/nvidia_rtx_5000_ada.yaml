notes: 'NVIDIA RTX 5000 Ada Generation datasheet (AUG 23): 32 GB GDDR6, 256-bit, 576
  GB/s, PCIe 4.0 x16, total board power 250 W, 12,800 CUDA cores. Product page lists
  32 GB GDDR6 ECC and 250 W but not bandwidth; bandwidth and bus width are from the
  datasheet. Single-precision 65.3 TFLOPS is a qualified FP32 peak; Tensor 1044.4
  TFLOPS uses sparsity/FP8 and is not stored as compute.tflops. Distinct from the
  RTX 5000 Ada laptop GPU (16 GB, 576 GB/s on NVIDIA''s mobile line card) and from
  RTX 6000 Ada (48 GB, 960 GB/s). Month is not on the product spec table.'
