notes: 'AMD Instinct MI300X product page lists 192 GB HBM3, 8192-bit interface, 5.2 GHz
  memory clock, 5.3 TB/s peak bandwidth, OAM, PCIe 5.0 x16, 8 Infinity Fabric links at
  128 GB/s, launch date 12/06/2023, and Typical Board Power (TBP) 750 W. tdp_w records
  that published TBP. Derivation 8192/8 x 5.2 Gbps = 5324.8 GB/s; the page rounds to
  5.3 TB/s. Distinct from MI325X (256 GB HBM3E, 6 TB/s, 1000 W TBP).'
