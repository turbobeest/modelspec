id: nvidia_rtx_4070_ti_super
display_name: NVIDIA GeForce RTX 4070 Ti SUPER
vendor: nvidia
family: GeForce RTX 40
device_class: consumer
released: 2024-01
memory:
  capacity_gb: 16
  bandwidth_gb_s: 672
  type: GDDR6X
  bus_bits: 256
  unified_with_host: false
  bandwidth_derivation: 256 bits / 8 x 21 Gbps GDDR6X = 672 GB/s
precisions_native:
- fp16
- bf16
- fp8
- int8
- int4
interconnect:
  pcie_gen: 4
  link: none
  link_gb_s: null
power:
  tdp_w: 285
  sustained_differs_from_boost: false
sources:
- https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4070-family/
- https://nvidianews.nvidia.com/news/geforce-rtx-40-super-series
figures_are: vendor-specification
verified_at: 2026-09-09
notes: Capacity (16 GB GDDR6X), bus width (256-bit) and Total Graphics Power (285 W)
  from the RTX 4070 Family spec table (RTX 4070 Ti SUPER column). NVIDIA's CES 2024
  newsroom post states the 4070 Ti SUPER's 256-bit bus provides 672 GB/sec. That
  uniquely determines a 21 Gbps data rate (672 / (256/8)). Do not use the non-SUPER
  4070 Ti (12 GB, 192-bit) figures for this SKU.
