notes: Capacity (24 GB GDDR6), memory speed (up to 20 Gbps), memory bandwidth (up
  to 960 GB/s) and Typical Board Power (355 W) from the AMD product spec page. The
  product page does not list bus width; AMD's Radeon RX 7900 Series partner article
  lists a 384-bit memory interface. Bandwidth is derived as 384/8 x 20, matching
  the 960 GB/s figure on the product page.
