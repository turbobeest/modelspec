notes: 'NVIDIA Jetson Thor spec table, Jetson T5000 column: 128 GB 256-bit LPDDR5X
  at 273 GB/s; GPU 2560-core Blackwell with fifth-gen Tensor Cores; 14-core Neoverse-V3AE;
  power 40 W-130 W (130 W stored as the configurable maximum). AI performance is quoted
  as 2070 TFLOPS (FP4—Sparse) and is not stored as compute.tflops. Unified module
  memory. The Jetson AGX Thor Developer Kit uses this T5000 module and is not a separate
  row. Distinct from Jetson T4000 (64 GB, same 273 GB/s, 40 W-70 W). Month is not
  on the spec table.'
