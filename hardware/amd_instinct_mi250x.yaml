notes: 'Per-SKU record for MI250X, not MI250. AMD Instinct MI250X product page lists
  128 GB HBM2e, 8192-bit interface, 1.6 GHz memory clock, 3.2 TB/s, OAM module, 8 Infinity
  Fabric links at 100 GB/s, launch date 11/08/21, and TDP 500W | 560W. tdp_w records
  the higher published value. DISAGREEMENT: 8192/8 x 3.2 Gbps = 3276.8 GB/s; the product
  page publishes 3.2 TB/s. bandwidth_gb_s records the published 3.2 TB/s. Dual-GCD package;
  do not collapse with MI210 (single GCD, 64 GB) or MI250.'
