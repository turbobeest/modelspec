notes: 'NVIDIA Tesla P40 datasheet (Sep16): Pascal, 24 GB, 346 GB/s, PCIe 3.0 x16,
  max power 250 W, ECC. Single-precision 12 TFLOPS and INT8 47 TOPS are boost-clock
  peaks and are not stored as compute.tflops. The product brief (PB-08338-001) lists
  24 GB GDDR5, 384-bit I/O, and "up to 347 GB/s"; type GDDR5 is from that brief, bandwidth
  is the datasheet 346 GB/s rather than the brief''s rounded 347. Distinct from Tesla
  P4 (8 GB, 192 GB/s). No NVLink on this SKU. fp8/bf16 are not claimed.'
