notes: 'AMD Instinct MI355X product page lists 288 GB HBM3E, 8 TB/s, OAM, PCIe 5.0 x16,
  7 Infinity Fabric links at 153 GB/s, launch date 6/12/2025, and Typical Board Power
  (TBP) 1400 W. The MI355X GPU brochure also lists memory interface 8192 bits, 8 TB/s,
  and maximum TBP 1400 W. Memory clock / data rate is not on either source, so bandwidth
  is the published 8 TB/s rather than a derivation. Distinct from MI350X (same 288 GB /
  8 TB/s, lower clocks) and from MI325X (256 GB, 6 TB/s).'
