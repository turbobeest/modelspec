notes: 'NVIDIA Jetson Orin spec table, Jetson AGX Orin 32GB column: 32GB 256-bit LPDDR5
  at 204.8 GB/s; AI performance quoted as 241 TOPS with no precision on the main table
  (compute-comparison table lists 200 SPARSE INT8 TOPS); GPU 1792-core Ampere with 56
  Tensor Cores; 8-core Cortex-A78AE; power 15W-60W (60 W stored as the configurable
  maximum). TOPS is not stored as compute.tflops because the main-table figure is
  unqualified. Unified module memory. Distinct from AGX Orin 64GB (same 204.8 GB/s,
  64 GB, 2048-core). Launch year 2022 from NVIDIA positioning Orin as the generation
  after Xavier on this page; month is not on the table.'
