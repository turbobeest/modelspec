notes: 'Qualcomm Snapdragon X Elite product brief (DCN 87-71471-1 Rev C): LPDDR5x,
  transfer rate 8448 MT/s, capacity up to 64 GB, bandwidth 135 GB/s, 16-bit width,
  8 channels. 64 GB is Qualcomm''s published maximum; OEM capacity varies. Bandwidth
  is the vendor figure (derivation from the same brief''s channel, width and rate
  agrees at 135.168 GB/s). Hexagon NPU "up to 45 TOPS" and Adreno GPU "up to 4.6 TFLOPs"
  are not stored as compute rows (precision unspecified). TDP is not on the brief.
  Unified memory. Thin-chassis clocks differ from boost. The brief does not put a
  calendar month on the spec table; 2024 is the laptop-shipping year on Qualcomm''s
  product page generation. Distinct SKUs (X1E-84-100, X1E-80-100, X1E-78-100) share
  this memory subsystem. Native GPU/NPU precisions are not listed on the brief, so
  precisions_native is empty rather than guessed.'
