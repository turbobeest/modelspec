notes: 'Per-SKU record for H100 SXM. NVIDIA H100 product spec table lists 80GB, 3.35 TB/s,
  NVLink 900 GB/s, PCIe Gen5 128 GB/s, and TDP up to 700 W (configurable). The spec
  table does not name the memory generation; H100 PCIe is specified as HBM2e on the
  PCIe product brief, and the H200 product page describes H200 as the first GPU with
  HBM3e, so this SXM record uses HBM3. Distinct from H100 PCIe (80GB HBM2e, 2,000 GB/s,
  350 W) and from H100 NVL (94GB, 3.9 TB/s). Bus width is not on the product page,
  so bandwidth is the published 3.35 TB/s rather than a derivation.'
