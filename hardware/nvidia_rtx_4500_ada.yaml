notes: 'NVIDIA RTX 4500 Ada Generation datasheet (OCT23): 24 GB GDDR6, 192-bit, 432
  GB/s, PCIe 4.0 x16, total board power 210 W, 7,680 CUDA cores, no NVLink. Product
  page lists 24 GB GDDR6 ECC and 210 W but not bandwidth; bandwidth and bus width
  are from the datasheet. Single-precision 39.6 TFLOPS is a qualified FP32 peak; Tensor
  634.0 TFLOPS uses sparsity/FP8 and is not stored as compute.tflops. Distinct from
  RTX A4500 (Ampere) and from RTX 5000 Ada (32 GB, 576 GB/s). Month is not on the
  product spec table.'
