notes: 'Per-SKU record for H100 NVL, the PCIe dual-slot SKU on the current H100 product
  page. Spec table lists 94GB, 3.9 TB/s, NVLink 600 GB/s, PCIe Gen5, and TDP 350-400 W
  (configurable); tdp_w records the published maximum of that range. Distinct from
  original H100 PCIe (80GB HBM2e, 2,000 GB/s, 350 W) and from H100 SXM (80GB, 3.35 TB/s,
  700 W). Body copy also says 188GB HBM3 when two NVL cards are bridged; this file is
  the single card (94GB). Memory generation is not named in the spec table. Bus width
  is not published, so bandwidth is the transcribed 3.9 TB/s.'
