notes: 'Two GPU configurations with different bandwidth, one chip record (same convention
  as apple_m4_max). This record uses the 18-core CPU / 40-core GPU configuration at
  614 GB/s, the only one offering 48 GB, 64 GB or 128 GB. The 18-core CPU / 32-core
  GPU configuration is 460 GB/s and is sold only with 36 GB. Capacity options cover
  both configurations as sold. CPU: 6 super cores and 12 performance cores. Quotes:
  MacBook Pro specs "M5 Max with 18-core CPU and 40-core GPU (614GB/s memory bandwidth)",
  "M5 Max with 18-core CPU and 32-core GPU (460GB/s memory bandwidth)", "36GB (M5 Max
  with 32-core GPU)", "or 48GB (M5 Pro or M5 Max with 40-core GPU)", "or 64GB (M5 Pro
  with 20-core GPU or M5 Max with 40-core GPU)", "or 128GB (M5 Max with 40-core GPU)",
  "18-core CPU with 6 super cores and 12 performance cores"; Newsroom 2026-03-03 "availability
  beginning Wednesday, March 11". Apple does not publish a TDP or a DRAM generation.
  Sustained clocks differ from boost in thin chassis.'
