notes: 'NVIDIA Jetson Orin spec table, Jetson Orin Nano 8GB column: 8GB 128-bit LPDDR5
  at 102 GB/s (NVIDIA writes 102, not 102.4); AI performance quoted as 67 TOPS with
  no precision; GPU 1024-core Ampere with 32 Tensor Cores; 6-core Cortex-A78AE; power
  7W-25W (25 W stored as the configurable Super-mode maximum); PCIe Gen3. TOPS is not
  stored as compute.tflops because the precision is unspecified. Unified module memory.
  These are the Super Mode figures the current product table publishes; the original
  module rating was 68 GB/s / 15 W. The Orin Nano Super Developer Kit uses this 8GB
  module and is not a separate SKU. Launch year 2022 from NVIDIA positioning Orin as
  the generation after Xavier on this page; month is not on the table.'
