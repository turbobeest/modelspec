notes: Capacity (16 GB GDDR7), bus width (256-bit) and Total Graphics Power (360 W)
  from the RTX 5080 product spec table. Memory data rate is 30 Gbps GDDR7, not 28
  (that rate is the 5090); NVIDIA's RTX Blackwell GPU Architecture whitepaper states
  the 5080 ships with 30 Gbps GDDR7 delivering 960 GB/s (Table 4). Bandwidth is derived
  as 256/8 x 30.
