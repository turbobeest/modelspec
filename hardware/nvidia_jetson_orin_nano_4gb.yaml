notes: 'NVIDIA Jetson Orin spec table, Jetson Orin Nano 4GB column: 4GB 64-bit LPDDR5
  at 51 GB/s; AI performance quoted as 34 TOPS with no precision; GPU 512-core Ampere
  with 16 Tensor Cores; 6-core Cortex-A78AE; power 7W-10W-25W (25 W stored as the configurable
  Super-mode maximum); PCIe Gen3. TOPS is not stored as compute.tflops because the
  precision is unspecified. Unified module memory. These are the Super Mode figures
  the current product table publishes; the original module rating was 34 GB/s / 10 W.
