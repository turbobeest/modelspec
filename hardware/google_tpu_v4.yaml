notes: 'Per chip, not per pod. Google Cloud TPU v4 system-architecture table lists
  HBM2 capacity and bandwidth 32 GiB, 1200 GBps, and peak compute per chip 275 teraflops
  (bf16 or int8). A TPU v4 Pod is 4096 chips; this file is one chip. The same table
  lists measured min/mean/max power 90/170/192 W, which is measured power, not a published
  TDP, so tdp_w is null. Capacity is recorded as 32 GB from the published 32 GiB figure.'
