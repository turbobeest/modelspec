notes: 'NVIDIA DGX Spark product spec table: 128 GB LPDDR5x coherent unified system
  memory, 256-bit, 273 GB/s; GB10 TDP 140 W (footnote: chip TDP including CPU and
  GPU); 240 W external PSU. User guide repeats 128 GB LPDDR5x, 256-bit, 4266 MHz,
  273 GB/s and 16 channels LPDDR5X 8533. Tensor performance is "up to 1 PFLOP FP4"
  / "theoretical FP4 TOPS using the sparsity feature" and is not stored as compute.tflops.
  GB10 Grace Blackwell Superchip is the SoC in this system, not a separate row. NVLink-C2C
  is present; the spec table does not give a GB/s figure, so link_gb_s is null. ConnectX-7
  at 200 Gbps is host networking, not GPU-GPU NVLink. Distinct from Jetson T5000
  (also 128 GB / 273 GB/s LPDDR5X, edge module). Product page lists the 13 October
  2025 shipping announcement.'
