notes: 'NVIDIA RTX 6000 Ada Generation datasheet (FEB 23): 48GB GDDR6, 384-bit, 960
  GB/s, PCIe 4.0 x16, total board power 300 W, 18,176 CUDA cores. Product page lists
  48GB GDDR6 ECC and 300 W but not bandwidth; bandwidth and bus width are from the
  datasheet. Memory data rate 20.0 Gbps is from NVIDIA''s Ada GPU Architecture whitepaper
  comparison table (RTX 6000 Ada vs RTX A6000). Bandwidth is derived as 384/8 x 20.0.
  Single-precision 91.1 TFLOPS is a qualified FP32 peak; Tensor 1457 TFLOPS/TOPS is
  sparsity-using FP8 and is not stored as compute.tflops. No NVLink on this SKU (unlike
  RTX A6000). Distinct from RTX A6000 (Ampere, 768 GB/s).'
