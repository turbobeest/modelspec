  tdp_w: 300
  sustained_differs_from_boost: false
sources:
- https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a6000-datasheet.pdf
- https://images.nvidia.com/aem-dam/en-zz/Solutions/technologies/NVIDIA-ADA-GPU-PROVIZ-Architecture-Whitepaper_1.1.pdf
figures_are: vendor-specification
verified_at: 2026-09-11
notes: 'NVIDIA RTX A6000 datasheet (MAY22): 48GB GDDR6, 384-bit, 768 GB/s, PCIe 4.0
  x16, total board power 300 W, 10,752 CUDA cores, third-generation NVLink 112.5 GB/s
  bidirectional (two-GPU). Memory data rate 16 Gbps is from NVIDIA''s Ada GPU Architecture
  whitepaper comparison table (RTX A6000 column). Bandwidth is derived as 384/8 x 16.
  Single-precision 38.7 TFLOPS is a qualified FP32 peak; Tensor 309.7 TFLOPS uses
  sparsity and is not stored as compute.tflops. Distinct from RTX 6000 Ada Generation
  (48GB GDDR6 at 960 GB/s, no NVLink). Ampere; fp8 is not claimed on this datasheet.'
