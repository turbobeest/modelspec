id: nvidia_rtx_a6000
display_name: NVIDIA RTX A6000
vendor: nvidia
family: NVIDIA RTX Ampere
device_class: workstation
released: 2020-10
memory:
  capacity_gb: 48
  bandwidth_gb_s: 768
  type: GDDR6
  bus_bits: 384
  unified_with_host: false
  bandwidth_derivation: 384 bits / 8 x 16 Gbps GDDR6 = 768 GB/s
precisions_native:
- fp16
- bf16
- int8
- int4
interconnect:
  pcie_gen: 4
  link: nvlink
  link_gb_s: 112.5
