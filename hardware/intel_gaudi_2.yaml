notes: 'Habana Gaudi architecture page: 96 GB HBM2E delivering 2.45 TB/sec (stored
  as 2450 GB/s), 48 MB SRAM, 24x 100 Gbps RoCE v2, FP32/TF32/BF16/FP16/FP8. HL-225H
  mezzanine datasheet: 96 GB HBM2E, PCIe Gen 4.0 x16, card TDP 600 W, OAM v1.1; that
  sheet rounds HBM throughput to 2.4 TB/s. Intel Vision launch fact sheet (May 10,
  2022) repeats 96 GB HBM2E at 2.45 TB/sec. The later Gaudi 3 technical paper comparison
  table lists 2.46 TB/s; this record uses the Gaudi-2-specific 2.45 TB/s pages. Bus
  width is not on those pages. Distinct from Gaudi 3 (128 GB, 3.7 TB/s, PCIe Gen5).
  Peak MME TFLOPS are not copied into compute.tflops.'
