notes: 'Cerebras architecture PDF for WSE-3 (linked from cerebras.ai/chip as the CS-3
  / WSE-3 datasheet) states 900,000 cores, 48 kB SRAM per core, and 21 PB/s of on-wafer
  memory bandwidth. Capacity is 900,000 x 48 KiB = 44.2 GB of on-wafer SRAM; this file
  records 44 GB. Bandwidth is the published 21 PB/s (21,000,000 GB/s), not off-chip
  HBM. No chip TDP is published in that PDF. CAVEAT: a single WSE-3 cannot hold a large
  model in on-wafer SRAM. Cerebras streams weights from external MemoryX; the 44 GB
  is working SRAM, not a GPU-style frame buffer. The single-device FITS_ON calculation
  is misleading for this part and should not be read as "a 70B model fits on one WSE-3".
  Do not fabricate a fits story from these numbers.'
