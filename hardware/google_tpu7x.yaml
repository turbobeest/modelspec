- https://docs.cloud.google.com/tpu/docs/tpu7x
figures_are: vendor-specification
verified_at: 2026-09-14
notes: 'Per chip, not per pod. Google Cloud TPU7x (Ironwood) architecture table lists
  HBM capacity per chip 192 GiB, HBM bandwidth per chip 7380 GBps, peak compute per
  chip 2307 TFLOPs (BF16) / 4614 TFLOPs (FP8), two TensorCores per chip, and bidirectional
  ICI 1200 GBps per chip. Body copy also says approximately 7.37 TB/s, which is the
  same 7380 GBps figure, and "192 GB of HBM" / "96 GB" per chiplet. The source states
  both 192 GiB (table header) and 192 GB (body); the unit is ambiguous, so capacity_gb
  stores 192 as the conservative reading pending an unambiguous primary source.
  Bandwidth stays 7380 GBps as printed. A TPU7x Pod is 9216 chips; this file is one
  chip. Each chip is two chiplets; frameworks may expose two devices per chip. No TDP
  is published.'
