notes: 'Per chip, not per pod. Google Cloud TPU7x (Ironwood) architecture table lists
  HBM capacity per chip 192 GiB, HBM bandwidth per chip 7380 GBps, peak compute per
  chip 2307 TFLOPs (BF16) / 4614 TFLOPs (FP8), two TensorCores per chip, and bidirectional
  ICI 1200 GBps per chip. Body copy also says approximately 7.37 TB/s, which is the
  same 7380 GBps figure. A TPU7x Pod is 9216 chips; this file is one chip. Each chip
  is two chiplets with 96 GB HBM each; frameworks may expose two devices per chip.
  Capacity is recorded as 192 GB from the published 192 GiB figure. No TDP is published.'
