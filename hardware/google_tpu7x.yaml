released: 2025
memory:
  capacity_gb: 192
  bandwidth_gb_s: 7380
  type: HBM
  bus_bits: null
  unified_with_host: false
  bandwidth_derivation: Google-published 7380 GBps per chip; transcribed, not bus-derived. HBM capacity unit is ambiguous (architecture-table header 192 GiB vs body 192 GB); 192 is stored unconverted as the conservative reading pending an unambiguous primary source.
precisions_native:
- bf16
