notes: This record is the 16 GB SKU. NVIDIA's product spec table lists both 8 GB and
  16 GB 4060 Ti as 128-bit GDDR6; they share bus width and bandwidth. Total Graphics
  Power is listed as "165 or 160"; 165 W is the 16 GB SKU and 160 W is the 8 GB SKU.
  NVIDIA GeForce News ("A Deeper Look At VRAM") states 288 GB/sec peak memory bandwidth
  for the 4060 Ti, which with a 128-bit bus is 18 Gbps. Do not assign the 8 GB card's
  160 W TDP to this 16 GB record.
