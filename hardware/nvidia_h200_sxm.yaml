notes: 'Per-SKU record for H200 SXM. NVIDIA H200 product page and H200 datasheet both
  list 141GB HBM3e at 4.8 TB/s, NVLink 900 GB/s, PCIe Gen5 128 GB/s, and TDP up to 700 W
  (configurable). H200 NVL is the same capacity and bandwidth at up to 600 W in a PCIe
  dual-slot form factor and is not this file. Specs are marked preliminary on the vendor
  page. Bus width is not published, so bandwidth is the transcribed 4.8 TB/s.'
