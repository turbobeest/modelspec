notes: 'Blackwell Ultra, the shipping part that Rubin is compared against. Added so
  the catalogue has the current-generation datacentre row next to nvidia_rubin_gpu
  rather than only the 2024 Blackwell rows.

  From NVIDIA''s Blackwell Ultra architecture blog: 288 GB HBM3E at 8 TB/s, two dies
  joined by NV-HBI at 10 TB/s presented as one CUDA device, 208 billion transistors
  on TSMC 4NP, up to 160 SMs, NVLink 5 at 1.8 TB/s bidirectional (18 links x 100 GB/s),
  PCIe Gen6 x16 at 256 GB/s bidirectional, NVLink-C2C to Grace at 900 GB/s, and max
  TGP "Up to 1,400W".

  CAPACITY BINS. The same blog notes "Available SM count and HBM capacity varies by
  SKU", and its generation table lists Blackwell at 192 GB / 8 TB/s against Blackwell
  Ultra at 288 GB / 8 TB/s. Those are architectural maxima. The shipping HGX B200 bin
  in nvidia_b200 is 180 GB / 7.7 TB/s from the Blackwell datasheet, and DGX B200 publishes
  1,440 GB across 8 GPUs, which is the same 180 GB bin. A reader comparing 180, 192
  and 288 GB is looking at bins, not at contradictory sources.

  COMPUTE. The FP4 entries are the GB300 NVL72 rack rows divided by the published 72
  GPUs: 1,440 PFLOPS sparse and 1,080 PFLOPS dense. That division is this record''s
  arithmetic, not a per-GPU figure NVIDIA prints in that table, though it agrees with
  the per-GPU NVFP4 figures in the architecture blog. FP8/FP6 and FP16/BF16 are published
  only at rack level on that page and are not transcribed here rather than derived
  under an ambiguous sparsity footnote.

  GB300 NVL72 rack, for reference and not stored as a device: 72 Blackwell Ultra GPUs,
  36 Grace CPUs, 20 TB GPU memory at up to 576 TB/s aggregate, 37 TB fast memory, 17
  TB LPDDR5X at 14 TB/s, 2,592 Arm Neoverse V2 cores, 130 TB/s NVLink. GB200 NVL72
  publishes the same 576 TB/s aggregate over 13.4 TB of HBM3E.'
