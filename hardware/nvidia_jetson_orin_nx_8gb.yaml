notes: 'NVIDIA Jetson Orin spec table, Jetson Orin NX 8GB column: 8GB 128-bit LPDDR5
  at 102.4 GB/s; AI performance quoted as 117 TOPS with no precision; GPU 1024-core
  Ampere with 32 Tensor Cores; 6-core Cortex-A78AE; power 10W-40W (40 W stored as the
  configurable Super-mode maximum). TOPS is not stored as compute.tflops because the
  precision is unspecified. Unified module memory. Same 102.4 GB/s as NX 16GB; capacity
  is the difference. Launch year 2022 from NVIDIA positioning Orin as the generation
  after Xavier on this page; month is not on the table.'
