notes: 'NVIDIA RTX 4000 SFF Ada Generation datasheet (APR23): 20 GB GDDR6, 160-bit,
  280 GB/s, PCIe 4.0 x16, total board power 70 W, 6,144 CUDA cores, dual-slot SFF
  2.7" H x 6.6" L, no NVLink. Single-precision 19.2 TFLOPS is a qualified FP32 peak;
  Tensor 306.8 TFLOPS uses sparsity/FP8 and is not stored as compute.tflops. Distinct
  from the full-size RTX 4000 Ada Generation desktop card (20 GB GDDR6 ECC, 130 W,
  26.7 TFLOPS on the product page) which does not publish memory bandwidth on that
  page and is not this record. Distinct from the RTX 4000 Ada laptop GPU (12 GB, 432
  GB/s on NVIDIA''s mobile line card).'
