notes: 'Per chip, not per pod. Google Cloud TPU v5e system-architecture table lists
  HBM capacity per chip 16 GB, HBM bandwidth per chip 800 GiBps, peak compute per chip
  197 TFLOPs (bf16) / 393 TOPs (Int8), and bidirectional ICI 400 GBps per chip. A v5e
  Pod is 256 chips; this file is one chip. bandwidth_gb_s records the published 800
  GiBps figure without converting GiB/s to GB/s. No TDP is published.'
