<svg xmlns="http://www.w3.org/2000/svg" width="680" height="286" viewBox="0 0 680 286" role="img" aria-label="Capability estimates, with intervals">
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:12px}.t{font-size:14px;font-weight:600}
.bg{fill:#fcfcfb}.f-s1{fill:#2a78d6}.f-s2{fill:#eb6834}.f-muted{fill:#9a9993}.k-s1{stroke:#2a78d6}.k-muted{stroke:#9a9993}.k-rule{stroke:#e4e3dd}.ring{stroke:#fcfcfb}text{fill:#52514e}.t,.v{fill:#0b0b0b}text.m{fill:#9a9993}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.f-s1{fill:#3987e5}.f-s2{fill:#d95926}.f-muted{fill:#77766f}.k-s1{stroke:#3987e5}.k-muted{stroke:#77766f}.k-rule{stroke:#3a3936}.ring{stroke:#1a1a19}text{fill:#c3c2b7}.t,.v{fill:#ffffff}text.m{fill:#77766f}}
</style>
<rect class="bg" width="680" height="286"/>
<text class="t" x="16" y="24">Capability estimates, with intervals</text>
<line x1="260" y1="242" x2="640" y2="242" class="k-rule"/>
<line x1="290.9" y1="44" x2="290.9" y2="242" class="k-rule"/>
<text x="290.9" y="258" text-anchor="middle">-1</text>
<line x1="425.4" y1="44" x2="425.4" y2="242" class="k-rule"/>
<text x="425.4" y="258" text-anchor="middle">0</text>
<line x1="559.9" y1="44" x2="559.9" y2="242" class="k-rule"/>
<text x="559.9" y="258" text-anchor="middle">1</text>
<text x="450.0" y="274" text-anchor="middle">Capability estimate (latent scale); bars are eighty-percent intervals</text>
<text class="t" x="16" y="68">Software engineering</text>
<text class="v" x="24" y="92">lab/alpha</text>
<line x1="431.1" y1="88" x2="538.8" y2="88" class="k-s1" stroke-width="2" stroke-linecap="round"><title>lab/alpha: 0.44 (interval 0.04 to 0.84)</title></line>
<circle class="f-s1 ring" cx="484.9" cy="88" r="5" stroke-width="2"><title>lab/alpha: 0.44 (interval 0.04 to 0.84)</title></circle>
<text class="" x="24" y="114">lab/beta</text>
<line x1="385.4" y1="110" x2="561.2" y2="110" class="k-muted" stroke-width="2" stroke-linecap="round"><title>lab/beta: 0.36 (interval -0.30 to 1.01)</title></line>
<circle class="f-muted ring" cx="473.3" cy="110" r="5" stroke-width="2"><title>lab/beta: 0.36 (interval -0.30 to 1.01)</title></circle>
<text class="t" x="16" y="156">General reasoning</text>
<text class="v" x="24" y="180">lab/alpha</text>
<line x1="277.3" y1="176" x2="489.1" y2="176" class="k-s1" stroke-width="2" stroke-linecap="round"><title>lab/alpha: -0.31 (interval -1.10 to 0.47)</title></line>
<circle class="f-s1 ring" cx="383.2" cy="176" r="5" stroke-width="2"><title>lab/alpha: -0.31 (interval -1.10 to 0.47)</title></circle>
<text class="" x="24" y="202">lab/beta</text>
<line x1="336.3" y1="198" x2="622.7" y2="198" class="k-muted" stroke-width="2" stroke-linecap="round"><title>lab/beta: 0.40 (interval -0.66 to 1.47)</title></line>
<circle class="f-muted ring" cx="479.5" cy="198" r="5" stroke-width="2"><title>lab/beta: 0.40 (interval -0.66 to 1.47)</title></circle>
<text class="" x="24" y="224">lab/gamma</text>
<line x1="305.0" y1="220" x2="591.4" y2="220" class="k-muted" stroke-width="2" stroke-linecap="round"><title>lab/gamma: 0.17 (interval -0.89 to 1.23)</title></line>
<circle class="f-muted ring" cx="448.2" cy="220" r="5" stroke-width="2"><title>lab/gamma: 0.17 (interval -0.89 to 1.23)</title></circle>
