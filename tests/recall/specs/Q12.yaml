# gap: the registry has no model-level self-hosting facet; open weights does not prove deployability.
# gap: "adequate hardware" names no registered hardware SKU to constrain.
spec_version: 1
snapshot: latest
task_type: new_feature
capabilities: {software_engineering: required}
where:
  - model.class = text-generator
  - model.weights_openness = open_weights
optimize: {max: swe_bench_pro @independent @max_effort @direct}
explain: full
limit: 3
