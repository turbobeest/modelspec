<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModelSpec core flow comparison</title><style>body{margin:20px;font:14px system-ui;background:#ececec;color:#222}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#ececec;padding:12px 0}h1{font-size:20px}select{padding:6px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}figcaption{padding:8px;font-weight:600}img{width:100%;height:auto;border:1px solid #ccc}a{color:#005aa0}</style><header><h1>ModelSpec core flow</h1><label>State <select id="state"><option>01-arrive</option><option>02-parsing</option><option>03-decide</option><option>04-search</option><option>05-editor</option><option>06-soft-preference</option><option>07-may-provisional</option><option>08-not-separable</option><option>09-provenance</option><option>10-retired</option><option>11-nothing-qualifies</option><option>12-not-plotted</option><option>13-tooltip</option><option>14-share-1</option><option>14-share-2</option><option>14-share-3</option><option>14-share-4</option><option>14-share-5</option><option>14-share-6</option><option>15-loading</option><option>16-error</option></select></label><label>Theme and layout <select id="variant"><option>light-canvas</option><option>light-table</option><option>dark-canvas</option><option>dark-table</option></select></label><a href="README.md">Capture notes</a></header><main><figure><figcaption>React app</figcaption><a id="app-link"><img id="app" alt="React app screenshot"></a></figure><figure><figcaption>Original prototype</figcaption><a id="reference-link"><img id="reference" alt="Original prototype screenshot"></a></figure></main><script>const state=document.getElementById('state'),variant=document.getElementById('variant');function show(){for(const target of ['app','reference']){const url=`${target}/${variant.value}/${state.value}.png`;document.getElementById(target).src=url;document.getElementById(target+'-link').href=url}}state.onchange=variant.onchange=show;show()</script></html>
