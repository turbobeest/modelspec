<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade-off Canvas</title>
<meta name="description" content="Prototype B for MODEL-147: a live frontier scatter with draggable budget and capability limits, a winner band for tipping points, and uncertainty as motion. FICTIONAL SAMPLE DATA.">
<style>
:root,[data-theme="light"]{color-scheme:light;
--bg:#fafaf8;--surface:#ffffff;--raise:#f1f0ec;--ink:#141413;--ink2:#3b3b38;--mute:#6b6b66;--grid:#e3e2dc;
--neutral:#a3a29b;--accent:#b86e00;--accent-ink:#8a5200;--warn:#b3541e;--ok:#1d7a4a;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#07080a;--surface:#0d1014;--raise:#13171d;--ink:#e6eaf0;--ink2:#c3cad4;--mute:#8b95a3;--grid:#1f252e;
--neutral:#5b6573;--accent:#f5b342;--accent-ink:#f5b342;--warn:#e8894a;--ok:#4cc38a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}}
[data-theme="dark"]{color-scheme:dark;
--bg:#07080a;--surface:#0d1014;--raise:#13171d;--ink:#e6eaf0;--ink2:#c3cad4;--mute:#8b95a3;--grid:#1f252e;
--neutral:#5b6573;--accent:#f5b342;--accent-ink:#f5b342;--warn:#e8894a;--ok:#4cc38a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent-ink)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fake{background:repeating-linear-gradient(135deg,var(--raise) 0 10px,var(--surface) 10px 20px);border-bottom:1px solid var(--grid);
padding:6px 16px;font:600 11px/1.4 var(--mono);letter-spacing:.08em;color:var(--warn);text-align:center}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.top .brand{font:700 13px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.top .brand b{color:var(--accent-ink)}
.top nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.top nav a{font:12px var(--mono);text-decoration:none;color:var(--mute);padding:4px 8px;border-radius:6px}
.top nav a[aria-current]{background:var(--raise);color:var(--ink)}
.btn{background:var(--raise);border:1px solid var(--grid);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--neutral)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141413;font-weight:650}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:14px;padding:16px}
.big{font:700 34px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--grid);background:var(--raise);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.chip.gov{border-color:color-mix(in srgb,var(--warn) 55%,var(--grid))}
.chip .x{border:0;background:none;color:var(--mute);width:22px;height:22px;border-radius:50%;padding:0}
.chip .x:hover{background:var(--grid);color:var(--ink)}
.pill{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;border:1px solid var(--grid);color:var(--mute)}
.pill.win{color:var(--accent-ink);border-color:var(--accent)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.why{border-left:3px solid var(--accent);padding:6px 10px;background:var(--raise);border-radius:0 8px 8px 0;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
pre,textarea.spec{font:12.5px/1.5 var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:18px 20px;max-width:1400px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr;padding:16px}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:6px 10px}
.tog{border:1px solid var(--grid);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent);font-weight:600}
.tog .d{font:11px var(--mono);color:var(--mute);margin-left:4px}
.canvas{position:relative;touch-action:none;user-select:none}
.canvas svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.slider{margin-top:14px}
.slider .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.band{position:relative;height:30px;border-radius:8px;overflow:hidden;display:flex;margin:6px 0 2px;border:1px solid var(--grid)}
.band span{display:flex;align-items:center;justify-content:center;font-size:11.5px;white-space:nowrap;overflow:hidden;color:var(--ink);border-right:2px solid var(--surface)}
.band span.cur{background:color-mix(in srgb,var(--accent) 30%,var(--surface));font-weight:650}
.band span:not(.cur){background:var(--raise)}
input[type=range]{width:100%;accent-color:var(--accent)}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13px;color:var(--mute)}
@media (max-width:600px){.kb{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:12px}
.w h2{margin:2px 0 2px;font-size:22px}
.w .sub{font-size:13px;color:var(--mute)}
.top5{list-style:none;margin:6px 0 0;padding:0}
.top5 li{display:grid;grid-template-columns:18px 1fr 64px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--grid);font-size:13.5px;cursor:pointer}
.top5 .pb{height:8px;border-radius:4px;background:var(--grid);position:relative;overflow:hidden}
.top5 .pb i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.top5 small{color:var(--mute);font:11px var(--mono)}
.why{min-height:60px}
</style>
</head>
<body>
<main>
  <section aria-labelledby="h">
    <div class="bar">
      <h1 id="h" style="font-size:20px;margin:0 8px 0 0">Drag the limits. Watch the frontier.</h1>
      <label><span class="sr">Capability on the vertical axis</span><select id="dim"><option value="coding">Coding</option><option value="reasoning">Reasoning</option><option value="writing">Writing</option></select></label>
      <label><span class="sr">Start from a preset</span><select id="preset"><option value="">Presets…</option></select></label>
      <label class="tog"><input type="checkbox" id="hops"> uncertainty as motion</label>
    </div>
    <div class="bar" id="toggles" aria-label="Rules"></div>
    <div class="card canvas" id="canvas"></div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--accent)"></i>#1</span><span><i style="background:var(--ink2)"></i>on the frontier</span><span><i style="background:var(--neutral)"></i>qualifies</span>
      <span><i style="border:1.5px dashed var(--ink2)"></i>may qualify (unknown)</span><span><i style="border:2px solid var(--warn)"></i>near miss</span><span><i style="border:1.25px solid var(--mute)"></i>eliminated</span><span>│ interval</span>
    </div>
    <div class="slider card" style="margin-top:12px">
      <div class="row"><span>← Cost matters more</span><span class="eyebrow">who is #1 at each trade-off</span><span id="lq">Capability matters more →</span></div>
      <div class="band" id="band" aria-hidden="true"></div>
      <input type="range" id="q" min="0" max="100" value="70" aria-label="Weight on capability versus cost">
      <div class="kb">
        <label>Budget ceiling per task <b id="vc"></b><input type="range" id="kc" min="0" max="100" aria-label="Budget ceiling per task"></label>
        <label>Capability floor <b id="vf"></b><input type="range" id="kf" min="50" max="90" aria-label="Capability floor"></label>
      </div>
    </div>
  </section>
  <aside class="rail" aria-label="Decision">
    <div class="card"><div style="display:flex;gap:16px;align-items:baseline" aria-live="polite"><div><span class="big num" id="n"></span> <span style="color:var(--mute)">of 22 qualify</span></div><span class="pill" id="st"></span></div><div class="eyebrow" id="nm"></div></div>
    <div class="card w" id="w"></div>
    <div class="card"><div class="eyebrow">Top 5 · P(best) · plausible rank</div><ul class="top5" id="top5"></ul></div>
    <div class="card"><div class="eyebrow">Why not…? <span style="text-transform:none;letter-spacing:0">(click any point)</span></div><div id="why" style="min-height:60px" aria-live="polite"></div></div>
    <div class="card"><button class="btn primary" id="share">Copy link to this view</button> <div class="eyebrow" id="did" style="margin-top:8px"></div></div>
  </aside>
</main>
<script>
/* === ms-components:begin === */
/* ModelSpec downselect components, MODEL-147 prototypes. Identical in every page
   under docs/ux/prototypes/ (tests/test_ux_prototypes.py checks). Four parts:
   1. FICTIONAL SAMPLE DATA. Invented labs, models, providers and benchmarks.
      No value here is a real score, price or fact about a real model.
   2. A toy decision engine shaped like the decision response (design §6–7):
      three-valued filter, funnel, may-qualify, weighted objective with the
      normalisation shown, P(best) and rank spread by resampling, constraint
      costs, tipping points, "why not X". It stands in for decision/contract.py.
   3. Spec <-> text <-> URL, so every view is a shareable, reproducible link.
   4. SVG chart components used by the prototypes, the launch report and the
      social cards alike. */
const MS = (() => {
  "use strict";

  // ---------- 1. FICTIONAL SAMPLE DATA ----------
  const FAKE_NOTICE = "FICTIONAL SAMPLE DATA: invented models, labs, providers and scores";
  const SNAPSHOT = "snap_FAKE-2026-09-24";
  // [id, name, lab, released, open weights, context, lab origin, lifecycle,
  //  coding [est, lo, hi], reasoning [..], writing [..]]
  const M = [
    ["kestrel/k4-pro", "Kestrel K4 Pro", "Kestrel Labs", "2026-07-02", false, 400e3, "US", "active", [82, 76, 87], [80, 74, 85], [74, 68, 79]],
    ["kestrel/k4-swift", "Kestrel K4 Swift", "Kestrel Labs", "2026-07-02", false, 200e3, "US", "active", [71, 66, 76], [66, 60, 71], [69, 63, 74]],
    ["kestrel/k3-pro", "Kestrel K3 Pro", "Kestrel Labs", "2025-11-12", false, 200e3, "US", "deprecated", [72, 68, 76], [70, 66, 74], [72, 68, 76]],
    ["northwind/atlas-3", "Northwind Atlas 3", "Northwind AI", "2026-08-14", false, 1e6, "US", "active", [79, 70, 86], [84, 78, 89], [81, 75, 86]],
    ["northwind/atlas-3-mini", "Atlas 3 Mini", "Northwind AI", "2026-08-14", false, 1e6, "US", "active", [66, 60, 72], [70, 64, 75], [67, 61, 72]],
    ["halcyon/hx-2", "Halcyon HX-2", "Halcyon", "2026-06-20", false, 256e3, "FR", "active", [74, 69, 79], [73, 68, 78], [78, 73, 83]],
    ["halcyon/hx-2-open", "HX-2 Open", "Halcyon", "2026-06-20", true, 128e3, "FR", "active", [68, 63, 73], [65, 59, 70], [70, 64, 75]],
    ["tern/t3", "Tern T-3", "Tern Research", "2026-09-22", true, 256e3, "CA", "active", [80, 68, 89], [76, 64, 86], [71, 60, 80]],
    ["tern/t2", "Tern T-2", "Tern Research", "2026-02-10", true, 128e3, "CA", "active", [70, 66, 74], [68, 64, 72], [66, 62, 70]],
    ["quillon/q7", "Quillon Q7", "Quillon", "2026-08-01", true, 256e3, "SG", "active", [77, 72, 82], [75, 70, 80], [68, 63, 73]],
    ["quillon/q7-flash", "Q7 Flash", "Quillon", "2026-08-01", true, 128e3, "SG", "active", [65, 60, 70], [61, 55, 66], [60, 55, 65]],
    ["ossify/coder-2", "Ossify Coder 2", "Ossify", "2026-05-15", true, 128e3, "DE", "active", [73, 65, 80], [62, 55, 69], [55, 49, 61]],
    ["mistwood/long", "Mistwood Long", "Mistwood", "2026-04-03", false, 2e6, "US", "active", [62, 57, 67], [66, 61, 71], [76, 71, 81]],
    ["aurel/aurel-9", "Aurel 9", "Aurel", "2026-03-18", false, 300e3, "US", "active", [76, 73, 79], [77, 74, 80], [75, 72, 78]],
  ];
  const MODELS = Object.fromEntries(M.map(r => [r[0], {
    id: r[0], name: r[1], lab: r[2], released: r[3], open: r[4], context: r[5], origin: r[6],
    lifecycle: r[7], est: { coding: r[8], reasoning: r[9], writing: r[10] },
  }]));
  // [model, provider, region, $/M input, $/M output, tokens/s or null,
  //  zero retention (true/false/null = unknown), SOC 2, trains on customer data]
  const O = [
    ["kestrel/k4-pro", "Kestrel API", "us", 5, 25, 62, false, true, false],
    ["kestrel/k4-pro", "Cloudbank", "eu", 5.5, 27, 55, true, true, false],
    ["kestrel/k4-swift", "Kestrel API", "us", 0.8, 4, 180, false, true, false],
    ["kestrel/k4-swift", "Cloudbank", "eu", 0.9, 4.4, 160, true, true, false],
    ["kestrel/k3-pro", "Kestrel API", "us", 3, 15, 70, false, true, false],
    ["northwind/atlas-3", "Northwind API", "us", 2.5, 15, 95, null, true, null],
    ["northwind/atlas-3", "Meridian Cloud", "eu", 2.75, 16.5, 88, true, true, false],
    ["northwind/atlas-3-mini", "Northwind API", "us", 0.3, 2.5, 240, null, true, null],
    ["halcyon/hx-2", "Halcyon API", "eu", 2, 6, 110, true, true, false],
    ["halcyon/hx-2", "Meridian Cloud", "eu", 2.2, 6.6, 100, true, true, false],
    ["halcyon/hx-2-open", "Harbor Inference", "eu", 0.4, 1.2, 150, true, null, false],
    ["tern/t3", "Harbor Inference", "us", 0.6, 2.4, null, true, null, false],
    ["tern/t3", "Tern API", "us", 0.5, 2, 130, false, false, null],
    ["tern/t2", "Harbor Inference", "us", 0.3, 1.2, 170, true, null, false],
    ["quillon/q7", "Quillon API", "ap", 0.35, 1.4, 120, false, false, true],
    ["quillon/q7", "Harbor Inference", "eu", 0.6, 2.2, 105, true, null, false],
    ["quillon/q7-flash", "Harbor Inference", "us", 0.1, 0.4, 310, true, null, false],
    ["ossify/coder-2", "Harbor Inference", "eu", 0.25, 1, 140, true, null, false],
    ["ossify/coder-2", "Cloudbank", "eu", 0.35, 1.3, null, true, true, false],
    ["mistwood/long", "Mistwood API", "us", 1.2, 4.8, 75, false, true, false],
    ["aurel/aurel-9", "Aurel API", "us", 3, 12, 85, false, true, false],
    ["aurel/aurel-9", "Meridian Cloud", "eu", 3.3, 13.2, 80, true, true, false],
  ];
  const TASK_TOKENS = { in: 30000, out: 5000 };  // the "typical task" cost basis, shown in the UI
  const ROWS = O.map((r, i) => {
    const m = MODELS[r[0]];
    return {
      key: `${r[0]}@${r[1]}:${r[2]}`, i, model: m, provider: r[1], region: r[2],
      price_in: r[3], price_out: r[4], tps: r[5], zdr: r[6], soc2: r[7], trains: r[8],
      cost: +((r[3] * TASK_TOKENS.in + r[4] * TASK_TOKENS.out) / 1e6).toFixed(4),
      coding: m.est.coding[0], reasoning: m.est.reasoning[0], writing: m.est.writing[0],
      context: m.context, open: m.open, origin: m.origin, lifecycle: m.lifecycle, released: m.released,
    };
  });

  // Facet registry (a slice of design §8). kind sets the unknown policy:
  // capability → "may qualify"; governance → not satisfied (fail-safe).
  const FACETS = {
    coding: { label: "Coding", unit: "est.", kind: "capability", type: "num", dir: 1, est: true, help: "Capability estimate, software engineering (fictional units, 0–100)" },
    reasoning: { label: "Reasoning", unit: "est.", kind: "capability", type: "num", dir: 1, est: true, help: "Capability estimate, maths and STEM" },
    writing: { label: "Writing", unit: "est.", kind: "capability", type: "num", dir: 1, est: true, help: "Capability estimate, writing" },
    cost: { label: "Cost per task", unit: "$", kind: "capability", type: "num", dir: -1, help: `Derived: ${TASK_TOKENS.in / 1000}k in + ${TASK_TOKENS.out / 1000}k out tokens at list price` },
    tps: { label: "Speed", unit: "tok/s", kind: "capability", type: "num", dir: 1, help: "Output throughput, best effort; unknown on some offerings" },
    context: { label: "Context", unit: "tokens", kind: "capability", type: "num", dir: 1, help: "Context window" },
    open: { label: "Open weights", kind: "capability", type: "bool", help: "Weights downloadable" },
    region: { label: "Region", kind: "governance", type: "set", values: ["us", "eu", "ap"], help: "Where the offering processes data" },
    origin: { label: "Lab jurisdiction", kind: "governance", type: "set", values: ["US", "FR", "DE", "CA", "SG"], help: "Country of the lab that trained it (not weights hosting)" },
    zdr: { label: "Zero retention", kind: "governance", type: "bool", help: "Documented zero data retention on this offering" },
    soc2: { label: "SOC 2", kind: "governance", type: "bool", help: "Documented SOC 2 report for the provider" },
    trains: { label: "Trains on your data", kind: "governance", type: "bool", help: "Provider documents training on customer data" },
    lifecycle: { label: "Lifecycle", kind: "capability", type: "set", values: ["active", "deprecated"], help: "Deprecated models stay, with a warning" },
  };
  const DIM_ORDER = ["coding", "reasoning", "writing", "cost", "tps"];

  // ---------- 2. The toy decision engine ----------
  function rng(seed) {  // mulberry32: same spec + snapshot → same draws → same decision
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function gauss(r) { return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r()); }

  function evalCond(row, c) {  // → "pass" | "fail" | "unknown"
    const v = row[c.f];
    if (v === null || v === undefined) return "unknown";
    const x = c.v;
    switch (c.op) {
      case ">=": return v >= x ? "pass" : "fail";
      case "<=": return v <= x ? "pass" : "fail";
      case "=": return v === x ? "pass" : "fail";
      case "!=": return v !== x ? "pass" : "fail";
      case "in": return x.includes(v) ? "pass" : "fail";
      case "not in": return !x.includes(v) ? "pass" : "fail";
    }
    throw new Error(`unknown operator ${c.op}`);
  }
  function unknownPolicy(c) { return c.unknown || (FACETS[c.f].kind === "governance" ? "fail" : "list"); }

  function fmt(f, v) {
    if (v === null || v === undefined) return "unknown";
    if (f === "cost") return v < 0.1 ? `$${v.toFixed(3)}` : `$${v.toFixed(2)}`;
    if (f === "context") return v >= 1e6 ? `${v / 1e6}M` : `${Math.round(v / 1000)}k`;
    if (f === "tps") return `${v} tok/s`;
    if (typeof v === "boolean") return v ? "yes" : "no";
    if (Array.isArray(v)) return `{${v.join(", ")}}`;
    return String(v);
  }
  function condText(c) {
    const s = `${c.f} ${c.op} ${Array.isArray(c.v) ? `{${c.v.join(",")}}` : c.v}`;
    return c.soft ? `${s} soft(${c.soft})` : s;
  }
  function condPlain(c) {
    const F = FACETS[c.f], v = c.v;
    const ops = { ">=": "at least", "<=": "at most", "=": "is", "!=": "is not", in: "in", "not in": "not in" };
    if (F.type === "bool") return `${F.label}: ${(c.op === "=") === v ? "yes" : "no"}`;
    return `${F.label} ${ops[c.op]} ${Array.isArray(v) ? v.join(" or ") : fmt(c.f, v)}`;
  }

  function score(rows, weights, pick) {  // min-max over the candidate set; the ranges are returned so the UI can show them
    const dims = Object.keys(weights).filter(d => weights[d]);
    const range = {};
    for (const d of dims) {
      const vals = rows.map(r => pick(r, d));
      range[d] = [Math.min(...vals), Math.max(...vals)];
    }
    const tot = dims.reduce((s, d) => s + Math.abs(weights[d]), 0) || 1;
    return rows.map(r => {
      const parts = dims.map(d => {
        const [lo, hi] = range[d], v = pick(r, d);
        let n = hi === lo ? 1 : (v - lo) / (hi - lo);
        if (FACETS[d].dir < 0) n = 1 - n;
        const w = Math.abs(weights[d]) / tot;

    const rows = dec.results.slice(0, o.n || 5), W = o.w || 520, rowH = 30, L = o.labelW || 190, H = rows.length * rowH + 30;
    const max = Math.max(...rows.map(r => r.score), 0.01);
    let s = svgOpen(W, H, `Score contributions for the top ${rows.length}`);
    rows.forEach((r, i) => {
      let x = L; const y = i * rowH + 4;
      s += `<g data-key="${esc(r.row.key)}"><text class="${i ? "lbl" : "ttl"}" x="${L - 10}" y="${y + 15}" text-anchor="end">${i + 1}. ${esc(short(r.row))}</text>`;
      for (const p of r.parts) {
        const w = Math.max(0, p.part / max * (W - L - 60));
        if (w > 0.5) s += `<rect class="${SLOT[p.dim]}" x="${x}" y="${y + 3}" width="${Math.max(w - 2, 1)}" height="16" rx="3"><title>${FACETS[p.dim].label}: ${fmt(p.dim, p.value)} → ${(p.norm * 100).toFixed(0)}% of range × weight ${(p.weight * 100).toFixed(0)}% = ${(p.part * 100).toFixed(1)} pts</title></rect>`;
        x += w;
      }
      s += `<text class="dim" x="${x + 6}" y="${y + 15}">${(r.score * 100).toFixed(0)}</text></g>`;
    });
    let lx = L;
    for (const p of rows[0] ? rows[0].parts : []) { s += `<rect class="${SLOT[p.dim]}" x="${lx}" y="${H - 14}" width="10" height="10" rx="2"/><text class="axl" x="${lx + 14}" y="${H - 5}">${FACETS[p.dim].label} ${(p.weight * 100).toFixed(0)}%</text>`; lx += 120; }
    return s + "</svg>";
  }

  // Funnel: the count left after each condition, with the "may qualify" share hatched.
  function funnel(dec, o = {}) {
    const W = o.w || 520, rowH = 26, L = o.labelW || 200, steps = [{ label: "All offerings", after: dec.total, unknown: 0 }, ...dec.funnel.map(f => ({ label: condPlain(f.cond), after: f.after, unknown: f.unknown }))];
    const H = steps.length * rowH + 6;
    let s = svgOpen(W, H, `Funnel: ${steps.map(x => `${x.label} ${x.after}`).join(", ")}`);
    s += `<defs><pattern id="ms-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="bar"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--surface)" stroke-width="2"/></pattern></defs>`;
    steps.forEach((st, i) => {
      const y = i * rowH + 3, w = st.after / dec.total * (W - L - 40), wu = st.unknown / dec.total * (W - L - 40);
      s += `<text class="${i ? "lbl" : "dim"}" x="${L - 10}" y="${y + 14}" text-anchor="end">${esc(st.label)}</text>`;
      s += `<rect class="bar ${i === steps.length - 1 ? "hl" : ""}" x="${L}" y="${y + 2}" width="${Math.max(w - wu, 1)}" height="16" rx="3" style="transition:width .3s"/>`;
      if (wu) s += `<rect x="${L + w - wu}" y="${y + 2}" width="${wu}" height="16" rx="3" fill="url(#ms-hatch)"><title>${st.unknown} may qualify (unknown on this facet)</title></rect>`;
      s += `<text class="lbl" x="${L + w + 6}" y="${y + 14}">${st.after}${st.unknown ? `<tspan class="dim"> (${st.unknown}?)</tspan>` : ""}</text>`;
    });

  }

  // Interval strip: each model's estimate in one domain, winner highlighted.
  function intervals(rows, dim, o = {}) {
    const W = o.w || 520, rowH = o.rowH || 26, L = o.labelW || 150, H = rows.length * rowH + 26, ys = o.domain || [50, 95];
    const X = v => L + (v - ys[0]) / (ys[1] - ys[0]) * (W - L - 20);
    let s = svgOpen(W, H, `${FACETS[dim].label} estimates with intervals`);
    for (let t = Math.ceil(ys[0] / 10) * 10; t <= ys[1]; t += 10) s += `<line class="ax" x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H - 22}"/><text class="axl" x="${X(t)}" y="${H - 8}" text-anchor="middle">${t}</text>`;
    rows.forEach((m, i) => {
      const [e, lo, hi] = m.est[dim], y = i * rowH + rowH / 2, hl = o.highlight === m.id;
      s += `<text class="${hl ? "ttl" : "lbl"}" x="${L - 10}" y="${y + 4}" text-anchor="end">${esc(m.name)}</text>`;
      s += `<line class="ci ${hl ? "win" : ""}" x1="${X(lo)}" x2="${X(hi)}" y1="${y}" y2="${y}" stroke-width="6" style="stroke-width:6;opacity:${hl ? 0.45 : 0.35}"/>`;
      s += `<circle class="dot ${hl ? "win" : "front"}" cx="${X(e)}" cy="${y}" r="${hl ? 7 : 5}"><title>${esc(m.name)}: ${e} [${lo}–${hi}]</title></circle>`;
    });
    return s + "</svg>";
  }

  // Claims vs independent evidence (dumbbell): hollow = lab's claim, filled = independent.
  function dumbbell(items, o = {}) {
    const W = o.w || 520, rowH = 30, L = o.labelW || 170, H = items.length * rowH + 34, xs = o.domain || [0, 100];
    const X = v => L + (v - xs[0]) / (xs[1] - xs[0]) * (W - L - 50);
    let s = svgOpen(W, H, "Lab claims against independent evidence");
    items.forEach((it, i) => {
      const y = i * rowH + 16;
      s += `<text class="lbl" x="${L - 10}" y="${y + 4}" text-anchor="end">${esc(it.bench)}</text>`;
      if (it.claim != null && it.indep != null) s += `<line class="ax" x1="${X(it.claim)}" x2="${X(it.indep)}" y1="${y}" y2="${y}" style="stroke-width:3"/>`;
      if (it.claim != null) s += `<circle class="claim" cx="${X(it.claim)}" cy="${y}" r="6"><title>Lab claim ${it.claim}</title></circle>`;
      if (it.indep != null) s += `<circle class="dot win" cx="${X(it.indep)}" cy="${y}" r="6"><title>Independent ${it.indep}</title></circle>`;
      const note = it.indep == null ? "no independent run yet" : it.claim == null ? "lab did not report" : `${it.indep - it.claim > 0 ? "+" : ""}${(it.indep - it.claim).toFixed(1)}`;
      s += `<text class="dim" x="${X(Math.max(it.claim ?? 0, it.indep ?? 0)) + 12}" y="${y + 4}">${note}</text>`;
    });
    s += `<circle class="claim" cx="${L + 4}" cy="${H - 10}" r="5"/><text class="axl" x="${L + 14}" y="${H - 6}">lab's claim</text><circle class="dot win" cx="${L + 110}" cy="${H - 10}" r="5"/><text class="axl" x="${L + 120}" y="${H - 6}">independent</text>`;
    return s + "</svg>";
  }

  // Resolved token values, so an exported SVG/PNG looks like the page it came from.
  function resolvedStyle(el) {
    const cs = getComputedStyle(el), vars = ["--ink", "--ink2", "--mute", "--grid", "--neutral", "--surface", "--accent", "--warn", "--s1", "--s2", "--s3", "--s4", "--s5"];
    return `<style>svg{${vars.map(v => `${v}:${cs.getPropertyValue(v)}`).join(";")}}${CHART_CSS}</style>`;
  }
  function downloadPNG(svgEl, w, h, name) {
    const clone = svgEl.cloneNode(true);
    clone.setAttribute("width", w); clone.setAttribute("height", h);
    clone.insertAdjacentHTML("afterbegin", resolvedStyle(svgEl));
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);

      URL.revokeObjectURL(url);

    img.src = url;
  }


  // Page chrome shared by every prototype: the fictional-data banner, nav, theme toggle, share.
  const PAGES = [["a-guided.html", "A · Guided"], ["b-canvas.html", "B · Trade-off canvas"], ["c-table.html", "C · Decision table"], ["launch-report.html", "Launch report + cards"]];
  function mountChrome(active, title) {
    const st = document.createElement("style"); st.textContent = CHART_CSS; document.head.append(st);
    const head = document.createElement("header");
    head.innerHTML = `<div class="fake" role="note">${FAKE_NOTICE}. A MODEL-147 prototype, not a product.</div>
      <div class="top"><span class="brand">Model<b>Spec</b></span><span class="eyebrow">${esc(title)}</span>
      <nav aria-label="Prototypes">${PAGES.map(([h, t]) => `<a href="${h}${location.hash}"${h === active ? ' aria-current="page"' : ""}>${t}</a>`).join("")}</nav>
      <button class="btn" id="ms-theme" aria-label="Toggle light or dark theme">◐</button></div>`;
    document.body.prepend(head);
    const toast = document.createElement("div"); toast.className = "toast"; toast.setAttribute("role", "status"); document.body.append(toast);
    document.getElementById("ms-theme").onclick = () => {
      const dark = matchMedia("(prefers-color-scheme: dark)").matches, cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
      document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
      document.dispatchEvent(new Event("ms-theme"));
    };
    head.querySelectorAll("nav a").forEach(a => a.addEventListener("click", () => { a.href = a.getAttribute("href").split("#")[0] + location.hash; }));
  }
  function say(msg) { const t = document.querySelector(".toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(say.t); say.t = setTimeout(() => t.classList.remove("on"), 1800); }
  function share(spec, view) {
    history.replaceState(null, "", specToHash(spec, view));
    const url = location.href;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => say("Link copied: same spec, same snapshot, same decision"), () => say("Link is in the address bar"));

  }

  const PRESETS = {
    "Coding agent, best value": { where: [{ f: "context", op: ">=", v: 200000 }], weights: { coding: 0.7, cost: 0.3 } },
    "EU, private data": { where: [{ f: "region", op: "in", v: ["eu"] }, { f: "zdr", op: "=", v: true }, { f: "trains", op: "=", v: false }], weights: { coding: 0.6, cost: 0.3, tps: 0.1 } },
    "Self-hosted, open weights": { where: [{ f: "open", op: "=", v: true }], weights: { coding: 0.8, cost: 0.2 } },
    "Cheap and fast": { where: [{ f: "cost", op: "<=", v: 0.03 }], weights: { coding: 0.4, tps: 0.4, cost: 0.2 } },
  };

  return {
    FAKE_NOTICE, SNAPSHOT, MODELS, ROWS, FACETS, DIM_ORDER, SLOT, TASK_TOKENS, PRESETS, CHART_CSS,
    decide, whyNot, tippingText, condText, condPlain, fmt, label, short, esc,
    specText, parseSpec, specToHash, specFromHash, hash,
    mountChrome, say, share, PAGES,
    scatter, scatterGeom, iconArray, contributions, funnel, intervals, dumbbell, downloadPNG,
  };
})();
/* === ms-components:end === */

MS.mountChrome("b-canvas.html", "Prototype B · live trade-off canvas");
const $ = id => document.getElementById(id);
const G = MS.scatterGeom({ w: 900, h: 520 });
const RULES = [
  ["EU only", { f: "region", op: "in", v: ["eu"] }], ["Zero retention", { f: "zdr", op: "=", v: true }],
  ["Never trains on my data", { f: "trains", op: "=", v: false }], ["SOC 2", { f: "soc2", op: "=", v: true }],
  ["Open weights", { f: "open", op: "=", v: true }], ["Long context ≥ 500k", { f: "context", op: ">=", v: 500000 }],
];
const st = { dim: "coding", q: 0.7, speed: false, on: new Set(), cost: 0.3, floor: 60, sel: null, hop: -1 };
const CMIN = 0.005, CMAX = 0.45, toSlider = c => Math.round(Math.log(c / CMIN) / Math.log(CMAX / CMIN) * 100), fromSlider = v => +(CMIN * Math.pow(CMAX / CMIN, v / 100)).toFixed(3);

function spec() {
  const where = RULES.filter(([n]) => st.on.has(n)).map(([, c]) => c);
  where.push({ f: "cost", op: "<=", v: st.cost }, { f: st.dim, op: ">=", v: st.floor });
  const weights = { [st.dim]: +st.q.toFixed(2), cost: +(1 - st.q).toFixed(2) };
  if (st.speed) weights.tps = 0.15;
  return { where, weights };
}
function load(s) {  // a shared link restores the exact view
  st.on = new Set(RULES.filter(([, c]) => s.where.some(w => w.f === c.f && JSON.stringify(w.v) === JSON.stringify(c.v))).map(([n]) => n));
  const dim = ["coding", "reasoning", "writing"].find(d => s.weights[d]) || "coding";
  st.dim = dim;
  const tot = Object.values(s.weights).reduce((a, b) => a + b, 0) || 1;
  st.q = (s.weights[dim] || 0) / ((s.weights[dim] || 0) + (s.weights.cost || 0) || 1);
  st.speed = !!s.weights.tps;
  const c = s.where.find(w => w.f === "cost" && w.op === "<="); st.cost = c ? c.v : CMAX;
  const f = s.where.find(w => w.f === dim && w.op === ">="); st.floor = f ? f.v : 50;
}

function winnerBand() {  // the tipping-point strip: who is #1 at every point of the slider
  const base = spec(), segs = [];
  for (let i = 0; i <= 50; i++) {
    const q = i / 50, w = { ...base.weights, [st.dim]: q, cost: 1 - q };
    const d = MS.decide({ ...base, weights: w }, { fast: true }), who = d.results[0] ? d.results[0].row.model.name : "none";
    if (segs.length && segs[segs.length - 1].who === who) segs[segs.length - 1].to = q; else segs.push({ who, from: q, to: q });
  }
  return segs;
}

let dec;
function render() {
  const s = spec();
  dec = MS.decide(s);
  const hop = st.hop >= 0 && dec.hops ? dec.hops[st.hop % dec.hops.length] : null;
  $("canvas").innerHTML = MS.scatter(dec, { w: 900, h: 520, y: st.dim, limits: { cost: st.cost, floor: st.floor }, handles: true, nearLabels: true, hop, maxLabels: 4 });
  const svg = $("canvas").querySelector("svg");
  if (st.sel) { const g = svg.querySelector(`[data-key="${CSS.escape(st.sel)}"] .dot`); if (g) { g.setAttribute("r", 11); g.style.stroke = "var(--ink)"; } }
  $("n").textContent = dec.results.length + dec.may_qualify.length;
  $("nm").textContent = `${dec.results.length} ranked · ${dec.may_qualify.length} may qualify · ${dec.eliminated.length} eliminated`;
  $("st").textContent = dec.status.replace("_", " ");
  const w = dec.results[0];
  $("w").innerHTML = w ? `<div style="display:grid;grid-template-columns:1fr 84px;gap:10px"><div><div class="eyebrow">#1 right now</div><h2>${MS.esc(w.row.model.name)}</h2>
    <div class="sub">${MS.esc(w.row.provider)} · ${w.row.region.toUpperCase()}<br>${MS.fmt("cost", w.row.cost)}/task · ${st.dim} ${w.row[st.dim]} (${w.row.model.est[st.dim][1]}–${w.row.model.est[st.dim][2]})</div></div>${MS.iconArray(w.p_best, { cell: 8 })}</div>
    <div style="font-size:13px;margin-top:8px">${(dec.tipping || []).map(t => MS.esc(MS.tippingText(t))).join("<br>")}</div>`
    : `<div class="eyebrow">Nothing qualifies</div><p style="font-size:14px">Drag the budget right or the floor down. ${MS.esc(relaxHint())}</p>`;
  $("top5").innerHTML = dec.results.slice(0, 5).map((x, i) => `<li data-key="${MS.esc(x.row.key)}"><span class="num">${i + 1}</span><span>${MS.esc(x.row.model.name)} <small>${MS.esc(x.row.provider)}</small></span>
    <span title="P(best) ${Math.round(x.p_best * 100)}%, plausible rank ${x.rank_spread[0]}–${x.rank_spread[1]}"><span class="pb"><i style="width:${Math.max(2, x.p_best * 100)}%"></i></span><small>#${x.rank_spread[0]}–${x.rank_spread[1]}</small></span></li>`).join("");
  $("top5").querySelectorAll("li").forEach(li => li.onclick = () => select(li.dataset.key));
  const band = winnerBand();
  $("band").innerHTML = band.map(b => `<span class="${w && b.who === w.row.model.name ? "cur" : ""}" style="flex:${b.to - b.from + 0.02}" title="${MS.esc(b.who)} wins from ${Math.round(b.from * 100)}% to ${Math.round(b.to * 100)}% capability weight">${MS.esc(b.who)}</span>`).join("");
  $("q").value = Math.round(st.q * 100); $("lq").textContent = `${MS.FACETS[st.dim].label} matters more (${Math.round(st.q * 100)}%) →`;
  $("kc").value = toSlider(st.cost); $("vc").textContent = MS.fmt("cost", st.cost); $("kf").value = st.floor; $("vf").textContent = Math.round(st.floor);
  $("dim").value = st.dim;
  $("toggles").innerHTML = RULES.map(([n, c]) => {
    const on = st.on.has(n), alt = MS.decide({ ...spec(), where: on ? spec().where.filter(x => x !== c) : [...spec().where, c] }, { fast: true });
    const delta = alt.results.length + alt.may_qualify.length - dec.results.length - dec.may_qualify.length;
    return `<button class="tog" aria-pressed="${on}" data-n="${n}">${n}<span class="d">${delta > 0 ? "+" : ""}${delta}</span></button>`;
  }).join("") + `<button class="tog" aria-pressed="${st.speed}" id="speed">Also reward speed</button>`;
  $("toggles").querySelectorAll("[data-n]").forEach(b => b.onclick = () => { st.on.has(b.dataset.n) ? st.on.delete(b.dataset.n) : st.on.add(b.dataset.n); render(); });
  $("speed").onclick = () => { st.speed = !st.speed; render(); };

  showWhy(st.sel || defaultSel());
  history.replaceState(null, "", MS.specToHash(s, "canvas"));
}
function relaxHint() {
  const c = (dec.constraint_costs || []).filter(x => x.freed > 0).sort((a, b) => b.freed - a.freed)[0];
  return c ? `Dropping “${MS.condPlain(c.cond)}” lets ${c.freed} in.` : "";
}
function defaultSel() { const n = dec.eliminated.find(e => e.gap !== null && Math.abs(e.gap) <= 0.15); return n ? n.row.key : dec.results[1] ? dec.results[1].row.key : null; }

function showWhy(key) { const r = MS.ROWS.find(x => x.key === key); $("why").innerHTML = r ? `<div class="why">${MS.esc(MS.whyNot(dec, r).text)}</div>` : ""; }

// Dragging the limits: invert the chart's own scales.
let drag = null;
const toView = e => { const svg = $("canvas").querySelector("svg"), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
$("canvas").addEventListener("pointerdown", e => {
  const k = e.target.closest("[data-drag]"), v = toView(e);
  if (k) drag = k.dataset.drag;
  else if (Math.abs(v.x - G.X(st.cost)) < 10) drag = "cost";
  else if (Math.abs(v.y - G.Y(st.floor)) < 10) drag = "floor";
  if (drag) { $("canvas").setPointerCapture(e.pointerId); e.preventDefault(); return; }
  const dot = e.target.closest("[data-key]"); if (dot) select(dot.dataset.key);
});
$("canvas").addEventListener("pointermove", e => {
  if (!drag) return;
  const v = toView(e);
  if (drag === "cost") st.cost = +Math.min(CMAX, Math.max(CMIN, G.Xi(v.x))).toFixed(3);
  else st.floor = Math.min(90, Math.max(50, Math.round(G.Yi(v.y))));
  render();
});
$("canvas").addEventListener("pointerup", () => drag = null);
$("q").oninput = e => { st.q = e.target.value / 100; render(); };
$("kc").oninput = e => { st.cost = fromSlider(+e.target.value); render(); };
$("kf").oninput = e => { st.floor = +e.target.value; render(); };
$("dim").onchange = e => { st.dim = e.target.value; render(); };
$("preset").innerHTML += Object.keys(MS.PRESETS).map(p => `<option>${p}</option>`).join("");
$("preset").onchange = e => { if (e.target.value) { const p = MS.PRESETS[e.target.value]; load({ where: p.where, weights: p.weights }); render(); } };
let timer = null;  // hypothetical outcome plots: each frame is one resample of the estimates
$("hops").onchange = e => { clearInterval(timer); st.hop = -1; if (e.target.checked) timer = setInterval(() => { st.hop++; render(); }, 650); else render(); };

document.addEventListener("ms-theme", render);
const shared = MS.specFromHash(); if (shared) load(shared);
render();
</script>
